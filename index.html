y-Winkle presses a warm, clean pinafore into your hands. \"Be kind to the old man,\" she says. \"He is very tired, and he has been alone in this garden so long he mistook the ink for company.\""], ["Mrs. McGregor's Pie", "The kitchen smells of rabbit pie, and every rabbit in the garden freezes. Then Mrs. McGregor sets the pie on the sill. \"It's carrot, dears,\" she says. She winks. Peter nearly faints."], ["A Third Letter", "A final letter lies on the garden wall. \"Dear Reader,\" it reads, \"I have been afraid for a very long time that when you stop reading, I stop. I have tried to stop first. Forgive me.\" The ink is shaking."], ["Mr. McGregor", "McGregor swings the rake, shouting. His eyes are black as wells, and his boots are wet with ink. \"There is no more garden!\" he howls. Peter squeezes under the gate. \"There is always a garden,\" he says."], ["The Beanstalk", "A green stalk as thick as a tower spirals into the clouds. Jack crouches at its base with an axe and a very crooked grin. \"Last time I climbed this,\" he says, \"I was only after gold.\""], ["Jack's Mother", "Jack's mother stands in the doorway, arms folded, a wooden spoon in hand. \"You'll be careful,\" she says. \"And you'll bring that boy back with his boots on.\" You nod. You will."], ["Daisy the Cow", "Daisy the cow stands solemnly at the base of the stalk, chewing. She was sold for beans. She has forgiven everyone. She lowers her head, offering a ride up the first branch. Her horns are polished."], ["The First Leaves", "The leaves of the stalk are the size of barn doors, and they wave like banners in the wind. Each one is blotted at the edge, like a page left too long in the damp."], ["The Harp Thief", "A lanky thief in a long coat drags a golden harp through the leaves. \"It sings too loudly,\" he mutters. \"The Blot would like it to hush.\" The harp strums a note of pure outrage."], ["The Bean Seller", "An old man with a sack of beans sits in the crook of a branch. \"I sold a boy a handful once,\" he says. \"Best deal I ever made, for him. Worst for me. Have a bean.\""], ["Cloud Road", "The beanstalk opens onto a road made of cloud, soft underfoot and white as fresh paper. Wherever you step, ink spreads and fades. A faint voice sighs: \"Somewhere, there's an ending in this.\""], ["A Thundercloud Fairy", "A small storm in the shape of a fairy zips around your head, crackling. \"The giants,\" she hisses, \"are not sleeping. They are being written asleep.\" She zaps a stray ink drop. \"Rude.\""], ["The Golden Hen", "A hen the color of sunrise lays an egg into your cap. \"Gold,\" she clucks, \"is only worth anything if you spend it on something kind.\" You tuck the egg away. It hums with promise."], ["The Giant's Hound", "Past the castle gate, a hound the size of a barn growls, ink dripping from jowls and hackles. \"He is only a good dog,\" Jack whispers, \"made bad by bad instructions.\" He offers a bone."], ["A Giant's Footprint", "A footprint the size of a duck pond holds a perfect little lake. Fish swim in it. A very small picnic floats on the surface. Whatever lives here is gentle, and afraid."], ["The Baby Giant", "A baby giant sits on the road, wearing a bib and weeping. \"They've locked the castle,\" he sobs. \"I'm hungry, and I can't read.\" You share a bean. He eats it, and hiccups, and smiles."], ["The Giant's Library", "Inside the giants' castle, shelves climb out of sight. Every book is the size of a door. All are blank. \"Dad's been reading,\" the Baby Giant whispers, \"and he doesn't like what he finds.\""], ["Harp Plays Softly", "The Harp plays a lullaby so gentle that even the ink drowses. \"Every story has a song,\" she sings, \"and every song has a hush. Do not fear the hush. It is how the next note begins.\""], ["The Sky Troll", "A troll sits under a bridge of cloud, extending a hand for toll. \"A story,\" he says, \"is the usual price.\" You tell him one. It takes an hour. He sniffles. \"Nobody ever asks me for the ending,\" he says."], ["Jack the Giant Killer", "A second Jack strides out of the fog, wearing a cloak and a very confident hat. \"Giants,\" says Jack the Giant Killer, \"are mostly bluster and bad posture.\" The first Jack frowns. \"I'm Jack too,\" he says."], ["Two Jacks", "The two Jacks look at one another across a table of clouds. \"We've told different tales,\" says one. \"But the beans,\" says the other, \"are the same.\" They shake. The ink backs off a step."], ["Magic Beans", "The Bean Seller hands you three beans. \"These grow what you need,\" he says, \"not what you want. Plant them in a place you are willing to look after.\" You pocket them. They hum."], ["The Giant's Kitchen", "In a kitchen vast as a cathedral, a cauldron boils the size of a swimming pool. The Giant's Wife stirs it with a ladle like a canoe. \"You'll stay for tea,\" she says. It is not a question."], ["The Giant's Wife", "She is huge, tired and unexpectedly kind. \"He's not wicked,\" she says of the Giant. \"He's lonely. The Blot told him it'd all be over if he just stopped. I rather think he believed it.\""], ["A Cup of Tea", "You sip a thimbleful of tea from a cup the size of a pond. The Giant's Wife tells you of the Giant's youth, a boy who loved songs. \"He stopped singing,\" she says. \"That's when I knew.\""], ["The Hidden Egg", "At the back of the pantry sits a single golden egg, humming with warmth. \"I kept it,\" the Giant's Wife says, \"for the day somebody came who knew what to do with it.\" She places it in your hands."], ["Storm Over the Stalk", "Black clouds roll in, and the beanstalk bends. Lightning crackles. The Thundercloud Fairy whoops, riding a gust sideways. \"Hold on!\" she shrieks, delighted. \"This is the best day of my life!\""], ["A Lullaby for Giants", "The Harp sings, and the whole castle sways. Giants, ink-heavy, yawn on their thrones. For one blessed minute, every enormous, grumpy creature on the stalk is asleep. Except one."], ["The Cloud Sprite", "A flickering cloud sprite flits out of nowhere and tries, hopelessly, to trip you. \"I'm supposed to be frightening,\" it says, abashed. \"I'm not good at it. Don't tell the Giant.\""], ["Fee-Fi-Fo-Fum", "A great voice rolls across the sky: \"FEE-FI-FO-FUM!\" The stalk shivers. The Baby Giant claps his hands over his ears. \"That's Dad,\" he whispers. \"He sounds worse than usual. He sounds sad.\""], ["The Great Hall", "The Giant's hall is a great echoing silence, a throne carved from a mountain and a table set for twelve, with eleven empty chairs. The ink has pooled in his bowl like cold soup."], ["Gold and Songs", "The Giant's treasury glitters, a mountain of coins, harps and goblets. Jack looks at it, then at you. \"I came for gold once,\" he says. \"I'd rather leave with something else this time.\""], ["The Giant's Song", "From the throne, the Giant begins to hum. It is wordless, deep, and old. The Harp joins in, and for one fragile moment the room is full of a lullaby, and the ink is tired."], ["The Beanstalk Giant", "The Giant rises, towering, ink dripping from his beard. \"I smell,\" he thunders, \"the blood of a Reader!\" Jack hoists his axe. \"Or the oldest friend you ever had,\" he says. \"Let's find out.\""], ["The Three Houses", "Three little houses stand at the end of a lane: one of straw, one of sticks, one of bricks. Smoke curls from the chimney of the third. A wolf's shadow slides across all three."], ["Straw and Sticks", "The Straw Pig waves from a window with a spoon. \"We have the best houses,\" he says, \"if you ignore the structural problems.\" The Stick Pig nods, tapping a beam. It wobbles."], ["The Brick Pig", "The Brick Pig works all day laying bricks and never complains. \"A house,\" he says, \"is a promise you keep to yourself.\" He opens his door wide. \"Come in. The porridge is just right.\""], ["Goldilocks Wanders In", "A girl with golden hair strolls out of the woods, sampling berries as she goes. \"I tried the porridge in three cottages,\" Goldilocks says. \"Not one was just right. Until the ink got into it.\""], ["The Chicken Thief", "The Chicken Thief creeps behind the henhouse, feathers in his hair, sack on his shoulder. \"I was told the story needed a villain,\" he whispers. \"I have never stolen a chicken before. Where do I start?\""], ["Three Bears at Home", "The Three Bears' cottage is quiet. Three bowls sit on the table, all empty, all stained black. Papa Bear grumbles. Mama Bear sighs. Baby Bear says, quietly, \"Somebody's been eating my story.\""], ["Henny Penny's Alarm", "\"The sky is falling!\" shrieks Henny Penny, flapping up the lane. She is not wrong. A black, dripping piece of sky has landed on the barn roof. Someone ought to tell the King."], ["The Gingerbread Man", "Something runs past you, yelling. It is a gingerbread man. \"Run, run!\" he cries. \"As fast as you can!\" A fox follows at a leisurely trot. You join the chase. It seems the polite thing to do."], ["A Cunning Plan", "The Cunning Fox leans on a fence post, picking his teeth. \"I never eat anyone,\" he says smoothly. \"I only offer them rides across rivers.\" He grins. \"Care for one?\" You politely decline."], ["The Wolf's Cub", "A wolf cub huffs and puffs at the Straw Pig's door, red in the face. The house does not fall. The cub sits down, defeated. \"Dad said this would be easier,\" he mutters. \"Dad lies.\""], ["A Cottage in the Woods", "You find a thatched cottage that smells of woodsmoke and bread. Inside, a girl in a cloak of rushes spins thread. \"Cap o' Rushes,\" she says. \"I love my father like meat loves salt.\""], ["Salt Love", "Cap o' Rushes tells you of the old tale: the king who banished his daughter for saying she loved him like salt. \"He understood too late,\" she says. \"Salt is how you know the meal was meant for you.\""], ["Tom Tit Tot's Spinning", "A little black imp spins at a wheel, humming. \"Tom Tit Tot, Tom Tit Tot,\" he sings. \"Guess my name, and the girl goes free.\" You don't know it. The Blot does, and it is not telling."], ["A Name Is a Power", "Tom Tit Tot spins faster. \"Names are the oldest magic,\" he grins. \"Tell me yours, Reader, and I will tell you the ending.\" You hold your tongue. It is, for once, the right call."], ["Tom Tit Tot", "The imp cackles and spins you into a corner. \"Guess my name!\" he shrieks. \"Guess my name, or lose your own!\" Goldilocks leans in. \"Is it Ned?\" she asks. \"Is it Sam? Is it Mark?\""], ["The Three Little Pigs' Feast", "The three pigs set a table together, straw, sticks and bricks, and serve soup and cornbread to everyone who passes. \"A house,\" says the Brick Pig, \"is only as good as the people you let in.\""], ["Gingerbread Gambit", "The Gingerbread Man scampers up a fence and sticks out his tongue at the Fox. \"Can't catch me!\" he cries. The Fox only smiles. \"I wasn't trying to,\" he says. \"I was only leading you here.\""], ["Baby Bear's Chair", "Baby Bear's chair has a crack in it, black and bright at once. \"Somebody's been sitting in my chair,\" he whispers, \"and wrote their name on the back.\" It says only: \"End.\""], ["The Hag of the Wood", "Black Annis stalks out of her cave, long-armed, blue-faced, humming a lullaby that curdles the milk. \"I eat bad children,\" she says. \"And good ones who ask too many questions.\" She smiles."], ["Black Annis", "Black Annis fills the cave mouth, claws like harrow tines, ink pooling at her heels. \"Come in,\" she croons. \"I'll tell you how it ends.\" The Three Bears stand behind you, solid as hills."], ["Goldilocks Chooses", "Goldilocks holds three bowls: too hot, too cold, just right. \"I'm tired,\" she says, \"of picking the middle one. Today I want the hot one.\" She eats it, red-faced, triumphant. The ink hisses."], ["The Brick House Holds", "The wolf's cub huffs and puffs, then his father arrives. The brick house stands. Papa Bear, quietly, props it up from behind. The pigs sing a very off-key chorus of \"Not by the hair of my chinny chin chin.\""], ["A Pot of Salt", "Cap o' Rushes presses a pot of salt into your palm. \"For when everything tastes of nothing,\" she says. A pinch on your tongue and the whole world comes back, sharp and bright and kind."], ["Henny Penny's Report", "Henny Penny races up with Chicken Licken, Ducky Lucky and Turkey Lurkey in tow. \"The sky has fallen at the Wolf's!\" she cries. \"The King must hear!\" The King, as ever, is on his way. Eventually."], ["The Fox's Offer", "The Cunning Fox offers you a ride across a river. \"A very safe back,\" he says. You look at his grin, and the river, and the ink in his fur. \"I'll swim,\" you say. He sighs. It was worth a try."], ["The Wolf at the Door", "Midnight. The wind rises. At the end of the lane, a pair of green eyes glow. The Big Bad Wolf pads toward the brick house, dragging a sack full of ink. \"Little pig,\" he says softly."], ["Huff and Puff", "The Wolf huffs. The Wolf puffs. The straw house flutters. The stick house shudders. The brick house stands, humming. Inside, three pigs and two bears share a bowl of soup. \"He can't,\" they say. \"Surely he can't.\""], ["The Wolf's Sorrow", "The Wolf slumps against the wall. \"Every time,\" he says, \"I huff and puff, and every time it ends the same. A boiling pot. I should like, just once, to be invited to supper.\""], ["A Place at the Table", "The Brick Pig cuts a place at the table. \"I don't promise you won't be eaten,\" he says, \"but I do promise you won't be alone.\" The Wolf stares at the empty chair. The ink in his fur trembles."], ["The Big Bad Wolf", "The ink surges, and the Wolf howls, huge and black-furred, ink pouring from his jaws. \"No!\" he roars. \"I will huff, and I will puff, and I will blow the Book away!\" The chair is knocked flat. The house still stands."], ["Sing a Song of Sixpence", "Mother Goose Lane is a village of rhymes, and every rhyme is off. The pie has twenty-three blackbirds, the kettle will not sing, and a very worried Jack is stuck on a hill with a pail."], ["Muffet's Tuffet", "Little Miss Muffet sits on her tuffet, curds and whey in her lap, and does not run from the spider. \"I'm tired of being frightened,\" she says. \"Let's see how he feels about my bowl.\""], ["Jack and Jill's Hill", "Jack and Jill stand at the foot of the hill with an empty pail and a heavy sigh. \"Every time,\" says Jill, \"we fall down and break our crowns.\" Jack nods. \"Let's try going around.\""], ["Little Jack Horner", "Little Jack Horner sits in a corner with a Christmas pie, a thumb in the crust, and a very suspicious plum. \"I said what a good boy am I,\" he says. \"But the Blot said otherwise.\""], ["The Wall Guard", "A brick-faced guard stands in front of Humpty's Wall with a halberd and a very stiff neck. \"No one passes,\" he says. \"Not until the king's horses and men are properly re-assembled.\""], ["Bo Peep's Sheep", "Little Bo Peep wanders the meadow with an empty crook and a worried face. \"I lost my sheep,\" she says. \"They will come home, leaving their tails behind them. Unless the ink gets them first.\""], ["Simple Simon's Pieman", "Simple Simon meets a pieman going to the fair, and offers him a penny. The pieman bows. \"Show me first your penny,\" he says. The ink in his pie tastes of arithmetic and disappointment."], ["Old King Cole", "Old King Cole, a merry old soul, calls for his pipe, calls for his bowl, and calls for his fiddlers three. But the fiddlers are late, and the king is frowning. \"Who has stolen the tune?\""], ["Mary, Mary", "Mary, Mary, quite contrary, tends her garden with silver bells and cockle shells. \"My garden's growing backward,\" she says, bemused. \"It's very rude of it. I like it, though.\""], ["Old Mother Hubbard's Dog", "Old Mother Hubbard's cupboard is bare. Her poor dog is not poor at all, but enormous and furious, with an ink-black snout. \"I only wanted a bone,\" he whimpers. \"Instead I got a plot.\""], ["The Old Woman's Shoe", "A very large old shoe sits at the end of the lane, full of children. The Old Woman in the Shoe stands in the doorway with a ladle. \"I know exactly what to do,\" she says. \"Feed them.\""], ["Wee Willie Winkie", "Wee Willie Winkie runs through the town in his nightgown, knocking at the window. \"Are the children all in bed?\" he cries. \"It's past eight o'clock!\" Nobody has ever been so relieved to hear it."], ["A Cat and a Fiddle", "The cow jumps over the moon, the dish runs away with the spoon, and the cat plays the fiddle with the perfect poise of someone who has long since stopped asking why."], ["The Crooked Mile", "A crooked man walks a crooked mile, finds a crooked sixpence by a crooked stile. The whole path wobbles. \"The Blot did this,\" he says. \"It straightened my life, and I wept for the kinks.\""], ["The Crooked Man", "The Crooked Man leans on a crooked cane, crooked grin, crooked eyes. \"Everything bends,\" he says. \"Everything crooks. I have made peace with it.\" He waits. \"Haven't you?\" Ink seeps from his sleeves."], ["Humpty's Great Fall", "Humpty Dumpty sits on the wall and does not fall. \"Every day,\" he says, \"I wait for it. I have grown used to the waiting.\" All the king's horses and men look on, anxiously, with glue."], ["Mother Goose's Cottage", "You find Mother Goose's cottage empty. The tea is cold. The fire is out. A note on the table, in a trembling hand, says only: \"He took me to the Last Page. Please. He is not cruel, only very tired.\""], ["The Last Rhyme", "The nursery rhyme wall in the cottage has every verse scrawled on it. The last line of each has been smeared out. In the margin, someone has written: \"I'm sorry. I don't know how to stop.\""], ["The Pied Piper's Rats", "Rats pour down the lane in a black tide, led by a piper whose tune is out of the Blot. They do not bite. They only carry off the last words of every rhyme, and the children's songs go quiet."], ["The Piper's Rat", "The biggest rat of all sits on a barrel, wearing a feathered cap, smoking a tiny pipe. \"I follow the song,\" he says. \"Whoever pays me, whoever plays me. This time it was the ink.\""], ["The Fiddlers Three", "Old King Cole's fiddlers tune up in the town square, scraping and wincing. It is the worst sound you've ever heard and the most beautiful. It drives back the ink a full yard."], ["A Pocket Full of Rye", "You find a pocket full of rye, the rye has gone to blackbirds, and the blackbirds are singing a very old song. \"Four and twenty,\" chirps one, \"and not a care in all the world.\""], ["A Spider on the Tuffet", "The spider sits down beside Miss Muffet. Neither screams. \"I only wanted to be introduced,\" he says sheepishly. Miss Muffet offers him some whey. \"We could try again,\" she says, \"from the beginning.\""], ["Bo Peep's Flock", "Over the hill, the sheep come bounding, tails behind them, and Bo Peep weeps with joy. \"They remembered the way,\" she says. \"Every story remembers its way home, if you leave a light on.\""], ["The Giant Spider", "A spider as big as a cart drops from the lamppost, ink dripping from its fangs. \"Boo,\" it says, dully. \"I'm supposed to say boo.\" Miss Muffet stands, holding her bowl. \"Boo yourself,\" she says."], ["The Queen of Tarts", "A grand lady in a red-and-white apron bustles up the lane. \"The Queen of Hearts,\" says Mary, \"made some tarts one summer's day.\" \"And all on a summer's day,\" says the lady, \"they were stolen.\""], ["The Knave Was Framed", "The Knave of Hearts is dragged into the lane by an ink-black crowd. \"I didn't steal them,\" he says. \"I was handed the tray.\" The crowd, with a sigh, tosses him a handkerchief."], ["The Baker's Dozen", "Thirteen loaves rise in the oven. The baker, red-faced and floury, counts them twice. \"Nobody ever gets the thirteenth,\" he says. He cuts it up and hands it round. \"That's what it's for.\""], ["A Lullaby at Dusk", "Mother Goose's lullaby floats down the lane, faint and cracked, from a window high above the town. The ink rolls back, stunned. Every window glows. Every child hears a story they know."], ["The Queen of Tarts", "The Queen of Tarts rises behind a wall of sugar and ink, a rolling pin in each hand. \"A tart for every rhyme,\" she thunders, \"and not a single ending!\" She hurls a pastry. It is explosive."], ["Fog Over London", "Victorian London sleeps beneath a yellow fog, lamp-lit and sooty. A small boy stands at the corner with an empty bowl and the biggest eyes you have ever seen. \"Please, sir,\" says Oliver. \"I want some more.\""], ["Oliver's Request", "The workhouse door creaks behind Oliver. \"They said there'd be a better ending,\" he tells you. \"I don't understand how a story can end in a bowl of gruel.\" You give him bread. He eats it slowly."], ["Tiny Tim", "Tiny Tim sits on his father's shoulder at the foot of Cratchit's lane, grinning at the snow. \"God bless us, every one,\" he says. A little black ink splashes the end of the line. He wipes it off, cheerfully."], ["The Artful Dodger", "A boy in a battered top hat tips it at you and lifts your wallet in the same motion. \"Beg pardon,\" says the Artful Dodger. \"Habit. Now, since you've caught me, would you care to hire a guide?\""], ["The Workhouse Master", "The Workhouse Master stands in his doorway, ink-stained fingers drumming on his ledger. \"Everyone has a place,\" he says, \"and a final entry.\" He turns the page and writes \"END\" with a flourish."], ["Pip's Great Expectations", "Pip, a blacksmith's boy in a very new coat, stands at the foot of a rotting mansion. \"I was promised a fortune,\" he says. \"I believe I was promised the wrong one.\" He looks at you. \"Shall we?\""], ["Cratchit's Counting House", "Bob Cratchit blows on his fingers, scratching figures in a ledger, in a cold counting house at the edge of the Thames. \"Everything balances in the end,\" he says. \"Provided you tilt it kindly.\""], ["A Bell Tolls", "At the corner, a bell begins to toll, tolling for something that has not yet happened. A man in chains drifts down from the fog. \"Jacob Marley,\" he murmurs. \"I am here to warn you of an ending.\""], ["Marley's Warning", "Marley rattles his chains, a ghost in a tattered waistcoat. \"I forged this chain,\" he says, \"link by link, in life. The Blot offers the same trade, link by link. Do not take it.\""], ["The Gaslight Thug", "A thug steps out of the gaslight, cracking his knuckles. \"The Blot says I'm in this scene,\" he says, blinking. \"I don't remember joining it. Would you mind if I just sat down?\" He sits."], ["Fezziwig's Ball", "Old Fezziwig throws open his warehouse doors and calls the whole street in for a dance. \"Every night,\" he says, red-cheeked and delighted, \"is a little holiday, if you share your music.\""], ["Nancy's Candle", "Nancy slips out from the shadows with a lamp and a worried glance. \"I know the way to the rookery,\" she whispers, \"but be quick. They have been writing everyone into the last chapter, and I don't intend to appear.\""], ["Rookery Streets", "The rookery is a maze of crooked streets and low doors. Washing lines drip ink. At every corner, a child watches, waiting for someone to tell them whether it is safe to hope."], ["Scrooge's Counting", "In his cold counting-house, a man sits with a candle and a closed heart. \"Humbug,\" says Scrooge. The ink at his elbow is more than a stain. It has become a second signature. \"I have no patience for stories.\""], ["The Debt Collector", "The Debt Collector adjusts his spectacles and slides an invoice across the table. \"Your total,\" he says, \"is everything. That includes your future. Please sign at the bottom.\" It is a very long bill."], ["The Ghost of Christmas Past", "A small gentle spirit holds a candle that never goes out. \"Come,\" she says to Scrooge, \"and see what you were.\" The ink recoils from her light. For once, the past is kinder than the future."], ["A Christmas Past", "A boy sits alone in a schoolroom while the others go home. A girl comes to fetch him. \"Come away, Ebenezer,\" she says. He had forgotten how it felt to be loved. The ink in his chest begins to melt."], ["The Ghost of Christmas Present", "A towering spirit with a holly crown and a torch of plenty tosses a feast across the table. \"Look about you,\" he booms. \"This is the day. It is the only day there is.\" The ink flinches at the laughter."], ["Cratchit's Supper", "The Cratchits share a goose barely large enough for four, and a pudding for six, and pass it round with such joy that you forget to be hungry. Tiny Tim says grace. Even Scrooge takes his hat off."], ["Fagin's Fence", "A hunched old man in a ratty coat leans out of a window, a goose in each hand. \"I fence what the boys find,\" says Fagin's Fence. \"I am a small man in a large trade.\" He tosses you a purse. It is empty."], ["Dodger's Dilemma", "The Artful Dodger stands between you and the gang, hat tilted. \"I picked your pocket,\" he says. \"It's my profession. I'd prefer to pick a side.\" He takes his hat off. \"I'm on yours.\""], ["Scrooge Awakens", "Scrooge leaps out of bed on Christmas morning, laughing like a madman. \"I'm as light as a feather,\" he cries. \"I'm as happy as an angel! A merry Christmas to everybody!\" The ink in his handwriting fades."], ["A Turkey for Tiny Tim", "Scrooge buys the biggest turkey in London and sends it to the Cratchits. \"Don't tell them it was me,\" he says. The Narrator, listening, makes a small sound. It sounds like a man wiping his eyes."], ["The Last Candle", "You reach the docks, where a single candle burns on a post. Somewhere out in the fog a man is washing blood off his hands. \"He's still at it,\" says Nancy. \"I hoped he wouldn't be.\""], ["A Pickpocket's Fall", "A small pickpocket tries to lift your purse and discovers it is a pineapple. He blinks at you. \"I'm new,\" he says. \"They only told me the plan. Not what it was for.\" You shrug. \"Nobody does.\""], ["Nancy's Warning", "\"Don't go to the bridge,\" says Nancy. \"There is a man waiting who has forgotten how to stop. He is the worst I know.\" She presses a coin into your hand. \"If I don't come back, it was worth it.\""], ["London Bridge at Midnight", "You wait at the bridge under a thin moon. The river shivers with ink. A massive silhouette stands at the far end, a dog at his heel, a cudgel on his shoulder. He is whistling."], ["Oliver's Courage", "Oliver steps out of the fog, small but unflinching. \"I asked for more,\" he says, \"once. I would like to ask again, if I may. I would like more story. Please.\" Nobody on the bridge can look away."], ["Sikes Comes for Them", "Bill Sikes strides into the lamplight, cudgel in hand, ink pouring from his sleeves. \"You've written your last scene,\" he growls. Behind you, the whole of London, ghosts and orphans alike, stand up."], ["Bill Sikes", "The cudgel swings, and Sikes roars into the fog. His dog whines at the foot of the bridge. \"Don't,\" says Nancy. You hold up a hand. Not for him. For the dog, who has been loyal all along."], ["221B", "Baker Street is wrapped in fog and gaslight. At the top of the stairs, a door stands ajar, a violin playing inside. A man in a dressing gown turns, cheerful and sharp. \"Ah,\" says Sherlock Holmes. \"The Reader. I expected you at four.\""], ["The Case of the Missing Pages", "\"A page is torn from the Book,\" says Holmes, steepling his fingers. \"A theft without a thief, a crime without a motive, a culprit who writes the world as he goes. Fascinating.\" He grins. \"Come along.\""], ["Mrs. Hudson's Tea", "Mrs. Hudson presents tea and scones with a look that says she has seen worse in this very sitting room. \"Don't get ink on the carpet,\" she warns. \"I will not be replacing it. Again.\""], ["Watson's Notes", "Dr. Watson sits at the desk, writing steadily. \"I record,\" he says, \"what Holmes observes and I try to make sense of it.\" The ink on his page is perfectly ordinary. It is an enormous relief."], ["The Garrotter", "A garrotter steps out of an alley with a length of wire and a nervous cough. \"I'm supposed to be sinister,\" he says. Holmes raises an eyebrow. \"Then do try not to apologise,\" he says, \"midway through.\""], ["Toby on the Trail", "Toby the bloodhound snuffs the pavement with great dignity. \"He has never been wrong,\" says Holmes. Toby sneezes, glares at a lamp-post, and turns, with firm resolve, toward the docks."], ["Lestrade Looks In", "Inspector Lestrade bursts in, red-faced. \"Holmes! A body in the Thames, a page in its pocket, and every witness insisting the fog speaks!\" Holmes blinks. \"Splendid. I do love a case that talks back.\""], ["The Irregulars", "Wiggins and the Baker Street Irregulars troop in, sooty and grinning. \"We heard there was a crime,\" says Wiggins. \"And a shilling.\" Holmes pays them in advance. \"For the shilling,\" he says, \"I'll require the crime.\""], ["The Docks", "The docks smell of tar and secrets. Crates stand in towers. A guard in a heavy coat blocks the gangway, his boots black with a substance that is not mud. Holmes looks at the bootprints and smiles."], ["The Docklands Guard", "\"You'll want to turn back, sir,\" says the Docklands Guard. His voice is flat and carefully rehearsed. \"There is nothing here to see.\" Holmes smiles. \"My dear fellow, you've just told me everything.\""], ["Billy the Page", "Billy the page brings a telegram on a silver tray. It reads, in a hand you almost recognize: \"THE NARRATOR KNOWS TOO MUCH. —A FRIEND.\" Holmes reads it twice and says nothing, which is, for Holmes, loud."], ["Mycroft Calls", "Mycroft Holmes lowers himself into the armchair, huge and unhurried. \"The government,\" he says, \"has noticed the pages are going missing. The government would like you to make it stop. Quietly.\""], ["The Diogenes Club", "In the hushed, hallowed Diogenes Club, no one speaks. The silence is enforced with chilly glances. Mycroft slides a folded paper across the table: a map to the one house in London that is still blank."], ["A Hound on the Moor", "From the foggy moors comes a baying, a deep, ghastly howl. \"The Hound of the Baskervilles,\" Watson whispers. Holmes tilts his head. \"A hound,\" he says, \"with a very poor imitation of conviction.\""], ["The Hound of the Moor", "The hound looms out of the fog, jaws glowing, ink in his fur. \"It is not the dog's fault,\" says Holmes calmly. \"He has been told he is a monster. Few of us argue well with that.\""], ["Irene Adler's Photograph", "Irene Adler sweeps in with a rustle of silk and an unreadable smile. \"Mr. Holmes,\" she says. \"You are about to be very wrong about a woman.\" She tucks a photograph into your hand. It is of a quill."], ["The Reichenbach Whisper", "A shiver runs down the street. \"Moriarty,\" says Holmes. \"The Napoleon of Crime. Whatever the Blot has promised him, he has bought, and believed.\" He draws his coat tight. \"This will be difficult.\""], ["Holmes Deduces", "Holmes paces the sitting room, hands behind his back. \"The narrator,\" he says, \"is always the one who knows too much. I will not say whom I suspect. But I shall be watching the margins.\""], ["Watson's Revolver", "Watson draws his service revolver, cleaning it with great care. \"In my experience,\" he says, \"the worst threats are the ones that look like inconveniences.\" He loads six chambers. \"Shall we?\""], ["Colonel Moran", "Colonel Sebastian Moran, the finest shot in the Empire, sits behind a window with an air-gun. \"I was promised the shot of my career,\" he says. \"I do hope you don't duck.\" Holmes does, elegantly."], ["The Game Is Afoot", "Holmes, Watson, and a small army of urchins race across the rooftops of London, laughing. Behind them, the ink spills across slates and chimney pots in great black waves."], ["Mrs. Hudson Rises", "Mrs. Hudson stands on the stairs with a frying pan and an expression that has frightened better men than a thief. \"Not on my carpet,\" she says. The thief decides not on her carpet."], ["The Final Problem", "\"The Napoleon of Crime,\" says Holmes, rolling a coin across his knuckles, \"believes that the ending is a puzzle, and that he alone has the solution. We shall have to disappoint him.\""], ["The Falls", "Switzerland, a roaring waterfall, a path wide enough for two. Moriarty's silhouette waits at the rail. \"Mr. Holmes,\" he says. \"I had hoped it would be tidier.\" The ink crackles in the mist."], ["The Urchin Spy", "A street urchin sidles up, offering a map for a shilling. It is blank. \"I'm a spy for the Professor,\" he whispers. \"I'm very bad at it. Please don't tell him.\" Holmes tips him a half-crown."], ["Holmes Explains", "Holmes lays out the case on the lip of the Falls. \"A criminal,\" he says, \"who wants no more crimes. A storyteller who hates the story. An author who is afraid. The motive is grief. The method is ink.\""], ["Watson Stays", "\"I'll not leave you, Holmes,\" says Watson, quietly. \"Not even for this.\" Holmes's smile is nearly a flinch. \"No,\" he says. \"I don't suppose you would.\" The two men stand side by side at the edge."], ["Moriarty's Terms", "Moriarty offers Holmes an enormous deal: the world's mysteries, solved and sealed, in exchange for one small ending. \"You'd be bored,\" says Holmes. \"A mystery that is solved forever is a coffin.\""], ["Fog on the Water", "The fog clings to the Falls, and from it an enormous shape swells, Moriarty's shadow, tall as a house. \"The Reader!\" it booms. \"My friend Mr. Holmes has been so very eloquent. Shall we see how you fare?\""], ["Professor Moriarty", "Moriarty strides across the wet stone, his coat flaring in the spray. \"One chapter,\" he says softly, \"to end every chapter. Let us see which of us is the better author.\" He draws."], ["The Spyglass Inn", "The Admiral Benbow smells of tar and rum and salt. A map lies unrolled on the bar, the island drawn in ink that is still wet. A boy named Jim Hawkins is staring at it with grim, delighted fear."], ["Squire Trelawney's Plan", "Squire Trelawney thumps the table and announces an expedition. \"The Hispaniola,\" he says, \"shall sail at dawn, and I have not told a soul!\" Dr. Livesey closes his eyes. \"You've told the whole inn.\""], ["Long John Silver", "A one-legged cook, a parrot on his shoulder, rolls into the inn with a grin as wide as the sea. \"John Silver,\" he says, tipping an imaginary hat. \"I'll be your cook, and your friend, and your guide.\""], ["Captain Smollett", "Captain Smollett inspects the crew with the face of a man who has found a flaw in every plank. \"I don't like the mission,\" he says. \"I don't like the crew. I don't like the cook. Cast off.\""], ["Blind Pew", "A blind beggar taps his way down the quay, cane clicking, voice rasping. \"Black spot,\" he says, pressing something into your hand. It is a black circle, blotted with ink that is not his. \"You've been marked.\""], ["The Hispaniola Sails", "The ship slides out onto the water, sails full. The sea glitters. Jim stands at the rail, wind in his hair. \"I've never been so happy,\" he says. \"I've never been so frightened. It's the same thing.\""], ["The Apple Barrel", "Jim climbs into the apple barrel to fetch an apple and stays to hear a mutiny being planned over his head. \"Silver,\" he whispers. \"Silver, of all people.\" He bites the apple, very quietly."], ["Livesey's Counsel", "Dr. Livesey and Captain Smollett hold a hushed council on the quarterdeck. \"We've been cheated,\" says the doctor, \"by an honest face. It's the oldest trick and I fell for it. Do be careful.\""], ["Treasure Island", "The island rises from the sea in the morning mist, humped and green, a pirate's bad dream. Palm trees, white sand, a stink of rot. Jim leans over the rail. \"It looks hungry,\" he says."], ["Black Dog", "A bulky sailor with two missing fingers steps out of the fog on the beach. \"Black Dog,\" he says, in a voice like a rusty hinge. \"I've an old score with this lot. Hand over the map.\""], ["Ben Gunn", "A wild, ragged figure leaps out from behind a rock. \"Cheese!\" he shrieks. \"Have you any cheese? I've been marooned three years and dreamed of nothing else.\" He weeps at a crumb. You hand it over."], ["The Stockade", "The old log stockade squats in a clearing, built by long-dead pirates to defend long-lost gold. The Squire's party barricades itself inside, loaded muskets poking out like quills."], ["Gray's Choice", "Abraham Gray, a young sailor, stands between the stockade and the mutineers. \"I'll go with the doctor,\" he says. \"I don't much like pirates.\" A cheer goes up behind him. He is mortified."], ["A Spyglass in the Dark", "At night, the sea turns to black glass. A lantern bobs on the water. Jim peers through his spyglass and sees the Hispaniola, ghostly and empty. Someone has cut her cable. Someone is coming."], ["Israel Hands", "The coxswain Israel Hands claps a dagger between his teeth and climbs the shrouds after Jim. \"Come down, boy,\" he croons. \"There's a good lad.\" Jim, trembling, produces a pistol. \"I don't think so.\""], ["The Black Spot", "Silver hands you the black spot, grinning. \"It's tradition,\" he says. \"I'd not take it personal.\" You look at it. The ink is wet. It is all the same size as a promise. You fold it away."], ["A Parrot Squawks", "Silver's parrot perches on a mast and shrieks: \"Pieces of eight! Pieces of eight!\" The ink drips from his feathers. \"He's been saying it for a hundred years,\" Silver murmurs. \"He has no other lines.\""], ["Crusoe's Footprint", "Alone on a beach, a lean, bearded man crouches by a single footprint. \"Robinson Crusoe,\" he says, standing, \"twenty-eight years on an island. And I learned this: you are never alone if you can tell a story.\""], ["The Map Reads Back", "The treasure map shivers in your hand, and a line of ink creeps in from the margins. It spells: \"X marks the spot where all stories end.\" Silver reads over your shoulder. \"That's no pirate hand,\" he says softly."], ["Captain Flint's Parrot", "The parrot stares into your eyes, unblinking, and speaks in a dead man's voice: \"Darby M'Graw. Fetch aft the rum, Darby.\" It is the voice of Flint himself. It has been reading him all along."], ["Silver's Choice", "Silver turns, cutlass in hand, and for a long, long moment he does not say a word. \"I like a good profit,\" he murmurs. \"But I do not like being written.\" He flips the cutlass. \"I'm with the boy.\""], ["The Cave of Gold", "Beyond a wall of vines lies the cave, and in it, a heap of gold, glittering as a dragon's dreams. Jim pokes the pile with a toe. \"It's lovely,\" he says, \"and it's not what we came for.\""], ["The Chest", "Among the coins sits a battered sea-chest. Inside is no treasure, only a single, child-sized notebook, its first page written in a wobbly pencil: \"The Boy Who Was Never Bored.\" You close it gently."], ["The Notebook", "The notebook has twenty pages. Each is a story, careful, imperfect, adored. On the last, a child has written: \"Please don't ever stop.\" The Narrator's voice, suddenly small: \"I wasn't supposed to leave that here.\""], ["Mutinous Sailors", "A band of mutinous sailors in tattered coats stand across the beach. \"We were promised gold,\" says their leader. \"Not another story.\" Silver holds up the notebook. \"Then you shall have an even bigger treasure,\" he says."], ["Flint's Ghost", "A pale shape rises from the sand: Captain Flint, grey-bearded, hollow-eyed, a cutlass in one hand and an inkpot in the other. \"I buried it,\" he says, \"so no one would find the ending. It found me.\""], ["Smollett Holds the Line", "Captain Smollett steps forward, hat tilted. \"I will not be rude to a ghost,\" he says. \"But I will be extremely firm.\" The ghost, taken aback, looks at his own boots. They are blotted black."], ["Jim Takes the Notebook", "Jim lifts the notebook from the chest and holds it out to the ghost. \"Is this yours?\" he asks. The ghost's face crumples. \"It was never mine,\" he whispers. \"I only guarded it. And I guarded it wrong.\""], ["Fifteen Men", "The cliffs echo with an old sea shanty, \"Fifteen men on the dead man's chest!\" Every pirate and mutineer on the island sings along. It is the most anyone has agreed on in a hundred years."], ["Captain Flint's Ghost", "Flint's ghost swells, grey and ink-black, a storm on the sand. \"Yo ho ho,\" he moans, and the sea rises with him. Silver spits, adjusts his crutch, and draws. \"And a bottle of rum,\" he says."], ["A Midsummer Night", "The wood under the moon glows violet, and the trees breathe slowly. The air smells like honey and magic. A tiny figure in a cap of green leaves leaps onto your shoulder. \"Hello, Reader,\" says Puck. \"I hoped you would come.\""], ["Puck's Wager", "Puck tosses an acorn, catches it behind his back. \"I'll wager,\" he says, \"that you can't get through one night in this wood without falling in love with something absurd.\" You shrug. You are not so sure."], ["Peaseblossom's Dew", "Peaseblossom leaves a thimbleful of dew on your tongue. \"It will help you see,\" she whispers. \"The wood is only mischief and moonlight, but the ink in it is real.\" You blink. You see the ink."], ["Cobweb's Net", "Cobweb spins you a cloak of silver thread, impossibly fine. \"A fairy's gift is a kindness with no price,\" she says. \"Though some might call it an investment.\" She winks, and spins another."], ["The Thorn Fairy", "A fairy with thorn wings hovers in the dark, spitting black. \"The queen has forgotten how to dance,\" she hisses. \"I will remind her with brambles.\" She is crying. The tears are ink."], ["Moth's Light", "Moth flits down, wings dusty, eyes huge. \"I carry a lantern,\" he says. \"It is very small. It is also the only thing in the wood that hasn't been told what to do.\" He lights the way."], ["Mustardseed's Sting", "Mustardseed hops up and down on a mushroom, pepper-hot with rage. \"I am a seed,\" he says. \"Seeds are not afraid of being buried. Seeds are born that way.\" He stings a passing ink-drip. It sizzles."], ["Lovers in the Wood", "Lysander and Hermia run through the trees, hand in hand, tangled in vines and quarrels. \"I don't love you any more,\" cries Lysander, \"since I'm bewitched!\" Hermia stamps her foot. \"That is a ridiculous excuse.\""], ["Hermia's Fury", "Hermia stands her ground, small and furious. \"I am quite certain,\" she says, \"that it is possible to be little and fierce.\" She kicks a mushroom, and it bursts into butterflies. The wood applauds."], ["The Weaver Transformed", "Nick Bottom, the weaver, has been changed into an ass. He is delighted. \"Hee-haw!\" he says. \"I always wanted to be a donkey, in a way, and now I am, in every way, and very dignified.\" He bows."], ["The Mechanicals Rehearse", "Six workmen rehearse a play in a clearing, disastrously: Pyramus and Thisbe, with a lion, a wall, and a very nervous moon. \"We shall make them weep,\" says the director. \"With laughter.\""], ["Puck Winks", "Puck whispers into your ear: \"I've broken the fourth wall, Reader. I'm so sorry. I've seen you reading. You have kind eyes. The Narrator has them too. Don't tell him I said so.\""], ["Titania's Bower", "A great flowering bower opens in the moonlight. Titania, queen of fairies, reclines on a bed of petals, lit by a thousand glowworms. She is exhausted. \"I have been dancing since the dawn of time,\" she says."], ["The Moonlit Mothling", "A giant moth spirals out of the dark, furry, ghostly, ink-streaked. It lands on your shoulder, heavy as a coat. \"I only wanted the light,\" it says. \"I didn't know it would burn.\""], ["The Mothling's Fall", "The moth drops into your hands, wings smoking. \"Tell the queen,\" it whispers, \"that the lantern was worth it.\" Peaseblossom, weeping, takes it gently. \"We'll make it a bed,\" she says. \"A soft one.\""], ["Oberon's Quarrel", "Oberon and Titania quarrel in a dell. \"You've given the child to that mortal!\" he cries. \"You've given the wood to that ink!\" she says. Both are right. Neither listens. The wood shudders."], ["A Dream within a Dream", "Puck tells you a story: that all of this is only a dream, that nothing in the wood is real. The ink in the story tastes of ashes. \"That's what the Blot says,\" he adds. \"It's a lie, of course.\""], ["The Fairy Ring", "You step into a ring of toadstools and the wood goes silent. Fairies dance around you in slow, spiraling lines. A gentle voice, a hundred voices: \"Rest, Reader. You have been so brave. You may stop.\""], ["The Rest You Cannot Take", "You nearly lie down. The grass is so soft. Then Moth, from your shoulder, blazes once with his tiny lantern. \"Not yet,\" he whispers. The ring flickers. You rise, aching, and walk on."], ["The Hobgoblin", "A hobgoblin pops out of a hollow, mischief gone sour. \"I'm not meant to be frightening,\" he says. \"I'm meant to be funny. But the Blot said funny wasn't enough.\" He pulls a face. It is a scary one."], ["Lysander's Apology", "Lysander kneels before Hermia, drenched in dew and apology. \"I was bewitched,\" he says. \"No,\" says Hermia. \"You were silly. There's a difference.\" He kisses her hand. She lets him."], ["Puck's Spell", "Puck sprinkles a drop of purple juice on your eyelids. \"For clarity,\" he says. The wood sharpens. Each tree, each toadstool, each fairy blazes like a lantern. Even the ink has an outline now."], ["The Mechanicals' Triumph", "The workmen finally stage their play, a riot of misplaced lines and wall dust. The wood watches in stunned silence. Then it erupts. Titania herself weeps with laughter. The ink in the audience dissolves."], ["A Dance for the Queen", "Titania rises from her bower and begins to dance. The glowworms follow. The fireflies follow. The whole wood follows. For the first time in a long while, the ink is only an afterthought."], ["The Sprite's Prank", "A little sprite zips up and plants a custard pie in your face. \"That's not in the script!\" he shouts, appalled and thrilled. You wipe it off. \"Neither is that,\" you say, and sling it back."], ["Oberon's Return", "Oberon steps out from behind an oak, thin and shadowed. \"I have been in the dark,\" he says, \"dreaming of nothing. It is a peaceful place. I'd forgotten the wood could be anything else.\""], ["The Shade of Oberon", "A second Oberon steps out of the first, black as ink, a cloak of nightmares around his shoulders. \"I'm what he left behind,\" says the Shade, sadly. \"When he wearied of the tale, I took over.\""], ["Puck Falls Silent", "Puck, for once, stops talking. He sits on a stone, small and quiet. \"I never meant it to be so serious,\" he says. \"I only wanted to make people laugh. That's all any of us wants.\""], ["If We Shadows", "Puck stands, brushes off his knees, and turns to you with a sudden hush. \"If we shadows have offended,\" he says, \"think but this, and all is mended: that you have but slumbered here.\" He bows."], ["Oberon's Shade", "The Shade of Oberon rises, huge and shapeless, ink swirling around a crown of thorns. \"Sleep,\" it thunders. \"Sleep, and let the dream end gently.\" The wood trembles. Titania raises her scepter. \"Not tonight.\""], ["The Moor in Mist", "The Highlands unroll in heather and fog, wild and wet and indifferent. A piper's lament hangs in the air like smoke. Somewhere, three women stir a cauldron and hum a very old song."], ["Janet at Carterhaugh", "Janet kneels at a mossy well in her green gown, picking a single rose. \"I have waited,\" she says, \"a very long time to be asked if I need help. Don't be shy. I do.\""], ["The Highland Piper", "A lone piper on a crag plays a tune that makes the mist stand still. \"It's a lament,\" he says. \"For tomorrow. Someone has taken it away, and I've been playing for it ever since.\""], ["Brownie at the Hearth", "A small, shy brownie cleans a farmhouse in the dead of night, humming. \"I'll be gone by dawn,\" he says, \"if anyone thanks me. Please don't. I've only just got the place the way I like it.\""], ["The Kelpie", "At the edge of a black loch, a horse stands, beautiful and still, dripping weed. \"Ride me,\" says the Kelpie. \"I will carry you anywhere.\" The ink in the water ripples. You do not touch the bridle."], ["Highland Coo", "A shaggy red Highland cow stands in the path, unbothered, chewing. She will not move. \"She never does,\" says the piper. \"That's rather her whole philosophy.\" You walk around her. She approves."], ["Rob Roy's Raid", "Rob Roy MacGregor leaps from the heather with a laugh and a claymore. \"A cattle raid in a good cause,\" he says. \"The Blot has taken every tomorrow in the glen. I mean to raid it back.\""], ["The Selkie's Song", "On the shore, a seal slips out of her skin and sits on a rock, singing. \"I came for the quiet,\" she says. \"It has gone strange. It's not peace now. It's absence.\" Her song rolls back the fog."], ["A Wee Dram", "You share a flask with the piper and Rob Roy beneath a stone arch. The whisky tastes of peat and defiance. \"To tomorrow,\" says the piper, raising his cup. \"May it be a wee bit stubborn.\""], ["The Cat Sìth", "A black cat with a white chest pads out of the heather, big as a hound. \"I take souls,\" says the Cat Sìth, \"that nobody watches.\" Janet tugs her cloak. \"We're watching,\" she says, and means it."], ["Tam Lin's Shape", "A young man sits by the rose bush, pale, tired, human. \"I was a fairy's captive,\" says Tam Lin. \"Hold me fast, and I'll hold you. No matter what I turn into. Even if I turn into the end.\""], ["Hold Fast", "Tam Lin becomes a lion, an adder, a burning brand, an icy stream. Janet holds on through every shape. \"I will not let go,\" she says, and does not. You think, quietly, that this is the whole of love."], ["Thomas the Rhymer", "A figure in elf-green sits under a hawthorn. \"Thomas the Rhymer,\" he says. \"Seven years I served the Fairy Queen, and I can never tell a lie.\" He turns to you. \"May I ask you a true question?\""], ["A True Question", "Thomas asks: \"Do you want the story to end?\" You think. The hawthorn creaks. \"No,\" you say, honestly. \"I want it to mean something.\" Thomas smiles, all lines and lanterns. \"Then you answered well.\""], ["Nessie's Kin", "A long neck rises from the loch, mild-eyed and ink-spattered. \"I'm Nessie's cousin,\" says the creature, apologetic. \"I'm not a monster. I was told to look like one.\" It sinks back, mortified."], ["William Wallace", "William Wallace stands on a ridge with his great sword and a plaid wrapped about his shoulders. \"Freedom,\" he says, \"is a thing you hand to the next person. It's not a thing you keep.\""], ["Robert the Bruce", "A grey-eyed king sits in a cave, watching a spider climb its thread. \"Six times she fell,\" says Robert the Bruce. \"The seventh, she made it. I have never forgotten it.\" He stands. \"Neither should you.\""], ["The Spider's Thread", "The spider climbs, falls, climbs, falls, climbs. At last she reaches the rafter and begins to spin. You watch the web grow. It is not an ending. It is an architecture."], ["The Weird Sisters", "Three witches wait at a heath, cauldron bubbling, ink in their stew. \"Double, double,\" croon the Weird Sisters. \"Toil and trouble.\" They greet you like an old friend. \"Fair is foul,\" they say. \"Foul is fair.\""], ["The Weird Sister", "The eldest hag rises, cackling, black with the Blot. \"We foretold the king's fall,\" she says. \"And now we foretell yours. Tomorrow, and tomorrow, and tomorrow.\" You raise your hand. \"Not on my watch.\""], ["Macbeth's Castle", "A castle looms over a blasted heath, torches smoking, banners black. Inside, a man paces. \"Is this a dagger I see before me?\" he whispers. It is not. It's a quill. He puts it down."], ["Banquo's Chair", "At the banquet table sits an empty chair, and a guest who isn't there. The room goes cold. The ink in the wine runs backward. \"Tomorrow and tomorrow,\" whispers a voice. \"And tomorrow, and...\""], ["Tomorrow and Tomorrow", "The Blot's voice slides through the hall: \"No more tomorrows, sweet Reader. Only today, forever, and no more worry.\" It is more tempting than it ought to be. You grit your teeth. \"A tomorrow,\" you answer, \"is a gift.\""], ["Lady Macbeth's Candle", "A woman walks the corridor in her nightgown, candle in hand, rubbing her fingers over and over. \"Out, damned spot!\" she mutters. It is ink, not blood. It does not come off. She is weeping."], ["The Highland Reiver", "A highland reiver blocks the path with a sword, hands trembling. \"I'm to stop you,\" he says. \"I can't remember who told me. Do you know? I think... I think I've been asleep.\" You let him sit."], ["Wallace Rides", "Wallace and his men thunder down from the ridge with a roar. The ink, fleeing, scatters across the moor like startled sheep. The war-cry carries through the glens: \"FREEDOM!\" It is a good word for a story."], ["Hold Fast, Janet", "The mist rolls in. A figure, tall and cold, reaches for Janet. \"Hold fast!\" cries Tam Lin. \"Don't let go!\" She doesn't. The figure becomes a lion, an adder, a flame. She holds. The flame dies."], ["The Piper's Lament", "The piper plays on the highest crag, his tune low, wild and ancient. Every glen answers. Every stone rings. For the first time since the Blot arrived, a man is allowed to weep over what he has lost."], ["Out, Damned Blot", "Lady Macbeth stands at the foot of the stair, hands raised. \"All the perfumes of Arabia,\" she whispers, \"will not sweeten this little hand.\" Thomas takes her wrist. \"Then let it be what it is,\" he says."], ["Lady Macbeth", "Lady Macbeth's eyes go black, and she stands, a figure of cold iron and ink. \"A deed without an ending,\" she says, \"is a deed without guilt. I only want to be free.\" Her dagger flickers. So does yours."], ["The Marches", "Wales and Cornwall wrap the world in rain and legend. The hills are green and hunched, the coast is jagged with giants' bones, and beneath it all, a door in a mound hums. Someone old is awake."], ["Branwen's Starling", "Branwen cups a starling in her hands. \"I taught him to carry a message across the sea,\" she says, \"to save my brother. He carries it still. He has never been late.\" The bird tilts its head at you."], ["The Mermaid of Zennor", "On the Cornish shore, a woman with a mermaid's tail sings to the tide. \"A boy followed me once,\" she says. \"He never came back. I am not sorry. He sounded happy.\" The ink in the foam is quiet."], ["Pwyll's Swap", "Pwyll, prince of Dyfed, tips his hat. \"I swapped places once with the king of the dead for a year,\" he says. \"Best year of my life. I'm told the king enjoyed it too. We kept in touch.\""], ["The Cornish Piskie", "A piskie darts out of the heather and leads you in circles. \"I'm pixy-leading you,\" he says cheerfully. \"It's what I do.\" The ink in his wings is spoiling the fun. \"Help me, please,\" he whispers."], ["Gwydion's Wand", "Gwydion, a wizard in a patchwork cloak, waves a wand at an oak tree, and a woman made of flowers steps out. \"Blodeuwedd,\" he says. \"I did not think it through.\" He sighs. \"Please learn from my mistakes.\""], ["Owain Glyndwr's Banner", "Owain Glyndŵr raises his red-dragon banner on a hilltop, wind snapping. \"Wales has heard worse than the Blot,\" he says. \"We have been told many times that we are finished. We make a point of ignoring it.\""], ["Tristan and Iseult", "On a Cornish headland, Tristan strums a harp and gazes at the sea. \"I drank the wrong cup,\" he sighs. \"Or the right one. It is difficult to say. Either way, I am very much in love.\""], ["Rhiannon's Birds", "Rhiannon rides a pale horse across the hills, a flock of silver birds following. Their song wakes the dead and lulls the living. \"Don't mind the singing,\" she says. \"It's a trifle old-fashioned, but it works.\""], ["The Giant Cormoran", "A giant the size of a cliff squats in the surf, scooping up stones and tossing them into the sea. \"Cormoran,\" he rumbles. \"I built this coast. I'm told it has no more use. It has plenty of use.\""], ["A Welsh Hill", "You climb a green hill under driving rain, and at its top, a red dragon sleeps, curled like a cat. It opens one eye. \"Another Reader,\" it yawns. \"Wake me when it's over.\" It does not close the eye."], ["The Red Dragon Wakes", "The dragon rises from the hill, red as a sunset, and sniffs the air. \"I smell ink,\" it growls. \"Old hungry ink.\" It unfurls its wings, and the clouds part. \"I should like very much to burn it.\""], ["Taliesin's Cauldron", "Taliesin, the great bard, stirs a cauldron by firelight. \"Three drops of wisdom,\" he says, \"and I was born again as a poet.\" He dips a ladle. \"Drink. It tastes of every song ever sung.\""], ["Awen", "You drink the cauldron's brew. The world turns to music. You hear the grass sing, the stones hum, the dead whispering verses. The ink, trying to speak, can only stammer. It has never heard so many voices at once."], ["Blodeuwedd", "Blodeuwedd the owl-woman perches on a branch, flowers and feathers in her hair. \"I was made to love,\" she says, \"and I did not. Now I am made to forget. I would like neither.\" Her eyes are wide."], ["A Door in the Mound", "A door in the hill stands open. Lamplight spills out, and a hundred voices singing under the earth. \"The Otherworld,\" says Pwyll. \"Don't be afraid. We are quite friendly, mostly.\""], ["Bran the Blessed", "A giant lies across a river like a bridge. \"Bran the Blessed,\" he says. \"When they cut off my head, it kept talking. It told them stories for seven years.\" He grins. \"Don't underestimate the dead.\""], ["The Head on the Table", "The head of Bran sits at the high table, grinning, and holds the whole feast spellbound with tales. \"I'm dead,\" he says. \"I'm better company now.\" You laugh. The ink in the hall is not amused."], ["The Dead Do Not Mind", "Ghosts drift through the hall. Nobody frightens you. A woman in a shawl sits by the fire. \"I'm remembered,\" she says, smiling, \"so I'm not gone. It's the forgetting that kills us.\" She winks."], ["Tregeagle's Ghost", "A ghost drags a sack of sand along a beach, endlessly, endlessly, endlessly. \"Tregeagle,\" he sighs. \"I was set to empty a pool with a limpet shell. The Blot says there is no end. I believed it.\""], ["The Limpet Shell", "You take Tregeagle's shell and fill it, carefully, one drop at a time. He watches. \"It will take a thousand years,\" he says. \"Perhaps,\" you answer. \"But it won't be forever.\" He weeps with relief."], ["Mabinogion", "Pwyll, Rhiannon, Branwen, Bran: they sit in a ring and speak the Four Branches aloud, a story told so often it has worn a groove in the hills. The ink, listening, discovers that it cannot erase a groove."], ["The Hounds of Annwn", "A pack of white hounds with red ears howls across the sky, hunting. \"They hunt souls,\" says Pwyll. \"Tonight, they hunt ink.\" Their baying is the most beautiful sound you have ever heard."], ["The Mermaid's Warning", "The mermaid surfaces, hair streaming. \"The Lord of the Dead comes tonight,\" she says. \"He is not cruel. He is only bored. Don't give him a reason to stay.\" She dives. The sea closes over her words."], ["Annwn Hound", "A single white hound barks at the head of the path, snow-white, ink-eared. \"I am to keep you out,\" he says, gruffly. Then he sits, ears drooping. \"I don't want to. May I come with you?\""], ["The Road to Annwn", "A path of white stones glimmers across a black lake. The hounds run before you. Every footstep wakes a memory. You understand, with a lurch, that you are walking into the place where stories go to be loved."], ["The Court of Annwn", "The Court of Annwn is vast and silent, lit by a thousand candles. Every figure at the table is someone who died long ago and is, somehow, still very much present. They rise, as one, to greet you."], ["The Dead Ask for a Story", "The dead gather around you. \"Tell us,\" they say, \"what happens next.\" You realize they have been waiting a very long time to be told. You open your mouth. You begin."], ["Arawn Rides", "The lord of Annwn gallops through the hall on a pale horse. \"I am the end of every tale,\" says Arawn, calmly. \"I am not your enemy. But I am not your friend.\" The ink flares in his eyes."], ["Arawn, Lord of Annwn", "Arawn dismounts, vast and grey, a crown of black antlers on his head. \"A story's last page belongs to me,\" he says gently. \"Don't let the Blot take it. I would not want it that way.\" He draws."], ["Heorot", "On a cold headland stands Heorot, the great mead hall, roof gold in the dusk. Inside, men laugh and sing. Outside, the dark waits, patient and ink-black. King Hrothgar greets you at the door with a horn of mead."], ["Hrothgar's Welcome", "King Hrothgar raises a horn. \"Twelve winters,\" he says, \"a monster has come to my hall. I thought it was the worst of my sorrows. The Blot proved me wrong.\" The mead tastes of honey and iron."], ["Wealhtheow's Cup", "Queen Wealhtheow passes the cup from hand to hand, speaking softly to each warrior. \"The cup is how a hall remembers its friends,\" she says. When it reaches you, she looks into your eyes. \"Drink slowly.\""], ["Unferth's Taunt", "Unferth sneers across the hall. \"You boast that you will beat the dragon,\" he says. \"Have you ever fought a swimming race with sea-monsters?\" You have not. He hands you a sword anyway. It is very good."], ["Grendel's Spawn", "A creature slouches out of the fens, long-clawed and ink-slick, a smaller echo of Grendel. \"Mother says I'm to scare you,\" it mumbles. \"She says I've the face for it.\" It hasn't, particularly. It tries anyway."], ["The Mere", "A black lake lies behind the hall, fog on the water, bones in the reeds. Something stirs beneath. \"Grendel's mother,\" says Wiglaf. \"She does not like to be disturbed. I don't blame her.\""], ["Wiglaf Stands", "Wiglaf stands at your shoulder, a spear in his fist. \"I'll not run,\" he says. \"I am the one who stays. Somebody always has to.\" His grip is white at the knuckle. His face is calm."], ["Wayland's Forge", "Wayland the Smith hammers a blade in a smoking cave. \"No sword is ever finished,\" he says. \"It is only abandoned at the right moment.\" He thrusts it into the quench. It sings. \"Take it.\""], ["Hereward's Fen", "Hereward the Wake stands in a reed-choked marsh, grinning under a battered helm. \"They said the fen couldn't be taken,\" he says. \"They are right. I only live here.\" He pulls you into the reeds."], ["The Fen Wraith", "A pale wraith rises from the marsh, long and thin and drifting. \"I am what's left,\" it whispers, \"of a man who died and was not remembered.\" It reaches for you. Hereward cuts it, and it dissolves, relieved."], ["Beowulf Arrives", "A broad-shouldered man steps off a ship, bare-armed, smiling. \"I am Beowulf,\" he says. \"I've come to help. I've heard there are monsters. I'm quite good with monsters.\" He cracks his knuckles."], ["The Hall Is Quiet", "Beowulf sits in the empty hall, awaiting the dark. \"I won't use a sword,\" he says. \"Grendel does not. It seems rude.\" He waits. The ink drips from the rafters. Somewhere, a claw taps the door."], ["Grendel's Fall", "The door explodes inward, the dark rushes in, and a great clawed shape seizes Beowulf's arm. The hall shakes. The two grapple, and somewhere in the roar, a monster remembers what it was to be afraid."], ["The Mother's Lair", "Under the black lake, a cave glimmers with firelight. A creature waits there, sorrowful and terrible. \"You killed my son,\" says Grendel's mother. \"I'm not angry. I'm only very, very sad.\" Her claws gleam."], ["The Wyvern", "A winged lizard glides over the headland, spitting sparks, ink in its scales. \"Wyvern,\" says Wayland, calmly. \"A dragon's poorer cousin. It has all the temper and none of the dignity.\" He hefts his hammer."], ["Saint George", "A knight in a red-cross surcoat rides out of the dusk, sunlit, polite. \"Saint George,\" he says, tipping his helm. \"I'm told there is a dragon in this region. I would like to be introduced, if I may.\""], ["Sabra Speaks", "Princess Sabra steps out from the shadow of George's horse. \"I was the sacrifice,\" she says. \"I'm not any more. I decided.\" She hands you a bandage and a waterskin. \"The dragon is not why I stayed. You are.\""], ["Lambton's Worm", "Young Lambton, who once fished a worm out of a well and threw it back, stands at the edge of the hall. \"It grew,\" he says, \"and ate half the county. I'd like to kill it. I'm sorry about the whole thing.\""], ["The Hoard's Edge", "On the lip of the mountain, a mass of gold glitters and glowers. Goblets, crowns, swords: all of it black with the Blot. \"A hoard,\" says Beowulf quietly, \"is only treasure that has been forbidden to be used.\""], ["The Hoard Goblin", "A goblin crouches on a pile of coins and counts them with a clawed finger. \"All mine,\" he mutters. \"Every ending, every last one. I keep them safe. Don't touch.\" He slides a sword across the floor."], ["What the Hoard Holds", "You touch a coin, and the metal flares into a scene: a hero dying, a lover waiting, a child taking a first step. They are all endings, hoarded, hoarded, hoarded. The goblin weeps. \"They were all so sad.\""], ["Spend the Hoard", "You throw the gold into the hall, and the endings fly out like startled doves. Each finds a story, and each story gasps, and recovers. The goblin watches, pale. \"I never thought to give them away.\""], ["Beowulf's Counsel", "Beowulf, old now, grey-bearded, sits by the fire. \"I will fight the dragon,\" he says. \"I know how it ends. I'm not afraid of the ending. I'm only afraid of leaving no one behind to tell it.\""], ["The Last Mead Hall", "The hall is full tonight, every seat taken, every cup raised. Beowulf stands. \"If I should fall,\" he says, \"do not weep. Weep for the ones who never got to hear a good song.\" The hall roars."], ["The Raider", "A mead-hall raider with a notched axe stands in the doorway, ink glossing his beard. \"I've been told to burn the place,\" he says. \"I'm very sorry.\" He lowers the axe. \"It looks like a nice place.\""], ["Climbing the Peak", "You climb the mountain together, you, Beowulf, Wiglaf, George, Sabra. The air thins. The ground cracks. A thin wind carries the smell of old smoke and older gold. Beowulf is humming."], ["The Dragon's Cave", "The cave mouth glows red, and the heat lifts your hair. Inside, a mountain of treasure heaves, and beneath it, an enormous breath. \"Every dragon,\" says George softly, \"is once a story someone was afraid to tell.\""], ["George Steps Forward", "Saint George takes a step toward the cave, lowering his lance. \"I will speak to it first,\" he says. \"I do not slay for sport. I only slay what cannot be reasoned with.\" He waits at the threshold."], ["The Dragon Speaks", "A voice rolls out of the cave like thunder in a well. \"I have kept every last word,\" it says, \"of every hero who ever fell. I keep them warm. Do you think it is easy, being the only one who remembers?\""], ["The Great Dragon", "The Dragon rears up, gold dripping from its scales, black ink in its eyes. \"No more heroes,\" it roars, \"and no more songs! Only the hoard!\" Beowulf draws his sword. \"Then let it be the best song yet,\" he says."], ["Whitby", "The Demeter lies wrecked on the Whitby rocks, her deck empty, her log still tied to the wheel. A black dog bounded off the bow and up the cliff stair. The abbey ruins loom against the moon."], ["Mina's Diary", "Mina Harker sits on the cliff, writing in a leather journal, hair blowing. \"I record,\" she says, \"because the things I do not write down are the things I most fear to forget.\" The ink in her pen is ordinary."], ["Jonathan Returns", "Jonathan Harker stumbles up the road, hollow-eyed, thin as a ghost. \"I escaped the castle,\" he mumbles. \"I climbed down the wall. I think it was a week.\" Mina takes his hand. He cries into her shoulder."], ["Dr. Seward's Asylum", "Dr. Seward leads you through a sprawling asylum of locked doors and long hallways. \"I have a patient,\" he says, \"who eats flies. He has been unusually cheerful this week. I find it deeply worrying.\""], ["The Ward Keeper", "The Lunatic Ward Keeper clanks his keys, grinning without warmth. \"Visiting hours are over,\" he says. \"Everyone in here is a story that was never finished. I'm only the one who keeps them tidy.\""], ["Quincey's Bowie", "Quincey Morris tips his hat and checks the edge of a long knife. \"I'm a Texan,\" he says. \"We don't believe in vampires. We believe in aim.\" He winks at you. It is the last cheerful thing you'll see for a while."], ["Holmwood's Resolve", "Arthur Holmwood, Lord Godalming, stands by an open grave, a stake in his shaking hands. \"She was my love,\" he says. \"And now I must do the unthinkable.\" Van Helsing places a hand on his shoulder."], ["The Silver Crucifix", "Van Helsing hands you a crucifix and a clove of garlic. \"I do not ask that you believe,\" he says in thickly accented English. \"Only that you hold it. Belief is a muscle. It grows.\""], ["A Wolf on the Wreck", "A huge black wolf stands on the prow of the wreck, eyes burning, ink streaming from its fur. It howls once, long and low, and the sea retreats. Then it leaps. Quincey fires. The wolf is gone."], ["The Wolf of the Wreck", "The wolf drops from the cliff onto the path, ghostly, enormous. \"I carry the Count,\" it growls. \"I am his servant. I have carried him through ten thousand nights. I'd like to rest.\" Its eyes plead."], ["Victor's Laboratory", "Victor Frankenstein sits in his dim laboratory, surrounded by coils and jars. \"I gave a creature life,\" he says, \"and fled in horror. It's the one decision I regret. Don't make my mistake: Do not abandon what you make.\""], ["Elizabeth's Letter", "Elizabeth Lavenza folds a letter in trembling hands. \"He's coming back,\" she says, \"for me. I don't know what he wants. I know only that he has been very alone.\" She looks at you, steady, frightened, kind."], ["Captain Walton's Ship", "Far north, Captain Walton's ship is locked in ice. A man was rescued from the floe, half-frozen, mad with grief. \"He told me his story,\" says Walton. \"I wrote it down. I could not bear not to.\""], ["The Doctor and the Hyde", "Dr. Jekyll, pale and sweating, clutches a flask. \"Every man has two selves,\" he says. \"I only separated them.\" He drinks. His eyes darken. A different voice, soft and cold: \"Good evening.\""], ["Mr. Hyde", "Hyde sprawls on a ruined pew, grinning. \"He's all ink and appetite,\" says Jekyll's voice from inside him, tight with horror. \"I should never have let him loose.\" Hyde rises. The church shakes."], ["The Count's Letter", "A letter arrives, written on yellow vellum, in a hand like a spider's. \"Welcome to my country,\" it reads. \"Come freely, and of your own will.\" The words squirm. The ink beneath them is not Dracula's own."], ["Mina's Choice", "Mina reads the letter twice. \"He is offering immortality,\" she says. \"A story that never ends.\" She closes the journal. \"It is not a story, then. It is a loop.\" She looks at you. \"Stories need endings. I never knew.\""], ["Van Helsing's Lesson", "\"A thing that cannot die,\" says Van Helsing, \"is not alive. It is a tragedy waiting for a witness. We do not hunt monsters. We hunt the ones who forgot how to end.\" He holds the stake like a pen."], ["Carfax Abbey", "Carfax Abbey squats in the moonlight, windows blind, ivy thick as ink. The doors sag. Inside, the Count's crates of earth glow faintly. Every lid is stamped with a word: \"FOREVER.\""], ["Frankenstein's Creature", "A giant figure steps out of the shadows, scarred, enormous, shaking. \"I am a creature,\" he says. \"I did not choose this. I'd like to end.\" The Blot whispers in his ear, so sweetly, so close."], ["The Creature's Plea", "The Creature kneels in the snow, hands over his face. \"Make me a companion,\" he sobs. \"Or end me. Anything but this.\" Elizabeth steps forward, small and brave. \"I'll sit with you,\" she says. \"Both can wait.\""], ["Walton Listens", "Captain Walton sits across from the Creature in the ice. \"Tell me your story,\" he says. The Creature does, slowly, haltingly. When he is done, Walton weeps. \"It is the saddest thing I've ever heard. Thank you.\""], ["The Brides Wake", "Three pale women stir in the crypt, ink in their veins, hunger in their eyes. Mina holds up a crucifix. \"I'm not afraid of you,\" she says. The brides pause. \"No,\" says one. \"You never were.\""], ["Dawn Over Whitby", "The sun rises over the abbey, and the shadows run. For a moment Whitby is only a harbor town, with fishing boats and bread. A gull screams. The ink on the cobbles evaporates. Mina smiles."], ["The Grave Robber", "A grave robber crouches in a churchyard, shovel in hand, ink on his boots. \"I'm only digging for the dead's lost lines,\" he says. \"They don't need them any more.\" Quincey cocks his rifle. \"They might.\""], ["Into the Crypt", "You descend the crypt stairs, torches guttering. Each step down is a year. The air tastes of dust and cold. At the bottom, a coffin lies open, empty, and a voice laughs, deep in the dark."], ["Van Helsing Prays", "Van Helsing kneels in the crypt and lifts his crucifix. The light that blazes from it is white and fierce and utterly without apology. \"This,\" he says, \"is what belief looks like when it is tired and unbroken.\""], ["The Count Appears", "A tall figure rises from the shadow, pale, long-fingered, eyes red as embers. \"Welcome,\" says Count Dracula, with a courtly bow. \"I have waited four hundred years for visitors. I trust you've brought a story.\""], ["An Offer of Eternity", "The Count offers you his hand. \"Never again will the page end,\" he says. \"Never again will you lose someone. Eternity is only the world with the edges sanded off.\" You stare at his hand. It is empty."], ["Count Dracula", "Dracula's cloak unfurls like a thundercloud, and his smile is all teeth. \"You have refused me,\" he says. \"How tragic. And how tedious.\" Van Helsing raises the stake. Mina raises her pen. You raise your voice."], ["The Hollow", "Sleepy Hollow lies dreaming in its valley, lit by orange pumpkin-glow and a very large moon. Cornfields rustle. A scarecrow looks at you, and you have the distinct impression that it blinked."], ["Ichabod Crane", "A tall, thin schoolmaster picks his way down the lane, clutching a lantern and a pumpkin pie. \"Ichabod Crane,\" he says, nervously. \"I teach. I do not run. I may, however, soon be running.\""], ["Katrina's Table", "Katrina Van Tassel sets a long table with pies, doughnuts and a goose. \"The harvest is plentiful,\" she says. \"The Hollow has always been generous. It is only the nights that are meager.\""], ["Brom Bones Rides", "Brom Bones gallops past, whooping, a laughing, handsome, awful prankster. \"Ichabod!\" he bellows. \"Ride me down if you're able!\" Ichabod does not. He stands very still and nurses a grudge."], ["The Pranksters", "Brom's pranksters leap out of the corn, wearing sheets and pumpkin heads, whooping. \"Boo!\" they shout. It is meant to terrify. It makes you sad. \"They're only boys,\" says Katrina. \"They have no ending either.\""], ["Dame Van Winkle", "Dame Van Winkle stands in the doorway of her farmhouse with a broom. \"My husband went hunting twenty years ago,\" she says, \"and never came back. I swept every day, in case.\" She sweeps."], ["Rip Van Winkle", "A white-bearded man with a long gun wanders into the lane, blinking at the sun. \"I took a nap,\" says Rip Van Winkle. \"A small one. By the look of it, I have missed a few things.\" He yawns."], ["Gunpowder the Horse", "Gunpowder, a lank old plow-horse, pricks his ears at your approach. \"I have borne three schoolmasters,\" he seems to say. \"And I will bear a fourth, so long as it isn't a ghost.\" He whinnies."], ["Hendrick Hudson's Crew", "In the hills, a crew of small bearded men plays at ninepins, rolling thunder across the sky. \"The crew of the Half Moon,\" says Rip, wheezing. \"Don't drink their liquor. I did.\" He shivers."], ["The Hessian", "A spectral horseman gallops down the lane, a cannonball for a head. \"He's the Hessian,\" whispers Katrina. \"He lost it in a battle. He rides because he can't stop.\" Ichabod fears him greatly. You do not."], ["The Tarry Town Tinker", "A cheerful tinker mends a kettle by the roadside. \"Everything breaks,\" he says. \"I fix it. I've done this in every story since stories began, and nobody has ever thanked me.\" You thank him. He is silent a long while."], ["Jack-o'-Lantern", "A pumpkin with a candle in its belly bobs along the lane. \"I light the way,\" it says solemnly. \"I'm not the Horseman. I'm only the glow.\" Ichabod, to his own astonishment, follows it."], ["The Covered Bridge", "A covered bridge spans the creek, boards dark with age. A single lantern hangs at the center. \"That's where he crosses,\" whispers Katrina. \"Every night, at midnight. Every night, for two hundred years.\""], ["Ichabod's Fear", "Ichabod sits on the porch, clutching his pie, shaking. \"I am afraid,\" he says. \"Everyone is, of something. I would like to be afraid on purpose. May I?\" You let him. He grows steadier."], ["The Highwayman", "A highwayman steps into the road in a tricorn hat. \"Your money or your life,\" he says, without conviction. \"Or your story. I'm told they're worth more.\" Ichabod hands over his pie. The highwayman sniffs it. \"Fair.\""], ["Rip's Long Sleep", "Rip tells his tale, slowly, from a stump. \"I slept twenty years,\" he says. \"I woke to a new country. I'd missed the whole war. I'd missed the whole story.\" He looks at you. \"Don't miss yours.\""], ["Katrina's Pie", "Katrina cuts you a slice. It is pumpkin, and the whole room smells of cinnamon and home. You eat. For one long moment, you forget everything but the warmth. Katrina smiles. \"It's allowed,\" she says."], ["A Ghost Story", "Around the fire in the Van Tassel kitchen, they tell ghost stories. Each is more gruesome than the last. When it is Ichabod's turn, he tells the story of the Headless Horseman. The room is silent. A window rattles."], ["Cornfield Whispers", "The cornfield whispers, and the whisper is not wind. \"Stay,\" it says. \"Sleep. Let the story close.\" The Scarecrow in the middle of the field turns its head. \"That is the Blot talking,\" he says. \"Please don't listen.\""], ["The Hollow Hound", "A huge, ink-dripping hound bounds out of the corn, baying. It bowls Ichabod over and sits on him. \"He only wants to play,\" says Katrina. \"The Blot made him look fierce.\" The hound licks Ichabod's face."], ["The Schoolhouse", "Ichabod's schoolhouse sits dark and dusty, desks blank, chalkboard smeared. \"I taught here,\" he says. \"Children came, and left. I always thought it was failure.\" He straightens. \"It was the whole point.\""], ["Brom's Confession", "Brom, wearing his best waistcoat, sits on the church step. \"I played a prank on Ichabod,\" he says. \"I regret it. I would like to say I'm sorry.\" Ichabod looks at him. \"Come in,\" he says. \"There's pie.\""], ["Midnight Approaches", "The church bell strikes eleven. The moon swells. The wind picks up. Every shutter in the Hollow slams closed. A distant hoofbeat begins, slow and steady. Ichabod grips his lantern, and, to his own surprise, does not run."], ["The Pumpkin Patch", "You hide in a pumpkin patch while the hoofbeats grow closer. Every pumpkin in the field has been carved with a face. Every face is smiling. The wind carries a laugh that doesn't belong to any of them."], ["The Scarecrow Walks", "The Hollow Scarecrow climbs off his post and ambles toward you, straw trailing. \"I've always wanted to dance,\" he says. \"May I?\" He dances. It is dreadful. It is lovely. The cornfield claps."], ["The Bridge at Midnight", "The bridge looms. A single lantern burns at its center, and under it, a shadow the shape of a rider. The air smells of smoke and iron. Ichabod stands beside you, trembling, and does not turn."], ["The Hollow R
