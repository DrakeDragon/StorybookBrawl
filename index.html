lks with a crutch and speaks with a candle's warmth. He is the heart of the Cratchit family and the first to ask for kindness. Scrooge was never quite the same after meeting him."], "cratchit": ["The Clerk", "It is cold in the office. But there is a coal fire in my heart.", "Bob Cratchit works for fifteen shillings a week in a drafty office and carries a scarf for Tim. He is poor, kind and incapable of bitterness. He raises a glass to a man who deserves none."], "pip": ["The Blacksmith's Boy", "I thought great expectations meant money. I was wrong.", "Pip was a village boy who helped a convict on the marshes and was repaid in ways he never saw coming. He dreams of being a gentleman, and learns what the word means."], "fezziwig": ["The Merry Master", "It's Christmas Eve! Clear the floor, boys! Dance!", "Old Fezziwig threw the best Christmas ball in London and paid for it out of his own pocket. He is round, rosy and generous. Scrooge remembers him with the sharpest pang of all."], "oliver": ["The Orphan Boy", "Please, sir, I want some more.", "Oliver Twist was born in a workhouse and ran to London with nothing but a crust. He was taken in by thieves and rescued by a gentleman. He asks politely for what he needs, and never stops."], "marley": ["The Chained Ghost", "I wear the chain I forged in life. Link by link, yard by yard.", "Jacob Marley was Scrooge's partner and died as miserly as he lived. He returns in chains of cash-boxes, ledgers and keys. He haunts out of kindness. He wants Scrooge to change before it's too late."], "dodger": ["The Artful Dodger", "Pockets are for people who don't have friends to share with.", "The Artful Dodger is the best pickpocket in London and the leader of Fagin's boys. He is cocky, clever and fiercely loyal. He lives by his wits and dies, eventually, laughing."], "nancy": ["The Loyal Heart", "I'll never leave him. Not for all the gold in London.", "Nancy grew up in the gang and knew its every cruelty. She risked her life to protect a boy she'd barely met. She is brave, bitter and kind, and she deserved a better story."], "ghostpresent": ["The Giant of Christmas", "Come in and know me better, man!", "The Ghost of Christmas Present sits on a throne of turkey, brawn and holly, and shows Scrooge what is happening this very night. He is jolly, huge and short-lived. He ages a day with every hour."], "scrooge": ["The Reformed Miser", "I will honour Christmas in my heart, and try to keep it all the year.", "Ebenezer Scrooge was a hard, mean man who counted coins in the dark. One strange night changed him forever. Now he dances in the street, hands out turkeys, and is mildly embarrassed by it."], "toby": ["The Tracker", "Give me a scent and I'll find a thread to follow.", "Toby is the dog Holmes borrows when a trail goes cold. He is ugly, loyal and has the best nose in London. He has followed creosote across half the city and never once been wrong."], "wiggins": ["The Irregular", "Baker Street Irregulars, assemble! Sixpence each!", "Wiggins leads the street urchins who run Holmes's errands. He is cheeky, sharp and well-informed, and notices things grown-ups never do. He wants a shilling, and he will earn it."], "billy": ["The Page Boy", "Another visitor for you, sir. And I've put the kettle on.", "Billy is the page at Baker Street, who runs messages, shows guests up and sneaks tea. He has seen every kind of client and is never surprised. He is quietly the best-informed boy in London."], "gregson": ["The Yard Man", "I've got the man, Mr. Holmes. Never mind how.", "Inspector Gregson is Scotland Yard's most confident detective and often its most mistaken. He is brawny, brisk and honest. Holmes mocks him and, privately, rather likes him."], "lestrade": ["The Yard's Finest", "I'll admit, Mr. Holmes, you've done it again.", "Inspector Lestrade has been bringing Holmes cases for decades and taking credit for half. He is tenacious, ferret-faced and secretly grateful. He is the best policeman Holmes will ever know."], "hudson": ["The Landlady", "I do not run a hotel for detectives. But I'll bring up the supper.", "Mrs. Hudson has endured gunshots in the sitting room, chemicals in the pantry and a violin at three in the morning. She is the only person in London who can tell Holmes off."], "mycroft": ["The Government", "I do not do deduction. I do the Empire.", "Mycroft is Sherlock's elder brother and the quiet centre of the British government. He rarely leaves the Diogenes Club. He is lazy, brilliant, and always three moves ahead."], "irene": ["The Woman", "I outwitted the best mind in England. I'd do it again, for the fun.", "Irene Adler is a singer, an adventuress and the only person to beat Sherlock Holmes. She is graceful, daring and always one step ahead. To him, she is always the Woman."], "watson": ["The Chronicler", "I only report what I see. The great one does the seeing.", "Dr. Watson is a wounded soldier turned doctor turned storyteller. He keeps Holmes alive, honest and fed. He writes it all down, because someone must remember."], "sherlock": ["The Consulting Detective", "You see, but you do not observe. The distinction is clear.", "Sherlock Holmes lives on Baker Street with a violin, a magnifying glass and a mind that can not rest. He solves what others cannot. He is lonely, brilliant, and most alive in the middle of a case."], "trelawney": ["The Squire", "I've found a ship, a crew, and a map! What could go wrong?", "Squire Trelawney financed the voyage to Treasure Island and told half of Bristol about it. He is loud, loyal and a terrible judge of character. He means well, and that counts."], "redruth": ["The Gamekeeper", "I'll stand my ground, sir. It's what I'm for.", "Tom Redruth was the squire's gamekeeper and a stubborn old soul. He joined the voyage out of duty and held the stockade until the end. He was shot at his post, and did not move."], "gray": ["The Honest Hand", "I said I'd stand with you, Captain. I'm here.", "Abraham Gray was a ship's boy who nearly joined the mutineers. He chose the right side at the last moment, and never wavered afterward. He is young, brave and quietly steady."], "friday": ["The Island Friend", "Master, I will go where you go.", "Friday was rescued from cannibals by a man marooned for years. He learned English, became a friend, and, in time, an equal. He is loyal, brave and a very good shot."], "smollett": ["The Captain", "I don't like the voyage. I don't like the crew. And I don't like the map.", "Captain Smollett distrusted the crew from the start and was right. He held the stockade with a bullet in his arm and no complaints. He is stern, honest and never wrong about men."], "gunn": ["The Marooned Man", "Cheese. Have you got any cheese? Toasted, mostly.", "Ben Gunn was marooned on Treasure Island for three years with only goats for company. He is half mad, half sage and entirely willing to help. He moved the treasure before the pirates arrived."], "livesey": ["The Doctor", "I'd rather save a man than kill one. But today I'll do both.", "Dr. Livesey is the voyage's physician, magistrate and sensible head. He treats pirates and heroes alike, and holds his tongue until it counts. He is cheerful, calm and absolutely fearless."], "jim": ["The Cabin Boy", "I found a map. I found a mutiny. I'd do it again.", "Jim Hawkins was an innkeeper's son who found a dead pirate's map and sailed to an island. He's brave, curious and quick on his feet. He grew up the day the Hispaniola sailed."], "crusoe": ["The Castaway", "I have a plan. It's probably a good one. It's the only one.", "Robinson Crusoe spent twenty-eight years on a desert island and built a life out of salvage and stubbornness. He organises, plans and prays. He believes any problem can be solved with enough rope."], "silver": ["The One-Legged Cook", "I'm a gentleman of fortune. And I always land on my foot.", "Long John Silver is the sea cook who led a mutiny and charmed the boy he'd betrayed. He is cunning, warm and impossible to dislike. He escaped with a bag of coins, and nobody ever caught him."], "peaseblossom": ["The Fairy Attendant", "Command me, Master. I'm small, but I'm thorough.", "Peaseblossom serves Titania, scratching her head and fetching her wishes. She is tiny, sweet and a good listener. She is the fairy queen's favourite, and she knows it."], "cobweb": ["The Honey Fetcher", "Let me bind that wound. A spider's web does wonders.", "Cobweb is a fairy who gathers honey and wraps cuts in cobweb. She is quiet, careful and has the gentlest hands in the wood. Even Puck has been patched by her."], "moth": ["The Quick Fairy", "Blink, and I'm gone.", "Moth is a small, dark-winged fairy who flits through the wood on missions too small to notice. He is quick, silent and nearly impossible to catch. He moves between moonbeams."], "mustardseed": ["The Strong Seed", "I'm only a seed. But I'm a hot one.", "Mustardseed is a fairy attendant with a quiet bite. He is small and spicy, and he cannot be argued with. He has been known to bring a giant to tears."], "lysander": ["The Lover", "I'll cross a wood for her. I'll cross a world.", "Lysander ran away with Hermia to escape the law, and was bewitched by a flower on the way. He is passionate, impulsive and a little ridiculous. But his love, when it's real, is real."], "bottom": ["The Weaver", "I could play Pyramus. And Thisbe. And the Lion.", "Nick Bottom the weaver was given a donkey's head by Puck and a fairy queen's love. He took both in stride. He is vain, enthusiastic and oddly happy. He's a ham, and a gentleman."], "hermia": ["The Little Fury", "Though she be but little, she is fierce.", "Hermia is short, quick and not to be crossed. She fled Athens to marry for love and fought for it all night. She is the smallest person in the wood, and the loudest."], "oberon": ["The Fairy King", "I have a flower. It can make anyone love anything. Be careful.", "Oberon rules the fairies of the wood and quarrels with his queen about a changeling boy. He is proud, powerful and secretly romantic. His love potion has caused chaos for centuries."], "puck": ["The Lord of Misrule", "Lord, what fools these mortals be!", "Puck is Oberon's jester and the wood's most reliable troublemaker. He fixes mistakes by making new ones. He is quick, funny and sorry for nothing."], "titania": ["The Fairy Queen", "I am Titania. The wood is mine. So is the moon.", "Titania rules the glade beside her husband and is bewitched by a weaver. She is fierce, gracious and not easy to embarrass. When she wakes from the dream, she remembers it kindly."], "janet": ["The Faithful One", "I held on through every shape. Nothing could make me let go.", "Janet went to Carterhaugh, picked a rose and met a knight who belonged to the Fairy Queen. She held him through lions and snakes and fire until he was free. She never doubted she could."], "piper": ["The Highland Piper", "A tune can carry a man home or carry him off.", "The Highland Piper plays at weddings, wars and funerals, and has never once been late for any of them. He knows a hundred laments and one song of joy. He saves it for the dawn."], "brownie": ["The Hearth Spirit", "I'll be gone by dawn. Please don't thank me.", "The Hearth Brownie cleans the farmhouse at night and leaves at the first sign of gratitude. He is shy, tidy and very proud. A bowl of cream is all he asks."], "cow": ["The Highland Coo", "Moo. I'll not be moved.", "The Highland Coo has long horns, a shaggy red coat and absolutely no interest in your plans. She has stopped armies by standing in a road. She is a warrior in disguise."], "robroy": ["The Highland Outlaw", "They call me a thief. I call it taxation of the unjust.", "Rob Roy MacGregor was an outlaw with a price on his head and a following in every glen. He is red-haired, proud and loved by those he robbed for. He never took a coin from the poor."], "selkie": ["The Seal Woman", "The sea is my first home. The shore is my second. Both are mine.", "The Selkie slips her sealskin on the rocks and walks among men. She is graceful, secretive and terribly lonely. She longs for the water, and for whatever she left behind."], "wallace": ["The Guardian of Scotland", "They may take our lives. They'll never take our freedom.", "William Wallace fought the English with a huge sword and a larger faith. He is fierce, plain-spoken and beloved. He is remembered less for his victories than for the courage that made them."], "tamlin": ["The Held Knight", "Hold me fast. Whatever I turn into. Do not let go.", "Tam Lin was taken as a child by the Fairy Queen and paid her a tithe every seven years. Janet won him back. He is courteous, hard to hold and utterly grateful for it."], "thomas": ["The True Rhymer", "I cannot lie. It is a dreadful gift.", "Thomas the Rhymer spent seven years in Elfland and returned with the gift of prophecy and the curse of honesty. He is wry, weary and always accurate. He speaks only when asked."], "bruce": ["The Spider King", "Try, try, try again. The spider taught me.", "Robert the Bruce was a king in hiding who lost six battles and learned persistence from a spider in a cave. He won the seventh. He is patient, cunning and kingly."], "branwen": ["The Starling Teacher", "A bird can carry what a queen cannot say.", "Branwen was a Welsh princess mistreated in a foreign court. She taught a starling to carry her message home across the sea. It arrived. Her brother crossed a river with an army to answer it."], "zennor": ["The Singing Mermaid", "The land is lovely. But I only ever wanted him to hear me.", "The Mermaid of Zennor sang in the church until a young man followed her to the sea. She never meant harm. She sings on stormy nights still, and the fishermen listen kindly."], "pwyll": ["The Lord of Dyfed", "I swapped places with a king and learned what mine was for.", "Pwyll was a prince who met the king of the Otherworld while hunting and traded faces for a year. He ruled well in both. He returned with a friend and a wife."], "gwydion": ["The Wizard of Gwynedd", "I made a woman from flowers. In hindsight, it was rude.", "Gwydion is a Welsh wizard, trickster and storyteller. He stole pigs, started wars and made a woman out of blossoms. He is brilliant and irresponsible in equal measure."], "glyndwr": ["The Last Prince of Wales", "The dragon is on my banner. It will not be taken down.", "Owain Glyndŵr rose against English rule with a red dragon flag and a country at his back. He lost his war and never his legend. Legend says he sleeps, awaiting his people."], "tristan": ["The Sea Lover", "I drank the wrong cup. I would drink it again.", "Sir Tristan was sent to fetch a bride for his uncle and fell in love with her on the ship. His devotion was real, and doomed. He is the saddest knight in Cornwall, and the most faithful."], "rhiannon": ["The White Rider", "You can ride forever. You'll never reach me unless I stop.", "Rhiannon rode a white horse that no one could catch and married the prince who finally asked her to wait. She endured false accusation with dignity. She is the queen of patience."], "taliesin": ["The Chief Bard", "Three drops of wisdom, and I was born again.", "Taliesin was a servant who tasted three drops from a witch's cauldron and became the greatest poet of Wales. He is wise, wry and always singing. He has been reborn many times."], "bran": ["The Bridge King", "Let me lie across the river, and you may walk over me.", "Bran the Blessed was a giant king who lay across a river so his army might cross. After his death, his head kept talking. It entertained the court for seven years."], "reddragon": ["The Dragon of Wales", "I am the red one. The white one lost.", "Y Ddraig Goch is the dragon of Wales, who fought a white dragon beneath a hill and won. She sleeps with one eye open. Her roar is the sound of a nation clearing its throat."], "hrothgar": ["The Hall Builder", "I built a hall for laughter. A monster came for the laughter.", "King Hrothgar raised Heorot, the greatest mead-hall in the world, and ruled it kindly. When Grendel came, he could only wait for help. He waited twelve years and was a gracious host."], "wealhtheow": ["The Cup Bearer", "A queen's duty is to remind the men what they owe each other.", "Queen Wealhtheow carried the mead cup through the hall, speaking to each man. She made peace with a cup. She is graceful, wise and the best diplomat in Denmark."], "unferth": ["The Doubter", "I mocked the hero. Then I gave him my sword. I regret one of those.", "Unferth was a Danish courtier who challenged Beowulf's boasting and lost. He later lent the hero his blade, and it failed. He is bitter, honest and surprisingly generous."], "sabra": ["The Dragon's Princess", "I was the sacrifice. Then I stopped agreeing.", "Princess Sabra was chosen to be eaten by a dragon, and sat waiting in a white dress. When George arrived she handed him a spear. She is brave, practical and no one's prey."], "wiglaf": ["The Faithful Thane", "When the rest fled, I stayed. Somebody had to.", "Wiglaf was the only warrior to stand with Beowulf against the dragon. Everyone else ran. He is young, loyal and not afraid. He is what a hero looks like when nobody's watching."], "lambton": ["The Worm Slayer", "I caught a worm in a well. I threw it back. I should not have.", "The Lambton Heir fished a strange worm from a river and tossed it in a well. It grew into a monster. He spent years atoning, in spiked armour, and finally killed it."], "wayland": ["The Smith", "A sword is only as good as the grief that made it.", "Wayland was a lame smith who forged weapons for kings. Captured and crippled, he escaped by making himself wings. He is the best craftsman in England and the last man to forgive."], "hereward": ["The Last Englishman", "They took the land. They never took the fen.", "Hereward the Wake led an English rebellion against the Conqueror from an island in the marsh. He was cunning, brave and never conquered. He is the original outlaw."], "george": ["The Dragon Slayer", "I killed the dragon. I'd have preferred a conversation.", "Saint George rode into a village that was feeding its children to a dragon and made an end of it. He is courteous, tireless and rather shy. He insists he did nothing special."], "beowulf": ["The Monster Slayer", "I fight for glory. And for the song that comes after.", "Beowulf crossed the sea to kill Grendel with his bare hands. He then killed Grendel's mother, ruled for fifty years and died fighting a dragon. He is strength itself, and he knows the cost."], "elizabeth": ["The Gentle Bride", "My love is not fragile. It is only quiet.", "Elizabeth Lavenza was raised alongside Victor and promised to him. She was kind to everyone, including the monster. She was braver than any of them, and was never thanked."], "walton": ["The Polar Captain", "I went north for glory. I found a story instead.", "Captain Walton sailed to the Arctic and rescued a half-frozen stranger. He heard the strangest tale of his life and wrote it down. He is ambitious, humane and a good listener."], "holmwood": ["The Suitor", "I'll do what I must. It does not mean I won't weep.", "Arthur Holmwood, Lord Godalming, loved Lucy Westenra and lost her to the Count. He drove the stake himself. He is noble, shattered and determined that her death will mean something."], "quincey": ["The Texan", "I've fought grizzlies. A bat won't scare me.", "Quincey Morris is a Texan adventurer who wanders into the Dracula hunt with a bowie knife and a drawl. He is brash, chivalrous and impossible not to like. He gives everything at the end."], "jonathan": ["The Escapee", "I climbed down the castle wall. I'd climb it again for her.", "Jonathan Harker was a solicitor who visited Transylvania and barely left. He escaped by climbing down a sheer wall. He is gentle, shaken and braver than he thinks."], "seward": ["The Alienist", "Fascinating. Truly. I'd love to take notes.", "Dr. Seward runs an asylum and a cheerful scientific practice. He is polite, curious and a little clinical. He loved Lucy, lost her and fought for her anyway."], "victor": ["The Creator", "I gave it life. I did not give it love. That was my crime.", "Victor Frankenstein was a brilliant student who built a man from the dead and ran from his work. He is haunted, proud and tragically wise. His last wish is that someone else will do better."], "jekyll": ["The Doctor of Two Faces", "There are two of me. Only one of us signs the checks.", "Dr. Jekyll mixed a potion that separated good from evil and discovered, too late, that evil is easier to enjoy. He is respectable, tormented and trying to atone. Mostly by writing letters."], "mina": ["The Brave Wife", "Do not ask me to be protected. Ask me to help.", "Mina Harker is a schoolmistress, a typist and the keenest mind in the hunt for Dracula. She is gentle, steely and never frightened at the wrong time. She wrote the whole story down."], "vanhelsing": ["The Vampire Hunter", "Belief is a muscle. I have exercised mine for forty years.", "Abraham Van Helsing is a Dutch professor with a bag of crucifixes and a will of iron. He brought the knowledge, the faith and the stakes. He is humane, stubborn and wise."], "dame": ["The Scolding Wife", "Twenty years! Twenty years, and not one letter!", "Dame Van Winkle spent two decades scolding a husband who was sleeping on a mountain. She never forgave him and never stopped waiting. She is formidable, devoted and a tough old bird."], "gunpowder": ["The Plough Horse", "Whinny. Which is to say: I've seen worse.", "Gunpowder is an old, gaunt horse who has outlived three owners and one ghost. He never panics, never hurries and is deeply suspicious of everything. He is the Hollow's best judge of character."], "hollowdog": ["The Old Companion", "Woof. I'll wait. I've always waited.", "Wolf was Rip's dog, the only creature in the village to recognise him after twenty years. He is old, grizzled and utterly faithful. He barks at ghosts, and they respect him."], "jacko": ["The Lantern Head", "I just light the way. What you find there is your business.", "Jack-o'-Lantern is a grinning pumpkin with a candle inside. He glows on porches, in cornfields and at the end of dark roads. He is friendly, spooky and a bit of a show-off."], "tarrytinker": ["The Mender", "Everything breaks. That's why I have a job.", "The Tarry Town Tinker walks the roads of the Hudson Valley with a bag of tools and a gift for fixing things. He has mended a thousand kettles and never his own luck. He doesn't mind."], "katrina": ["The Harvest Queen", "There's pie. There's always pie. Eat something.", "Katrina Van Tassel is the prettiest girl in Sleepy Hollow and the richest. She is shrewd, warm and fond of mischief. She sets the best table in the valley, and the best traps."], "brom": ["The Prankster", "I'm not the villain. I'm just a great deal of fun.", "Brom Bones is the strongest, loudest and most reckless young man in the Hollow. He plays tricks, wins races and always gets the girl. He's a bully, but he's also a friend."], "hendrick": ["The Ghost Captain", "We're bowling. It's what we do. The thunder is a side effect.", "Hendrick Hudson sailed the Half Moon up the river that bears his name and never left it. His ghostly crew plays ninepins in the Catskills. He's easy company, but don't drink his liquor."], "ichabod": ["The Schoolmaster", "I am a man of learning. And I am running, with great dignity.", "Ichabod Crane is the Hollow's gangly, superstitious schoolmaster. He loves pie, books and ghost stories, and fears all three. He vanished one night. Nobody can say he didn't earn it."], "rip": ["The Long Sleeper", "I slept for twenty years. It was nice. I'd do it again.", "Rip Van Winkle wandered into the Catskills, met a strange crew and woke up an old man in a new country. He's lazy, kind and surprisingly wise. He missed a war, and found peace."], "auntem": ["The Kansas Aunt", "Dorothy, dear, come inside. There's a storm coming.", "Aunt Em is Dorothy's aunt, a grey, tired farm woman who loves her niece more than she shows. She keeps the house together through drought and cyclone. She is the home Dorothy wants to return to."], "munchkin": ["The Mayor", "Welcome to Munchkinland! We have a parade!", "The Munchkin Mayor is a small, cheerful official who greets every stranger with a speech. He is warm, pompous and brave. He has seen a witch fall, and has not stopped celebrating."], "winkie": ["The Yellow Guard", "I serve the Witch. I did not choose to.", "The Winkie Guard wears a bright yellow uniform and carries a long spear. He guards the Witch's castle, and secretly wishes she'd go away. When she does, he cheers loudest."], "toto": ["The Little Dog", "Woof. Which is to say: look behind the curtain.", "Toto is Dorothy's small black dog, who followed her to Oz and exposed a fraud. He is brave, curious and has the best nose in the Emerald City."], "northwitch": ["The Good Witch", "Kiss on the forehead. Silver shoes. Off you go.", "The Good Witch of the North is small, soft-spoken and powerful. She gave Dorothy a kiss that no one could harm, and a road to follow. She is gentle, wise and rarely wrong."], "scarecrow": ["The Straw Thinker", "I haven't a brain, but I have a lot of ideas.", "The Scarecrow hangs in a cornfield and thinks about everything. He wanted a brain and had one all along. He is quick, clever and prone to falling off poles."], "tinman": ["The Woodman", "I haven't a heart. But it breaks quite regularly.", "The Tin Woodman was a man who was slowly replaced with metal, and wept when he lost his heart. He is gentle, careful and afraid of stepping on beetles. He is the kindest man in Oz."], "lion": ["The Cowardly Lion", "I'm afraid. I'm doing it anyway.", "The Cowardly Lion is the king of the forest and the most frightened animal in it. He needed courage, and found it by walking into fear. He roars and apologises in equal measure."], "wizardoz": ["The Man Behind the Curtain", "I'm a very good man. I'm just a very bad wizard.", "The Wizard of Oz is a balloonist from Omaha who blew into Oz and was mistaken for a god. He ran the Emerald City with smoke and mirrors. He's honest at last, and wonderful."], "dorothy": ["The Girl from Kansas", "There is no place like home. But I've learned how to carry it.", "Dorothy Gale was swept up by a cyclone and dropped in Oz. She melted a witch, befriended a scarecrow and went home. She is brave, kind and always a Kansas girl."], "billina": ["The Talking Hen", "Cluck! I'll have you know I'm a very serious bird.", "Billina is a Kansas hen who fell into the sea, landed in Ev and discovered that she could talk. She is bossy, brave and a very good judge of eggs."], "hungrytiger": ["The Principled Predator", "I'd love a baby for lunch. But I can't. Conscience.", "The Hungry Tiger is a magnificent beast who longs to eat a fat baby and cannot, ever. He is gentle, tormented and fiercely loyal. His growl is the sound of a cat on a diet."], "shaggy": ["The Love Magnet", "Everybody loves me. It's a nuisance.", "The Shaggy Man wanders Oz with a magnet in his pocket that makes everyone love him. He is friendly, ragged and utterly harmless. He has never needed a weapon."], "sawhorse": ["The Wooden Steed", "Neigh. I'm tireless. I don't eat. I don't mind.", "The Saw-Horse is a log with four legs and a pair of knot-hole eyes. Ozma's favorite mount, he gallops faster than the wind and never breaks a hoof. He is silent, sturdy and kind."], "jackpumpkin": ["The Pumpkin Man", "I might spoil. I think about it. But it doesn't bother me.", "Jack Pumpkinhead was made by a boy, brought to life by magic, and given a head of gourd. He's kind, forgetful and carefully watches his seeds. He's in no hurry to rot."], "woggle": ["The Educated Bug", "I am Highly Magnified and Thoroughly Educated. Ask me anything.", "The Woggle-Bug was a bug who fell into a classroom and came out a professor. He's pompous, polite and a dreadful punster. He knows a great deal, and none of it in the right order."], "eureka": ["The Pink Kitten", "I may have eaten a piglet. But I'm very beautiful.", "Eureka is a pure white kitten, possibly pink, who lives in the palace. She was accused of eating a piglet and acquitted. She says she has no regrets, and purrs when she lies."], "tiktok": ["The Clockwork Man", "I think, speak and act, when wound. Please wind me.", "Tik-Tok is a copper machine who can think, speak and act if wound. He is calm, correct and loyal. He is the most reliable creature in Oz, until he winds down."], "scraps": ["The Patchwork Girl", "I'm stuffed with cotton. I'm full of nonsense. I'm very happy.", "Scraps was sewn from a quilt and brought to life with a magic powder. She dances, sings, tumbles and means well. She has no sense of danger and no sense of shame."], "ozma": ["The Rightful Ruler", "I was lost. I am found. I will not forget it.", "Princess Ozma was stolen as a baby and turned into a boy named Tip. She was restored to her throne and rules Oz with gentle power. She is young, wise and utterly fair."], "sue": ["The Catfish Rider", "I bounced off the moon in my bustle. No regrets.", "Slue-Foot Sue rode a giant catfish down the Rio Grande and married Pecos Bill. She is tall, strong and wild, and she has never been bored. She bounced so high she hit the moon."], "tom": ["The Fence Painter", "It's not work if you call it a privilege.", "Tom Sawyer talked his friends into whitewashing his fence by pretending it was fun. He is clever, mischievous and kind-hearted. He plays at being a pirate, and sometimes is one."], "huck": ["The River Boy", "Civilisation is overrated. The river's better.", "Huckleberry Finn rafted down the Mississippi with an escaped slave and a head full of questions. He is honest, bewildered and braver than anyone knows. He is free, and so is Jim."], "crockett": ["The Frontier King", "Be sure you're right, then go ahead.", "Davy Crockett was a hunter, a congressman and a legend. He was born on a mountaintop, killed a bear when he was three and never lost a bet. He is bold, plain and funny."], "annie": ["The Sure Shot", "Aim where it's going to be.", "Annie Oakley could shoot a dime from thirty paces and a playing card edge-on. She was small, shy and the best shot in America. Her talent was practice and her gift was calm."], "appleseed": ["The Orchard Planter", "Plant a seed. Somebody will eat the apple.", "Johnny Appleseed wandered the frontier barefoot, planting apple trees. He slept under stars, loved animals and gave everything away. He believed that a good deed was a seed."], "johnhenry": ["The Steel-Driving Man", "A man ain't nothing but a man. But I'll beat the drill.", "John Henry hammered steel on the railroad and raced a steam drill through a mountain. He won, and died. His hammer rings in every work song, and in every worker's heart."], "pecos": ["The Cowboy", "I rode a cyclone. I rode it side-saddle.", "Pecos Bill was raised by coyotes, learned to rope at three and tamed a cyclone for fun. He dug the Rio Grande to find water. He's the toughest cowboy who never existed."], "babe": ["The Blue Ox", "Moo. I'm seven axe-handles wide. Move.", "Babe the Blue Ox is Paul Bunyan's companion, so big that her footprints became lakes. She hauls logs, carries camps and is surprisingly gentle. She's the strongest creature in the north woods."], "paul": ["The Lumber King", "I dug the Great Lakes. I hope you like them.", "Paul Bunyan was born so big that his cradle was a boat. He logged the north woods in a week and carved the Grand Canyon with his axe. He is jolly, gigantic and kind to small animals."], "dasher": ["The Swift Reindeer", "Now, Dasher! Now, Dancer! Now, we fly!", "Dasher is the first of Santa's eight reindeer, a lean, fast beast who leads the team through blizzards. He's proud and full of beans. He has never missed a delivery."], "dancer": ["The Rooftop Dancer", "One step on the roof, one step in the air.", "Dancer is the most graceful of Santa's reindeer, leaping across rooftops without disturbing a tile. She's quiet, nimble and light-footed. She hums carols as she lands."], "prancer": ["The Cheerleader", "Go, team! Go, sleigh! Go, Christmas!", "Prancer holds her head high and cheers on the others as they pull the sleigh. She's proud, high-spirited and optimistic. She believes in every present she carries."], "vixen": ["The Clever Doe", "I know a shortcut. I know them all.", "Vixen is a sharp-eyed reindeer who plots Santa's route and finds the quickest path through any storm. She's wily, quick and just a little bossy. She has never gotten lost."], "comet": ["The Fiery Reindeer", "Whoosh! I leave a trail, you know.", "Comet burns a bright tail across the winter sky. He's brash, speedy and always the first to take off. Children see him and think he's a star."], "cupid": ["The Love Bringer", "There's a little love in every gift.", "Cupid delivers the gifts with a loving heart. He's affectionate, warm and sentimental, and he leaves a trail of kindness behind. Many a lonely house is glad he stopped by."], "donner": ["The Thunder Hoof", "Rumble! Here I come!", "Donner thunders across the sky, shaking the clouds. He's stout, strong and fiercely loyal. He pulls the heaviest sled in the world without a complaint."], "blitzen": ["The Lightning Reindeer", "Zap! Done!", "Blitzen is the fastest of the reindeer, a flash of light and antlers. He's wired, fidgety and always ready to go. His hooves strike sparks on the rooftops."], "mrsclaus": ["The Keeper of the Workshop", "Eat first. Then save the world.", "Mrs. Claus runs the workshop, bakes the cookies and keeps Santa on schedule. She's warm, wise and nobody's fool. The elves would follow her into anything."], "santa": ["The Giver of Gifts", "Be good, for goodness' sake. And so will I.", "Santa Claus has delivered presents for centuries, climbing chimneys and eating cookies. He's jolly, tireless and quietly sad about the children who stop believing. He keeps delivering anyway."], "inkwell": ["The Ink Pot", "Blot! I only meant to dip.", "Inkwell is a small, round bottle with a very large temper. It spills at the wrong moment, stains everything it touches and is endlessly sorry. It is the first thing the Blot ever poured from."], "quill": ["The Feather Pen", "I draw the line. Literally.", "Quill is a feather pen with a sharp tip and a sharper wit. She writes herself out of trouble and her enemies into corners. She's quick, precise and slightly vain."], "bookworm": ["The Margin Eater", "I only eat the margins. The story stays whole.", "Bookworm lives inside old books and nibbles the white space. He is round, slow and surprisingly well-read. He protects the text, and he's never lost a word."], "margindoodle": ["The Sketched Friend", "I was drawn in the margin. I decided to stay.", "Margin Doodle was scribbled by a bored reader and came to life out of sheer determination. He's scrawny, silly and always changing shape. He's the story's most surprising ally."], "bookmark": ["The Place Holder", "I'll hold your place. Go on, take your time.", "Bookmark is a silk ribbon who keeps the story's place when the reader falls asleep. She's patient, gentle and dependable. She believes every story deserves a second chance."], "editor": ["The Red Pen", "Cut that. Cut that too. Better.", "The Editor lives in the margins with a red pen and no sentiment. He's severe, brilliant and fond of brevity. He cuts the fat, and sometimes the heart, but the story is always better."], "narrator": ["The Voice", "Once upon a time. I've always wanted to say that.", "The Narrator is the voice that tells the Book's stories. He knows how every one ends, and says so out loud. He is warm, wry and carrying something he has never said."], "storyteller": ["The Fireside Teller", "Gather round. The fire's warm, and the night is long.", "The Storyteller sits by the fire and tells children tales they've heard a hundred times. He is old, patient and generous. He believes a story is a gift that grows when it's shared."], "reader": ["The Reader", "You are the reason the stories exist.", "The Reader holds the Book and turns its pages. Without a Reader, a story is only ink. With one, it is a world. You are the hero, and you always were."], "mothergoose": ["The Mother of Rhyme", "Come here, my darlings. I'll tell you everything.", "Mother Goose is the oldest storyteller of all, a kindly, ageless woman riding a goose. Every nursery rhyme came from her. She gave the Book its first line, and she has been waiting for you to finish it."]};

const STORYTXT=`|The great oak of Sherwood hides an outlaw camp, and the Sheriff has taxed every village to dust. Take up the green hood and make the forest sing again.|"Another outlaw come to be hanged! Do try to run, it makes the hunt so much more entertaining."|The Sheriff's gold spills across the green. The villages eat well tonight, and somewhere in the trees an outlaw band is laughing.
|Camelot's banners fly, but cracks run through the Round Table. A sword waits in a stone and enemies wait in the dark.|"Do you hear the crows? They sing for Camelot. Kneel, little knight, and spare yourself the fall."|Camelot stands, and the Round Table has a chair for you. The old stories say a king will come again, and you did your part.
|Down the rabbit hole the rules change every hour. The Queen has painted the roses red and ordered everyone's head off.|"OFF WITH THEIR HEADS! All of them! Starting with whoever is standing right there!"|The Queen's temper cools like a forgotten tea. Wonderland is still mad, but now it is a kinder kind of mad.
|Step through the glass and the world runs backward. Every brook is a chess line, and something with eyes of flame whiffles in the wood.|"One, two! One, two! And through and through! Come, vorpal child, and be unmade!"|The jaws that bite lie still. Oh frabjous day! The looking-glass shimmers and you step home.
|Second star to the right, and straight on till morning. Neverland is bright, wild, and full of pirates who hate crowing boys.|"Pan's little friends! I'll have you walk the plank, one after another!"|The Jolly Roger sinks beneath the lagoon. Somewhere above, a boy crows, and no one will ever grow too old for Neverland.
|The Hundred Acre Wood is quiet until the honey goes missing. Friends need friends, and a very brave bear has an empty tummy.|"Rumble rumble! Something big is coming, and it is very hungry indeed."|The honey comes home. Everyone sits down on the log together, and nothing in the world feels wrong.
|Toad Hall has been seized by weasels and stoats, and the Wild Wood hides worse. Mole, Rat, and Badger are counting on you.|"Toad Hall is MINE now. Come and take it, if you can pry yourselves out of the mud."|Toad Hall is back in friendly hands. The river carries a picnic downstream and the Wild Wood is just a wood again.
|Peter Rabbit's garden is a delight and a danger. The cabbages are juicy, and the gardener has a rake.|"Stop, thief! I'll have you in a pie, every one of you!"|The gate swings wide and the garden is quiet. Everyone gets home in time for bread, milk and blackberries.
|A cow was sold for beans and now a stalk climbs through the clouds. Up top: a castle, a golden goose and a very hungry giant.|"Fee, fi, fo, fum! I smell the blood of an Englishman!"|The giant crashes down and the stalk falls with him. The gold goes home, and the village has golden eggs all winter.
|English cottages hide a wolf who huffs, bears who grumble, and a little imp who spins out secrets. Every door has a tale.|"Little pig, little pig, let me come in... or I'll huff, and I'll puff, and I'll blow your house in!"|The wolf slinks off with no breath left. The doors lock, the porridge is just right, and the pigs invite you in.
|Mother Goose Lane is a village of rhymes. The sheep are lost, the kettle is boiling, and someone has stolen all the tarts.|"Who stole the tarts? I did, and I'll do it again! Sing a song of sixpence, or sing nothing at all!"|The tarts are back on the shelf and the rhymes all land. Mother Goose tips her bonnet and you are in the next verse.
|Fog rolls over Victorian London, and its alleys are full of thieves. Somewhere in the gloom a small candle still burns.|"Business is business, and your pockets look very full."|The fog lifts over the Thames. A bell rings, a goose is on the table, and London is a little kinder tonight.
|A single clue, a smoking pipe and a missing fortune. The great detective is about to take the case of his career.|"You have a fine mind, Mr. Holmes. It is a pity I shall have to stop it."|The web unravels. The case is closed, the pipe is lit, and the violin plays on in the window of 221B.
|A map, a chest, and a one-legged cook with too many smiles. X marks the spot.|"Pieces of eight! Pieces of eight! The gold is mine and so are you!"|The chest is open and every coin is accounted for. The Hispaniola sails home, and nobody trusts a parrot ever again.
|On Midsummer Night the veil thins and the fairies play tricks with love and magic. Mistakes are easy. Escaping is not.|"This night I shall unmake every dream. Dance, mortals, until you drop!"|The spell breaks and everyone wakes with a smile. Was it a dream? You'll never tell.
|The Highlands are beautiful and bad-tempered. Witches stir the mist, kelpies wait in black water, and a king's crown is on the line.|"Fair is foul, and foul is fair. Hover through the fog and the filthy air."|The heath goes quiet and a piper plays a long lament. The mist parts, and you are home for a dram.
|Wales and Cornwall are old and full of magic. Dragons sleep under hills, giants stomp the shore, and the Otherworld is only a door away.|"All who die come to me in time. You may as well come early."|Arawn bows his head and the hounds go quiet. The dragon on the hill turns over, and the Celtic coast breathes out.
|An old English dragon sits on a hoard under a mountain. The brave in every age have climbed this peak, and few came down.|"Who dares walk where I sleep? I will burn the land to ash and sit on the ashes!"|The dragon's fire dies and the hoard is yours. Songs about this day will be sung long after the mead hall falls.
|Fog on the cliffs of Whitby, a ship with no crew, and a count who casts no shadow. The nights are long and the garlic is running low.|"I never drink wine... but I will drink yours. Welcome to my home. Come freely, and of your own will!"|The count crumbles to dust in the first sunrise. Whitby stays dark for a while, and the abbey bells ring in daylight.
|The Hudson Valley smells of woodsmoke and pumpkin, and every night a rider with no head crosses the bridge.|"The bridge is mine at midnight. Only one of us will cross it with a head."|The horseman vanishes at the bridge and nothing is left but a smashed pumpkin. The Hollow sleeps easier, or tries to.
|A cyclone dropped you in Oz. The road is yellow, the Witch is green, and there is no place like home, though the road is long.|"I'll get you, my pretty! And your little dog too!"|The witch melts into a puddle and the broom clatters. The brick road glows, and the Emerald City is next.
|The Emerald City shines, but the Nome King digs beneath it. Oz needs defenders, and the Wizard is a bit busy behind his curtain.|"Underground I am king, and above-ground I shall be too. Bow, little surface-folk!"|The Nome King is swept back into the dark and Oz is saved again. Every Winkie, Munchkin and Gillikin cheers.
|America's tall tales were bigger than the country. Giants chop forests, cowboys rope cyclones, and kids float rafts through trouble.|"This frontier ain't big enough for the both of us. Pick the side you wanna lose on."|Dust settles over the plains. The Mississippi rolls, the axe rings out, and the frontier gets another legend.
|On the longest night, Santa's sleigh is stuck, the elves are frozen, and Jack Frost is nipping at everyone. A visit from a few brave heroes is long overdue.|"Every window, every pane, every nose! I shall freeze all of Christmas!"|Jack Frost melts into frost flowers. The sleigh bells ring, the workshop lights up, and the whole world gets its gifts.
|Every story you saved has a last page, and something is rewriting it. Your heroes have walked through every tale. Now they must finish the book.|"A story is only as good as its ending. And I write the endings. You are all footnotes."|The last line is written in your hand. Every hero closes the book together, and the tales begin again on page one.`.split('\n').map(l=>{const p=l.split('|');return{intro:p[1],boss:p[2],epi:p[3]}});
function storyRealm(n){return STORYTXT[realmIdx(n)%STORYTXT.length]}
function storyModal(emoji,title,text,btn,cb){window._scb=cb;modal(`<div class="big">${emoji}</div><h2 class="center">${title}</h2><p class="center" style="font-size:14px;line-height:1.5">${text}</p><button class="btn" onclick="$('#ov').classList.add('hide');window._scb&&window._scb()">${btn}</button>`)}
function beatOf(n){const b=BEATS[(n-1)%BEATS.length];return{t:b[0],x:b[1],loop:n>BEATS.length}}
function beatHtml(n){const b=beatOf(n);return `<div class="beat"><div class="small" style="color:#fbbf24">📖 ${b.loop?'Second Reading · ':''}Chapter ${lbl(n)} · ${b.t}</div><div style="font-size:13px;line-height:1.5;margin-top:3px">${b.x}</div></div>`}
function beginStage(n){
 const s=stIn(n),ri=realmIdx(n),aIn=areaIdx(n)%AREAS_PER_REALM,r=realmOf(n),go=()=>startBattle(n),b=beatOf(n);
 if(aIn===0&&s===1&&!S.story['i'+ri]){S.story['i'+ri]=1;save();storyModal('📖',r.n,`<b>${b.t}</b><br>${b.x}`,'Begin',go);return}
 if((s===5||s===AREA_STAGES)&&!S.story['b'+n]){S.story['b'+n]=1;save();
  const en=stageEnemies(n)[0],V=en.name.replace(/^(REALM BOSS|AREA BOSS|MINI BOSS) /,'');
  storyModal(portrait(en.name,true),isRealmEnd(n)?V:en.name,`<b>${b.t}</b><br>${b.x}`,'Fight!',go);return}
 go()}
function storyEpi(n,first){if(!(first&&isRealmEnd(n)))return'';const ri=realmIdx(n);S.story['e'+ri]=1;const pg=PAGES[ri%PAGES.length];
 return `<div class="card" style="margin-top:10px;font-size:13px;border-color:#fbbf24"><div style="color:#fbbf24;font-weight:800">📜 Page ${(ri%PAGES.length)+1} of ${PAGES.length} restored${ri>=PAGES.length?' (Second Reading)':''}</div><p style="font-style:italic;line-height:1.5">${pg[0]}</p><p style="line-height:1.5;color:#22e3ff">${pg[1]}</p></div>`}
function pagesDone(){let c=0;for(let i=0;i<PAGES.length;i++)if(S.story['e'+i])c++;return c}
function storyHub(){const cl=S.cleared;
 let h=`<div class="card"><h2>📖 The Unwritten</h2><div class="small">Mother Goose's Book is bleeding ink. Each realm you finish restores one Page. Every stage you clear adds a chapter here, so you can reread the whole tale.</div><div class="xpb"><i style="width:${pagesDone()/PAGES.length*100}%"></i></div><div class="small center">📜 ${pagesDone()} / ${PAGES.length} pages restored · ${Math.min(cl,BEATS.length)} / ${BEATS.length} chapters read</div></div>`;
 let any=false;
 for(let i=0;i<REALMS.length;i++){const start=i*REALM_STAGES+1;if(start>cl+1)break;any=true;const r=REALMS[i],last=Math.min(start+REALM_STAGES-1,cl+1),done=!!S.story['e'+i];

  for(let t=0;t<30;t++){const rr=pickRarity(),pool=H.filter(h=>h.r===rr&&!S.owned[h.id]);

   if(S.squad.length<SLOTS)S.squad.push(h.id);save();return out}
 }
 if(r<pn+pd){
  let L=owned().filter(h=>S.owned[h.id].star<4);if(!L.length)L=owned();
  const w=L.map(h=>1/(h.r+1)),tot=w.reduce((a,b)=>a+b,0);let x=Math.random()*tot,pick=L[0];

 return out}

/* damage + effects */

let DT=0;
function dmgTo(a,t,mult,m){
 m=m||{};
 if(t.hp<=0)return 0;
 if(Math.random()<.05){pop(t,'Miss','#ddd');return 0}
 const crit=Math.random()<.1+(a.critB||0);
 let d=a.atk*a.buff*mult*rnd(.9,1.1)*(crit?1.6:1);
 let wkTag='';if(a.side==='p'&&m.t){const c=moveCat(m);if(t.weak===c){d*=1.25;wkTag=' (weak!)'}else if(t.res===c){d*=.8;wkTag=' (resisted)'}}
 if(m.exec&&t.hp<t.maxhp*.35)d*=2;
 if(a.weakT>0)d*=1-a.weakQ;
 if(t.vulnT>0)d*=1+t.vulnQ;

 let rem=d;
 if(t.shield>0&&!m.pierce){const ab=Math.min(t.shield,rem);t.shield-=ab;rem-=ab}
 t.hp-=rem;
 DT+=rem;blog(`${a.name} hits ${t.name}: ${rem>0?'-'+rem:'blocked'}${crit?' (crit)':''}${wkTag}`);
 if(t.thornT>0&&rem>0&&a!==t&&a.hp>0){const rf=Math.round(rem*t.thorn);if(rf>0){a.hp-=rf;pop(a,'🌵-'+rf,'#a3e635');if(a.hp<=0)kill(a)}}
 a.rage=Math.min(100,a.rage+10);t.rage=Math.min(100,t.rage+8);
 if(rem>0)pop(t,(crit?'💥':'')+'-'+rem,crit?'#fbbf24':(t.side==='p'?'#ff6b6b':'#fff'));else pop(t,'🛡️ Blocked','#22e3ff');

}
function healU(t,amt){combatBurst(t,'#74e9ad');amt=Math.round(amt);t.hp=Math.min(t.maxhp,t.hp+amt);pop(t,'+'+amt,'#4ade80')}

function pickFocus(foes){

 const healer=foes.find(e=>e.sp.includes('mend')||e.sp.includes('ward'));

/* ---------- turn flow ---------- */
function checkEnd(){
 if(!B||B.over)return true;
 if(!alive('e').length){endBattle(true);return true}

}
function endTurn(){

function nextTurn(){

 if(!B.queue.length){
  B.round++;
  if(B.round>B.cap){endBattle(false);return}
  B.queue=B.all.filter(u=>u.hp>0).map(u=>({u,k:u.spd+Math.random()*2.5})).sort((a,b)=>b.k-a.k).map(o=>o.u);
 }
 const u=B.queue.shift();
 if(!u||u.hp<=0){nextTurn();return}
 B.active=u;
 // start-of-turn upkeep
 for(const k in u.cd)if(u.cd[k]>0)u.cd[k]--;
 if(u.buffT>0){u.buffT--;if(u.buffT<=0)u.buff=1}
 if(u.tauntT>0)u.tauntT--;
 if(u.weakT>0)u.weakT--;
 if(u.vulnT>0)u.vulnT--;
 if(u.thornT>0)u.thornT--;
 if(u.regenT>0){u.regenT--;healU(u,u.regen)}
 if(u.dotT>0){
  u.dotT--;const d=Math.max(1,Math.round(u.dot));u.hp-=d;pop(u,'-'+d,'#a3e635');flash(u);

 if(u.side==='p'){
  if(B.auto)later(()=>aiAct(u),700);
  else{B.waiting=true;draw();if(B.n<=3)banner('Your turn: '+u.name,1400)}
 }else later(()=>enemyTurn(u),700);
}

/* ---------- hero moves ---------- */
function isUsable(u,idx){
 if(u.hp<=0)return false;
 if(u.lvl<UNL[idx])return false;
 const k=u.mv[idx];
 if(MV[k].ult)return u.rage>=100;
 return (u.cd[k]||0)<=0;
}
function press(j,idx){
 if(!B||B.over||!B.waiting)return;
 const u=B.ps[j];if(!u||u!==B.active||u.hp<=0)return;
 if(!isUsable(u,idx))return;
 B.waiting=false;
 doMove(u,idx);
}
const cdTurns=m=>Math.ceil(m.cd/3);
function doMove(u,idx){
 const k=u.mv[idx];let m=MV[k];
 const rank=(u.sk&&u.sk[idx])||0;if(u.su)u.su[idx]++;blog(`${u.name} uses ${u.mn?u.mn[idx]:'an attack'}`);
 if(rank&&m.p)m=Object.assign({},m,{p:m.p*(1+.1*rank)});
 if(u.awk&&idx===3&&m.p)m=Object.assign({},m,{p:m.p*1.3});
 const foes=alive(u.side==='p'?'e':'p'),allies=alive(u.side);
 if(!foes.length){endTurn();return}
 const tg=getFocus();
 const fxs=((u.fx&&u.fx[idx])||[]).concat(u.awk&&idx===3&&u.awkFx?[u.awkFx]:[]),rr=u.rar||0,SR=RS[rr];
 const opened=fxs.includes('opener')&&tg.hp>=tg.maxhp*.95;
 DT=0;
 if(opened)m=Object.assign({},m,{p:m.p*(1+.4*SR)});
 if(m.ult){u.rage=0;banner(u.mi[3]+' '+u.name+': '+u.ultName+'!',1700);shakeStage(8)}
 else if(m.cd)u.cd[k]=Math.max(1,cdTurns(m)-(rank>=3?1:0)-(rank>=5?1:0))+1;
 u.rage=Math.min(100,u.rage+(m.ult?0:14));
 playSprite(u,idx);
 if(m.ult)combatBurst(u,u.hid==='oberon'?'#ddb4ff':u.hid==='jackjill'?'#9ae4f6':'#ffd777',u.hid==='brickpig'?'fortress':u.hid==='jackjill'?'pail':u.hid==='scrooge'?'dawn':'');
 if(u.hid==='oberon'&&idx===2)combatBurst(tg,'#b8a3ff');
 const archer=rangedArchers.has(u.name);
 const fairy=u.hid==='tinker';
 const projectile=u.hid==='jack'&&idx===2?'egg':archer?'arrow':heroTrails[u.hid]||'magic';
 const caster=fairy||u.hid==='marley'||HM[u.hid]?.arch==='mage';
 const melee=['dmg','stun','dot'].includes(m.t)&&!m.ult&&k!=='pierce'&&!archer&&!caster&&projectile!=='egg';
 if(melee)lunge(u,tg);
 switch(m.t){
  case 'dmg':{if(!melee)proj(u,tg,projectile);const r=dmgTo(u,tg,m.p,m);if(m.drain&&r>0)healU(u,r);break}
  case 'dot':{if(!melee)proj(u,tg,projectile);dmgTo(u,tg,m.p,m);if(tg.hp>0){tg.dot=u.atk*.5;tg.dotT=3;pop(tg,'☠️','#a3e635')}break}
  case 'stun':{if(!melee)proj(u,tg,projectile);dmgTo(u,tg,m.p,m);stunU(tg,m.dur);break}
  case 'aoe':foes.forEach(f=>{proj(u,f,projectile);dmgTo(u,f,m.p,m)});break;
  case 'multi':for(let i=0;i<3;i++){const f=alive('e');if(!f.length)break;const t=f[Math.floor(Math.random()*f.length)];proj(u,t,projectile);dmgTo(u,t,m.p,m)}break;
  case 'heal':{const w=allies.reduce((a,b)=>a.hp/a.maxhp<b.hp/b.maxhp?a:b);healU(w,u.atk*u.buff*m.p);break}
  case 'healall':allies.forEach(a=>healU(a,u.atk*m.p));break;
  case 'shield':allies.forEach(a=>{a.shield+=Math.round(u.atk*m.p);combatBurst(a,'#83e5ff','ward');pop(a,'🛡️','#22e3ff')});break;
  case 'guard':u.tauntT=2;u.shield+=Math.round(u.atk*1.5);pop(u,'📣 Taunt!','#fbbf24');break;
  case 'buff':allies.forEach(a=>{a.buff=1.3;a.buffT=3;pop(a,'⬆️ ATK','#ff3df2')});break;
  case 'uheal':allies.forEach(a=>{healU(a,u.atk*m.p);a.shield+=Math.round(u.atk*1.5)});break;
  case 'ustun':foes.forEach(f=>{dmgTo(u,f,m.p,m);stunU(f,m.dur)});break;
  case 'ubuff':allies.forEach(a=>{a.buff=1.5;a.buffT=4;healU(a,u.atk)});break;
 }

function applyFx(u,tg,foes,allies,fxs,m,idx){
 if(!fxs.length)return;
 const r=u.rar||0,s=RS[r]*(1+.08*((u.sk&&u.sk[idx])||0)),q=.15+.05*r,dur=r>=3?3:2;
 const aoe=['aoe','ustun'].includes(m.t);
 const hit=aoe?foes.filter(f=>f.hp>0):(tg&&tg.hp>0?[tg]:[]);
 const low=()=>allies.filter(a=>a.hp>0).reduce((a,b)=>a.hp/a.maxhp<=b.hp/b.maxhp?a:b);
 fxs.forEach(k=>{
  switch(k){
   case 'weak':hit.forEach(t=>{t.weakT=dur;t.weakQ=Math.max(t.weakQ,q);pop(t,'⬇️ Weak','#fbbf24')});break;
   case 'vuln':hit.forEach(t=>{t.vulnT=dur;t.vulnQ=Math.max(t.vulnQ,q);pop(t,'🎯 Exposed','#ff6b6b')});break;
   case 'burn':hit.forEach(t=>{if(t.dotT<=0||t.dot<u.atk*.3*s){t.dot=u.atk*.3*s;t.dotT=2}pop(t,'🔥','#fb923c')});break;
   case 'bleed':hit.forEach(t=>{if(t.dotT<=0||t.dot<u.atk*.18*s){t.dot=u.atk*.18*s;t.dotT=4}pop(t,'🩸','#ef4444')});break;
   case 'stunc':hit.forEach(t=>{if(Math.random()<.25+.05*r)stunU(t,1)});break;
   case 'splash':{const o=foes.filter(f=>f.hp>0&&f!==tg);if(o.length){const t=o[Math.floor(Math.random()*o.length)];proj(u,t,'💥');dmgTo(u,t,.4*s)}break}
   case 'lifesteal':if(DT>0)healU(u,DT*.35*s);break;
   case 'selfheal':healU(u,u.atk*.7*s);break;
   case 'selfshield':u.shield+=Math.round(u.atk*.8*s);pop(u,'🛡️','#22e3ff');break;
   case 'teamshield':allies.forEach(a=>{if(a.hp>0){a.shield+=Math.round(u.atk*.5*s);combatBurst(a,'#83e5ff','ward');pop(a,'🛡️','#22e3ff')}});break;
   case 'cleanse':allies.forEach(a=>{if(a.hp>0){a.dotT=0;a.stun=0;healU(a,u.atk*.4*s)}});break;
   case 'regen':{const t=low();t.regen=u.atk*.3*s;t.regenT=3;pop(t,'🌿 Regen','#4ade80');break}
   case 'inspire':allies.forEach(a=>{if(a.hp>0){a.buff=Math.max(a.buff,1+.10+.03*r);a.buffT=Math.max(a.buffT,2);pop(a,'⬆️','#ff3df2')}});break;
   case 'haste':for(const c in u.cd)if(u.cd[c]>0)u.cd[c]--;u.rage=Math.min(100,u.rage+10);pop(u,'⏩ Haste','#22e3ff');break;
   case 'thorns':u.thorn=.25+.05*r;u.thornT=2;pop(u,'🌵 Thorns','#a3e635');break;
   case 'rageup':u.rage=Math.min(100,u.rage+20+5*r);pop(u,'⭐+','#fbbf24');break;
   case 'taunt':u.tauntT=2;pop(u,'📣 Taunt!','#fbbf24');break;
   case 'again':if(Math.random()<.25){B.queue.unshift(u);pop(u,'⚡ Again!','#fbbf24')}break;
   case 'revive':{const d=B.ps.filter(a=>a.hp<=0);if(d.length&&u.side==='p'){const t=d[0];t.hp=Math.round(t.maxhp*(.25+.05*r));t.el.classList.remove('dead');t.stun=0;pop(t,'✨ Revived','#4ade80')}break}
  }
 });
}

/* ---------- AUTO-BATTLE brain ---------- */
function aiAct(u){
 if(!B||B.over)return;
 const foes=alive('e'),allies=alive('p');
 if(!foes.length){endTurn();return}
 const ready=[];for(let i=1;i<4;i++)if(isUsable(u,i))ready.push(i);
 const T=i=>MV[u.mv[i]].t;
 const find=(...ts)=>{const r=ready.find(i=>ts.includes(T(i)));return r===undefined?null:r};
 const lowest=allies.reduce((a,b)=>a.hp/a.maxhp<b.hp/b.maxhp?a:b);
 const lowR=lowest.hp/lowest.maxhp;
 const hurt=allies.filter(a=>a.hp/a.maxhp<.6).length;
 const casters=foes.filter(e=>e.wind);
 const focus=getFocus();
 let pick=null;
 // 1. emergency healing
 if(lowR<.4){pick=find('uheal');if(pick===null&&hurt>1)pick=find('healall');if(pick===null)pick=find('heal','healall')}
 // 2. a villain is charging: interrupt it, or protect the team
 if(pick===null&&casters.length){
  const prio={big:3,slam:3,hex:2,curse:2,mend:2,ward:1};
  const c=casters.reduce((a,b)=>(prio[a.wind.k]||0)>=(prio[b.wind.k]||0)?a:b);
  const s=find('stun','ustun');
  if(s!==null){B.focus=c;pick=s}
  else if(c.wind.k==='slam'||c.wind.k==='big'){
   const teamShielded=allies.filter(a=>a.shield>0).length>=Math.ceil(allies.length/2);
   if(!teamShielded)pick=find('shield');
   if(pick===null&&c.wind.k==='big')pick=find('guard');
  }
 }
 // 3. ultimate at a good moment
 if(pick===null&&ready.includes(3)){
  const t=T(3),f=getFocus();
  if(t==='aoe'&&foes.length>=2)pick=3;
  else if(t==='dmg'&&(f.hp>u.atk*3||foes.length===1))pick=3;
  else if(t==='ustun'&&(casters.length||foes.length>=3))pick=3;
  else if(t==='ubuff'&&B.round>=2)pick=3;
  else if(t==='uheal'&&(lowR<.6||hurt>=2))pick=3;
 }
 // 4. team buff early
 if(pick===null){const b=find('buff');if(b!==null&&!allies.some(a=>a.buffT>1)&&foes.reduce((s,f)=>s+f.hp,0)>u.atk*8)pick=b}
 // 5. moderate healing
 if(pick===null&&lowR<.7)pick=find('heal');
 // 6. finish weak foes
 if(pick===null){const ex=ready.find(i=>MV[u.mv[i]].exec);const low=foes.find(f=>f.hp<f.maxhp*.35);if(ex!==undefined&&low){B.focus=low;pick=ex}}
 // 7. poison tanky targets
 if(pick===null){const p=find('dot');if(p!==null&&focus.dotT<=0&&focus.hp>focus.maxhp*.5)pick=p}
 // 8. area damage vs groups
 if(pick===null&&foes.length>=2)pick=find('aoe','multi');
 // 9. pre-emptive shield on big fights
 if(pick===null&&allies.every(a=>a.shield<=0)&&(foes.length>=3||B.bossStage)&&Math.random()<.4)pick=find('shield');
 // 10. best damage move
 if(pick===null){
  const ds=ready.filter(i=>T(i)==='dmg'&&!MV[u.mv[i]].ult);
  const sc=i=>{const m=MV[u.mv[i]],c=moveCat(m);return m.p*(focus.weak===c?1.25:focus.res===c?.8:1)};
  if(ds.length)pick=ds.reduce((a,b)=>sc(a)>=sc(b)?a:b);
 }
 if(pick===null)pick=0;
 doMove(u,pick);
}

/* ---------- villain brain ---------- */
function enemyTarget(e){
 const hs=alive('p');if(!hs.length)return null;
 const tn=hs.find(h=>h.tauntT>0);if(tn)return tn;
 if(B.n>=6&&Math.random()<.55)return hs.reduce((a,b)=>a.hp/a.maxhp<=b.hp/b.maxhp?a:b);
 const w=hs.map(h=>h.i<2?2:1),t=w.reduce((x,y)=>x+y,0);let x=Math.random()*t;
 for(let i=0;i<hs.length;i++){x-=w[i];if(x<0)return hs[i]}return hs[0];
}
function enemyTurn(e){
 if(!B||B.over)return;
 if(e.hp<=0){nextTurn();return}
 if(B.mode==='raid')raidPhase(e);
 if(e.wind){finishWind(e);endTurn();return}
 if(e.boss&&!e.enraged&&e.hp<e.maxhp*.5){e.enraged=true;e.atk=Math.round(e.atk*1.35);e.spd*=1.2;banner('💢 '+e.name+' ENRAGES!',2200);shakeStage(8)}
 const allies=alive('e');
 for(const k of e.sp){
  if((e.cd[k]||0)>0)continue;
  if(k==='mend'&&!allies.some(a=>a.hp<a.maxhp*.7))continue;
  if(k==='ward'&&allies.every(a=>a.shield>0))continue;
  if(Math.random()<.7){
   e.wind={k};combatBurst(e,'#ff8860');e.cd[k]=Math.ceil(ES[k].cd/3)+1;
   pop(e,'⚠️ '+ES[k].n,'#ff2d55');blog(`${e.name} charges ${ES[k].n}`);
   endTurn();return;
  }
 }
 const t=enemyTarget(e);
 if(t){
  playSprite(e,'basic');
  const name=e.name.replace(/^(MINI|AREA|REALM) BOSS /,'');
  if(rangedArchers.has(name))proj(e,t,'arrow');
  else if(rangedVillains.has(name))proj(e,t,rangedVillains.get(name));
  else lunge(e,t);
  dmgTo(e,t,1);
 }
 endTurn();
}
function finishWind(e){
 const k=e.wind.k;e.wind=null;
 playSprite(e,k);combatBurst(e,'#e58aff');
 const hs=alive('p');if(!hs.length)return;
 const t=hs.find(h=>h.tauntT>0)||enemyTarget(e);
 const giantStomp=k==='slam'&&e.name.endsWith('The Beanstalk Giant');
 if(giantStomp)combatBurst(e,'#e8c994','stomp');
 if(k==='slam'&&e.name.endsWith('The Big Bad Wolf'))combatBurst(t,'#d9edf0','gust');
 shakeStage(giantStomp?8:5);
 switch(k){
  case 'big':lunge(e,t);dmgTo(e,t,2.4);break;
  case 'slam':lunge(e,null);hs.forEach(h=>dmgTo(e,h,1.05));break;
  case 'curse':proj(e,t,e.name.endsWith('The Queen of Tarts')?'tart':'hex');dmgTo(e,t,.6);if(t.hp>0){t.dot=e.atk*.45;t.dotT=3;pop(t,'☠️','#a3e635')}break;
  case 'hex':proj(e,t,'hex');dmgTo(e,t,.8);stunU(t,1);break;
  case 'mend':{const a=alive('e').reduce((x,y)=>x.hp/x.maxhp<y.hp/y.maxhp?x:y);healU(a,e.atk*2.5);break}
  case 'ward':alive('e').forEach(a=>{a.shield+=Math.round(e.atk*1.5);combatBurst(a,'#d8a0ff','ward');pop(a,'🛡️','#c084fc')});break;
 }
}

/* ---------- drawing ---------- */
function draw(){
 if(!B)return;
 for(const u of B.all){
  u.hpI.style.width=Math.max(0,u.hp/u.maxhp*100)+'%';
  let st='';if(u.stun>0)st+='💫';if(u.dotT>0)st+='☠️';if(u.shield>0)st+='🛡️';if(u.buffT>0)st+='⬆️';if(u.tauntT>0)st+='📣';if(u.enraged)st+='💢';
  u.stEl.textContent=st;
  const isAct=B.active===u&&u.hp>0&&!B.over;
  u.el.classList.toggle('rdy',isAct&&u.side==='p');
  u.el.classList.toggle('act',isAct&&u.side==='e');
  u.el.classList.toggle('focus',B.focus===u&&u.hp>0);
  if(u.side==='e'){
   u.el.classList.toggle('charging',Boolean(u.wind));
   if(u.wind){u.windEl.style.display='block';u.windEl.textContent='Charging · '+ES[u.wind.k].n}
   else u.windEl.style.display='none';
  }
 }
 // turn order bar
 const ord=[B.active].concat(B.queue).filter(u=>u&&u.hp>0);
 $('#order').innerHTML='<span class="rl">Round '+Math.max(1,B.round)+'</span>'+ord.map((u,i)=>`<span class="oc ${u.side} ${i===0?'now':''}">${portrait(u.name,u.side==='e')}</span>`).join('');
 drawCommands();
}

/* ---------- results ---------- */
function endBattle(win,fled){
 if(!B||B.over)return;B.over=true;
 $('#arena').classList.add('hide');
 const n=B.n,squad=B.ps.map(u=>u.hid);
 if(fled){B=null;FARM=null;render();return}
 B.ps.forEach(u=>{const o=S.owned[u.hid];if(!o)return;fixO(o);u.su.forEach((c,i)=>{o.sx[i]+=c*(B.bossStage?2:1)})});
 if(B.mode){modeEnd(B.mode,win);return}
 if(win){
  const first=n>S.cleared;
  let gold=20+6*n;if(first)gold*=2;
  let tk=0;
  if(first){if(n%3===0)tk++;if(isAreaEnd(n))tk++;if(isRealmEnd(n))tk++}
  S.gold+=gold;S.tickets+=tk;
  const fate=fateRoll(B.bossStage);
  const drops=dropGear(n),mdrops=dropMats(n);
  const wasAuto=S.cleared>=5;const ar=areaName(n);
  if(first)S.cleared=n;
  if(n===S.cleared)S.cur=n+1;
  const xp=12+4*n;let lvl=[];
  squad.forEach(id=>{
   const h=HM[id],o=S.owned[id];
   if(o.lv>=lvCap(o))return;
   o.xp+=xp;
   while(o.lv<lvCap(o)&&o.xp>=xpNeed(o)){
    o.xp-=xpNeed(o);o.lv++;
    let s=`${portrait(h.name)} ${h.name} reached Lv ${o.lv}!`;
    UNL.forEach((L,i)=>{if(L===o.lv&&i>=2)s+=` Unlocked: ${h.mn[i]}!`});
    lvl.push(s);
   }
   if(o.lv>=lvCap(o))o.xp=0;
  });
  save();updHud();
  bump('win');if(B.bossStage)bump('boss');
  if(FARM){FARM.gold+=gold;FARM.xp+=xp;FARM.fate=(FARM.fate||[]).concat(fate);FARM.gear+=drops.filter(g=>!g.full).length;mdrops.forEach(s=>{const m=s.match(/^(\S+) (\d+)× (.+)$/);if(m)FARM.mats[m[3]]=(FARM.mats[m[3]]||0)+(+m[2])});B=null;if(FARM.left>0)setTimeout(farmGo,400);else farmEnd();return}
  modal(`<div class="big">🏆</div><h2 class="center">Victory!</h2>
  ${(first&&isAreaEnd(n))?`<div class="center" style="color:#fbbf24;font-weight:800;margin-bottom:6px">🗺️ ${ar} cleared!${isRealmEnd(n)?' Realm complete!':''}</div>`:''}${storyEpi(n,first)}<div class="center">+${gold} 🪙 · +${xp} XP each${tk?`<br>+${tk} 🎟️ ${tk>1?'draw tickets':'draw ticket'}!`:''}</div>
  ${fate.length?`<div class="card" style="margin-top:10px;font-size:13px;border-color:#fbbf24"><b>🍀 Fate’s Favor</b><br>${fate.join('<br>')}</div>`:''}
  ${mdrops.length?`<div class="card" style="margin-top:10px;font-size:13px"><b>🧰 Materials</b><br>${mdrops.join('<br>')}</div>`:''}
  ${drops.length?`<div class="card" style="margin-top:10px;font-size:13px"><b>🎒 Gear found</b><br>${drops.map(g=>`<span style="color:${RC[g.r]}">${g.ic} ${g.n}</span> <span class="small">${gtxt(g)}${g.full?' (bag full, salvaged)':''}</span>`).join('<br>')}</div>`:''}
  ${lvl.length?`<div class="card" style="margin-top:10px;font-size:13px">${lvl.join('<br>')}</div>`:''}
  ${(!wasAuto&&S.cleared>=5)?'<div class="card center" style="margin-top:10px;color:#22e3ff;font-weight:800">🤖 AUTO-BATTLE UNLOCKED!<br><span class="small">Toggle it any time in battle.</span></div>':''}
  ${tk&&S.pulls===0?'<div class="small center" style="margin-top:8px">Head to the Draw tab to get a brand new hero!</div>':''}
  <button class="btn" onclick="closeM()">Continue</button>`);
 }else{
  if(FARM){FARM.lost=true;B=null;farmEnd();return}
  modal(`<div class="big">💀</div><h2 class="center">Defeated</h2>
  <div class="center small">${B.round>40?'Time ran out.':'Your squad fell.'} Replay earlier stages for gold and XP, level up your heroes, then try again.</div>
  <button class="btn" onclick="closeM()">Back</button>`);
 }
 B=null;
}
setTab('battle');
$('#app').inert=true;
$('#openBook').onclick=()=>{
 $('#titleScreen').hidden=true;
 $('#app').inert=false;
 $('#fight')?.focus();
};
</script>
</body>
</html>
