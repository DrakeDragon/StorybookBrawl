ises", "The Hollow gathers: Katrina, Brom, Rip, Dame Van Winkle, the Tinker, the Tailor, every pumpkin and scarecrow in the county. They stand shoulder to shoulder on the road. \"We are not afraid,\" says Katrina. It's a lie. It's the best lie in the Hollow."], ["Ichabod's Stand", "Ichabod steps onto the bridge. \"I am a schoolmaster,\" he says to the darkness. \"I teach children to read. I would like to teach you.\" The darkness tilts, as if a head had turned toward him."], ["The Pumpkin Throw", "From the darkness comes a laugh, wild and hollow. Something flies through the air and strikes Ichabod square on the head. A pumpkin. It is only a pumpkin. He sits down, laughing, tears running."], ["The Headless Horseman", "The Horseman thunders onto the bridge, cloak streaming, pumpkin-headed, sword raised. \"No head,\" he hisses. \"No end. No story.\" You step in front of Ichabod. \"Then let's give you one,\" you say."], ["The Yellow Brick Road", "A cyclone sets you down in a land of impossible colour. At your feet, a road of yellow brick winds toward a green glow on the horizon. Every brick hums faintly, as if each were a sentence someone once meant."], ["Dorothy's Shoes", "Dorothy stands in the road with her basket, silver shoes catching the sun. \"I only wanted to go home,\" she says. \"It turns out home is a thing you can lose in a story and find in a page.\" She takes your hand."], ["Toto's Nose", "Toto trots ahead, sniffing every brick. He stops, growls at a patch of ink in the road, then barks twice, bright and brave. \"He's usually right,\" says Dorothy. \"About most things. Especially the things that matter.\""], ["The Munchkin Mayor", "The Munchkin Mayor waddles up in a tiny top hat, clutching a scroll. \"Welcome to Munchkinland!\" he squeaks. \"We have a parade, a pageant, and a very long song.\" You thank him. He starts the song anyway."], ["The Poppy Spore", "The poppy field glows red, and a puff of sweet spore drifts toward you. \"Sleep,\" it sighs. \"Sleep, and let it end.\" Your eyelids droop. Toto yelps, and Dorothy slaps your cheek. \"Don't,\" she says. \"It's the Blot.\""], ["The Scarecrow's Brain", "The Scarecrow hangs on his pole, scratching his straw head. \"I haven't a brain,\" he says mournfully. \"But I do think a great deal.\" He climbs down. \"I'd like to come, if I may. I'm sure I'll be useful.\""], ["The Oil Can", "In the forest, a Tin Woodman stands frozen mid-chop, rusted in place. Dorothy oils his joints. He creaks, groans, and bows. \"Thank you,\" he says. \"I haven't a heart. But I feel something. I'd like to find out what.\""], ["The Cowardly Lion", "A great lion leaps out of the brush with a roar. Toto bites his nose. The Lion bursts into tears. \"I'm a terrible coward,\" he sobs. \"I'm a lion in the shape of a mouse.\" Dorothy hugs him. \"Come along.\""], ["The Fellowship", "Four friends and a dog walk the yellow brick road, singing a song nobody has written. The sun is warm. The ink in the sky is distant. For a mile, nothing is wrong."], ["The Kalidah", "Out of the trees bounds a Kalidah, bear-bodied and tiger-headed, snarling. The Lion hesitates, and then roars back. It is the bravest sound you've ever heard. The Kalidah, startled, trips over a root and falls."], ["The Wizard's Name", "At a crossroads, a signpost says \"THE WIZARD OF OZ\" in a fussy, old-fashioned hand. \"He's very powerful,\" says the Scarecrow. \"I've heard he can grant anything.\" The Tin Woodman nods. \"I've heard he's terrifying.\""], ["The River Raft", "You build a raft out of logs and rope to cross the Munchkin river. The current tugs. The Scarecrow's pole snags on a rock and lifts him, yelling, out of the boat. \"Hang on!\" shouts Dorothy. A stork rescues him."], ["The Field Mice", "A tiny army of field mice scampers out of the grass. Their Queen sits on a Tin Woodman's knee. \"We owe you a debt,\" she squeaks. \"We'll carry the Lion.\" A thousand mice haul a sleeping lion out of the poppies."], ["The Stork's Gossip", "The stork who rescued the Scarecrow perches on a branch and gossips. \"The Wizard is a fraud,\" she whispers. \"But everyone says it, so nobody believes it. Rumours are the best disguise.\" She flaps off, delighted."], ["Hammer-Head", "A band of Hammer-Heads, round and clattering, stands in the road. They block your path with their strange, bouncing heads. \"Nobody passes,\" they say. They sound apologetic. \"It's a rule,\" one adds."], ["Glinda's Bubble", "A pink bubble floats down from the sky. Inside sits Glinda the Good, in a dress of petals. \"Dear Dorothy,\" she says, \"the way home is in your shoes. You always had it. You had to walk to know.\" She smiles."], ["The Emerald Glow", "On the horizon, the Emerald City sparkles like a chunk of sea-glass. Towers, domes, minarets, all green, all shimmering. \"It's beautiful,\" breathes the Tin Woodman. \"It's very green,\" murmurs the Scarecrow. They walk faster."], ["The Wizard's Gate", "The gate of the Emerald City is guarded by a man with a green beard and a huge ring of keys. \"Put on the spectacles,\" he says. \"Everyone does. Otherwise, the glare.\" Dorothy puts them on. The whole world is green."], ["An Audience", "The Wizard receives them one by one, each time in a different shape: a great head, a lovely lady, a ball of fire. His voice is a thunderclap. \"Bring me the broomstick of the Witch of the West,\" he rumbles. \"Then we shall see.\""], ["The Wheeler Gang", "Out of the brush roll the Wheelers, strange folk with wheels instead of hands and feet. They circle you, hooting. \"We are the Wheelers,\" they cackle. \"We are fast. We are unfriendly. We are expected.\""], ["The Winkie Country", "West of the Emerald City, the sky darkens. Yellow gives way to a bruise-purple. Winkies in uniform march in silent lines. Overhead, a black shape wheels in the clouds. \"She's watching,\" whispers the Scarecrow. \"She's always watching.\""], ["The Silver Cap", "Dorothy finds a golden cap in a rubbish heap. It's the Witch's. \"Three wishes,\" she says, turning it in her hands. \"I'm not sure I should.\" The Scarecrow grins. \"Save them. A wish is sweetest when it's still a promise.\""], ["The Witch's Spy", "A crow lands on your shoulder. It has the Witch's eyes. It whispers, in her voice, \"I know your names.\" You smile politely. You pluck it off, set it on a branch, and say, \"Then you know who we are.\""], ["The Flying Monkeys", "A shadow falls across the sun. Winged monkeys swoop out of the clouds, shrieking, wearing little vests. \"We are bound,\" shouts their leader, \"to her. We have no choice. Forgive us.\" They seize the Scarecrow."], ["The Winged Monkey", "A winged monkey lands in the road, ink dripping from his vest. \"I'm sorry,\" he says miserably. \"I serve a power I cannot refuse. I don't want to hurt you.\" His wings quiver. \"Please be quick.\""], ["The Witch's Castle", "The Witch's castle is a squat, ugly thing on a black hill, with a single window glowing green. Winkie guards, ink-eyed, line the steps. A bucket of water sits by the door, like a joke nobody has the nerve to tell."], ["The Lion Stands", "The Cowardly Lion steps forward and roars. It is a very good roar. The Winkie guards fall back, startled. \"I'm still afraid,\" he says, voice shaking. \"I just decided that being afraid was no excuse.\""], ["The Tin Heart", "The Tin Woodman kneels by Dorothy and weeps rusty tears. \"I think I found it,\" he says. \"I think the heart was never missing. I think I made it, from the part of me that wanted to find it.\" He wipes his eyes."], ["A Bucket of Water", "The Witch looms in the doorway, green and cackling, a broom in her fist. Dorothy, trembling, lifts a bucket. \"I didn't mean to,\" she says. A splash. A shriek. A puddle. \"Oh, what a world, what a world,\" says the puddle, and goes still."], ["The Wicked Witch of the West", "The Wicked Witch surges up, green and furious, ink-dark at the edges. \"You think a bucket of water ends a story?\" she shrieks. \"I am the story that never melts!\" She seizes her broom. The sky cracks. Toto barks."], ["Ozma's Court", "The Emerald Palace is filled with ribbons, laughter, and a hundred oddly polite creatures. On a throne of green glass sits a girl no older than twelve, serene and amused. \"I am Ozma,\" she says. \"Welcome home. Eventually.\""], ["Ozma Remembers", "Ozma tells you her story. \"I was stolen as a baby,\" she says, \"and turned into a boy. For years I forgot I was a girl. For years I forgot I was a queen. Remembering took time. I'm still doing it.\""], ["Tip's Surprise", "A boy with a pumpkin lantern tucks his chin shyly. \"I was Tip,\" he says. \"I'm Ozma now. Both are true.\" He shrugs. \"A person can be more than one story at the same time. I recommend it.\""], ["The Sawhorse", "Ozma's Sawhorse, a log on wooden legs, paws the ground. \"I can run like the wind,\" he says. \"I never tire. I never eat. Honestly, it's very peaceful.\" He nuzzles your elbow with a nose carved to a point."], ["The Wheeler Chief", "The Wheeler Chief rolls out to meet you, a short, round man with wheels for hands and feet. \"Halt!\" he cries. \"We Wheelers have been told to prevent you.\" He sounds embarrassed. \"I do wish they'd tell me why.\""], ["Jack Pumpkinhead", "Jack Pumpkinhead stumbles through the court, legs of wood, head of gourd. \"I'm afraid I'm going to spoil,\" he says, calmly. \"I think about it often. It makes me more attentive to the present.\" He bows, and his head wobbles."], ["The Woggle-Bug", "A professor-sized insect in tails and a monocle hurries up. \"Highly Magnified and Thoroughly Educated!\" he announces. \"T.E.!\" He bows. Ozma smothers a smile. \"He's very learned,\" she whispers. \"He only makes terrible puns.\""], ["Billina the Hen", "A small yellow hen pecks across the court, bossy and bright. \"Billina,\" she says. \"Used to be an ordinary chicken. Now I talk. It's very disorienting, but you get used to it.\" She tilts her head. \"You look tired, dear.\""], ["Dorothy's Return", "Dorothy bursts into the room, breathless. \"I came by wishing-ring,\" she says, \"just in time!\" She hugs Ozma and scoops up Toto. \"There's trouble in the Nome Kingdom. Ozma, we need you.\""], ["The Tik-Tok Guard", "A copper-plated automaton stands at the palace gate. \"I am Tik-Tok,\" he says, with a mechanical whirr. \"I think, speak and act, when wound. Please wind me.\" You turn the key. He nods. \"Thank you. You are kind.\""], ["Tik-Tok's Winding", "You wind Tik-Tok's thinking key, his speaking key, and his action key. \"I am a machine,\" he says gravely. \"I am not alive. But I do not mind. I would rather be useful than afraid.\" You think that is rather wise."], ["The Land of Ev", "The road turns west into the Land of Ev, where the sky is crimson and the grass is gold. A procession of royal prisoners marches in chains. \"The Nome King,\" whispers Dorothy. \"He took them. He hoards them like ornaments.\""], ["The Nome Tunnel", "A tunnel opens in the hill, lit by glowing mushrooms. Inside, strange, grey gnomes toil with pickaxes. \"Welcome to the Nome Kingdom,\" says a greeter, too brightly. \"You have arrived at an excellent time. It is always dark.\""], ["Eureka the Kitten", "A white kitten trots out of the shadows, haughty. \"Eureka,\" she says. \"I was accused of eating a piglet. It was not me.\" She licks a paw. \"It was probably me. But I am a cat. Consider the context.\""], ["The Gnome Sorcerer", "A Nome sorcerer in a tall hat waves a staff, and the tunnel walls ripple. \"Welcome,\" he says, \"to the kingdom of transformations.\" Tik-Tok clanks forward. The sorcerer pauses. \"I do hope you're not ticklish.\""], ["The Nome King's Parlour", "The Nome King's parlour is a vast cavern of glittering ornaments. Each ornament is a person: a knight, a princess, a prince, a peddler. Dorothy gasps. \"Those aren't ornaments,\" she whispers. \"They're the prisoners.\""], ["Ruggedo Rants", "The Nome King, Ruggedo, sprawls on a throne of ruby. \"Guess my ornaments!\" he cackles. \"Guess which one is your friend, and I'll free him. Guess wrong, and you become one!\" His laughter shakes the cave."], ["Guessing Game", "You step among the ornaments, peering. A silver teapot. A gold candlestick. A crystal flute. One glints with a flicker of life. Dorothy squeezes your hand. \"That one,\" she says. \"It's the one that's looking at me.\""], ["The Egg That Hatched", "The ornament you touch becomes a boy, blinking and astonished. Ruggedo's face goes white. \"How did you know?\" he hisses. You smile. \"It was the only one that looked back.\""], ["The Nome Tunneler", "A tunneling Nome emerges from a hole in the floor, ink in his beard, a pickaxe in his hand. \"I dig,\" he says, miserable. \"I dig and I dig. I do not remember what I'm digging for.\" He sits. His shoulders shake."], ["Ozma's Magic Belt", "Ozma lifts the Magic Belt of the Nomes, and the whole cave brightens. \"Every story,\" she says, \"has a way to be freed. You only need to remember it exists.\" She wishes. A hundred ornaments become people."], ["The Rescued Prisoners", "The rescued prisoners stumble out of the cavern, blinking at lantern light. A princess weeps. A knight bows. A peddler counts his pennies. They are alive, and the Nome Kingdom shakes with their cheering."], ["Ruggedo's Rage", "Ruggedo's pointed ears flatten. \"You cannot take them!\" he howls. \"I have the right! I am the king of the underworld!\" He stamps a boot, and the mountain trembles. Rock tumbles. Dust roars. Tik-Tok whirs: \"Run.\""], ["The Collapse", "The tunnel groans and begins to fall. You race through the dark, the rescued prisoners behind you, Dorothy clutching Toto, Tik-Tok clanking. Light blazes ahead. A crack of stone and you are out, gasping, in the sun."], ["The Nome Soldier", "A Nome soldier blocks the tunnel's mouth, spear in hand, ink on his boots. \"I've orders,\" he mumbles. \"I don't remember who gave them.\" He looks at your face. \"Do you know who gave them?\" His spear lowers."], ["The King of Dreams", "Ozma gazes up at the sky. \"The Nome King,\" she says, \"is only a dream the Blot is having. If we wake it, it ends. If we feed it, it grows.\" She looks at you. \"Which would you rather?\" You pick the first."], ["The Wizard's Return", "A balloon descends from the clouds, patched and sagging. The Wizard of Oz climbs out, small and rumpled and sheepish. \"I'm a humbug,\" he says. \"A very good one. I'd like to help, if you can bear it.\""], ["The Wizard's Confession", "The Wizard sits on the ground, polishing his spectacles. \"I am no wizard,\" he says. \"I am a man who tells stories to people who need them. It's a very old job. It's a sacred one, though I treated it as a trick.\" He puts his spectacles back on."], ["Ozma's Decree", "Ozma stands before the assembled court and declares: \"No one in Oz shall be forgotten. No tale in Oz shall go unfinished.\" Her voice is small and bright. The whole palace listens. Even the Blot, somewhere, holds its breath."], ["The Nome King", "The Nome King rises, vast and furious, jewels dripping from his beard, ink flooding his throne. \"I am the king of everything that has been buried!\" he roars. \"And you, little queen, are digging up my kingdom.\" Ozma smiles. \"Yes.\""], ["The Frontier", "Wind, dust and a sky large enough to be frightening. Wagon ruts cross the plain like old scars. A train whistle howls in the distance. The American frontier is a place where a person can become a story by sunset."], ["Pecos Bill's Lasso", "Pecos Bill rides in on a mountain lion, whirling a rattlesnake lasso. \"Howdy!\" he booms. \"I once dug the Rio Grande to cure a drought. I'm told the Blot is bigger. Let's go see.\""], ["Slue-Foot Sue", "Slue-Foot Sue rides a catfish the size of a canoe up the riverbank, wearing a bustle. \"I bounced on my own bustle clean to the moon,\" she says, \"and I'd do it again.\" She grins. \"Don't wait up.\""], ["The Rattlesnake Gang", "A dozen outlaws sit on a ridge, ink dripping from their hats. \"Reach for the sky,\" drawls the leader. You reach. A thousand rattles shake. Pecos Bill's lasso flicks. The gang is hogtied before the dust settles."], ["The Rattlesnake Boss", "A snake coils, huge, on a rock, hat tilted. \"Sssorry, pardner,\" it hisses. \"I've been told to bite. I'm not good at it.\" It yawns. Bill pats it on the head. \"Go lie in the sun, old timer.\""], ["Johnny Appleseed", "A barefoot man wanders the prairie in a tin pot hat, planting seeds from a sack. \"Apples,\" says Johnny Appleseed. \"Somebody planted for me once. I'm just passing it on.\" He drops a seed. The ground quivers."], ["Calamity Jane", "Calamity Jane gallops up with a whoop, pistols twirling. \"Where's the trouble?\" she shouts. \"I'm told there's some.\" She sees the ink and whistles. \"Well, I'll be. That's more trouble than I expected.\""], ["Annie Oakley", "Annie Oakley stands on a stump, rifle at her shoulder. She fires six shots, each splitting the last. \"Never aim at the target,\" she says. \"Aim at where it's going to be.\" She tips her hat."], ["The Prairie Wind", "The wind picks up. Dust devils twist across the plain. A tornado forms on the horizon, black and tall. Calamity Jane squints. \"That ain't weather,\" she says. \"That's the Blot, wearing a coat.\""], ["The Prairie Twister", "A twister roars out of the dust, throwing wagon-wheels and cattle into the sky. Pecos Bill rides straight at it. \"I've ridden worse!\" he yells. He lassoes the funnel. It shrieks, shrinks, and settles into a dust-devil."], ["John Henry's Hammer", "John Henry, broad as a barn, swings a steel hammer on the railroad cut. \"A man ain't nothing but his work,\" he says. \"I'd rather be remembered for working than rest forgotten.\" He beats the drill into the stone."], ["The Steam Drill", "A steam drill chugs beside John Henry, belching. \"I'm faster,\" it wheezes. \"I never tire.\" John Henry grins. \"Race you.\" The earth shakes. Hammers fall. A mountain's heart splits. John Henry wins. It costs him everything."], ["Paul Bunyan's Axe", "Paul Bunyan strides across the horizon, axe on his shoulder, Babe the Blue Ox trotting behind. \"Mornin',\" he says, voice like an avalanche. \"Shall we clear some forest?\" He chops. The sky sheds splinters."], ["Babe the Blue Ox", "Babe, the great blue ox, nuzzles your hand. Her nostrils steam. \"Moo,\" she says, with enormous dignity. You pat her. She leans into it. Paul Bunyan wipes his eyes. \"She likes you,\" he says. \"That's rare.\""], ["The Steam Hammer Foreman", "The foreman of the steam hammers clangs forward, stern and soot-grimed. \"John Henry's dead,\" he says. \"Is that what you're here to hear? I've been told to build the railroad. I don't know why. It never ends.\""], ["Davy Crockett's Coonskin", "Davy Crockett leans on his rifle, coonskin cap tilted. \"Be sure you're right,\" he says, \"then go ahead.\" He winks. \"I only ever did the second part. It tends to work out.\""], ["Mike Fink's Keelboat", "Mike Fink poles a keelboat down the Mississippi, bellowing a song. \"I'm half horse, half alligator!\" he shouts. \"A little touch of snapping turtle! I can outrun, outjump, outshoot!\" A catfish applauds."], ["Huck and Jim", "Huck and Jim drift past on a raft, fishing poles dangling. \"Hey there,\" says Huck. Jim waves. \"It's a good river,\" he says. \"I do wish it didn't take so long to learn what it's saying.\" They float away, content."], ["The Mississippi Gambler", "A riverboat gambler in a brocade vest sits at a table on the deck, shuffling a deck of cards. \"Five card stud,\" he says softly. \"You're a Reader. I'm a man of luck. Shall we see who finishes first?\""], ["The Mississippi Duke", "On a paddle-steamer, a self-styled Duke and a self-styled King sit in lawn chairs. \"We are royalty,\" says the Duke grandly. \"We have been deposed by a plot twist.\" The King sniffs. \"It happens.\""], ["The Duke's Sham", "The Duke performs a few lines of Shakespeare for a small crowd. He mangles every one. The crowd boos. The Duke bows. \"Art is a bruising business,\" he sighs. You find you like him a great deal."], ["The Railroad Reaches the Sea", "At the far end of the continent, two lines of track meet. A golden spike is driven. A cheer goes up. For a long moment, the whole country is the same story. Then the ink wells up between the rails."], ["Wild Bill's Hand", "Wild Bill Hickok sits with his back to the wall, playing cards. \"Aces and eights,\" he mutters, and does not look up. \"Dead man's hand. I know how it ends.\" He shuffles anyway. He deals you in."], ["The Tall Tale Contest", "Under a lantern in a cattle town, tall-tale tellers compete. Each story is bigger than the last. A cowboy claims he roped lightning. A cook claims his beans cooled the sun. You listen, enchanted. The ink in the air curdles."], ["The Tumbleweed Bandit", "A tumbleweed bandit rolls into the saloon in a long coat. \"Stick 'em up,\" he says weakly. \"I was told to rob you.\" He sneezes. \"I'm sorry. I'm allergic.\" Bill hands him a handkerchief. He weeps."], ["Cave of the Bandits", "A cave yawns under a mesa. Torchlight flickers inside. A crowd of masked outlaws circles a heap of sacks, each stamped with the word \"FINISHED.\" Annie Oakley sights down her rifle. \"They've been robbing endings,\" she says."], ["Bill's Rope", "Pecos Bill coils his rope and takes a long breath. \"Back in Texas,\" he says, \"I once roped a cyclone. I could rope this cave.\" He looks at you. \"It's a matter of attitude.\" He throws."], ["Jane's Stand", "Calamity Jane vaults a table and takes a stance in the cave mouth, pistols drawn. \"Come on out, boys,\" she calls. \"I'll say it the nice way once. Hand over the endings.\" A silence. A single click."], ["Sue's Bustle", "Slue-Foot Sue jumps on the cave roof and the whole mesa bounces. Rocks fall. Lanterns shatter. Bandits scatter. \"That's my bustle!\" she crows. \"Thirty miles and a lot of dust. I regret nothing.\""], ["The Cave Bandit", "The Cave Bandit stands in the darkness, hat low, eyes black with ink. \"I rob the endings,\" he says softly. \"I sell them to the Blot.\" He draws two pistols. \"Everyone buys. Nobody asks what it costs.\" Annie Oakley fires."], ["The North Pole", "Snow glitters, lanterns glow, and a village of crooked cottages hums with the sound of a thousand tiny hammers. Candy-cane posts line the road. It is the loveliest place you've ever seen. It is also, quite clearly, in trouble."], ["Santa's Worry", "Santa Claus sits by the fire, a long list unrolled across his knees. \"The Naughty list,\" he says, \"is growing. Not with naughty children. With ink. Names are being replaced by blots.\" He rubs his face. \"I can't read them.\""], ["Mrs. Claus's Cocoa", "Mrs. Claus presses a mug into your hands. It is thick, warm and sweet. \"Drink,\" she says. \"A person cannot save a story on an empty stomach.\" You drink. For the first time in days, your hands stop shaking."], ["The Elves' Workshop", "Hundreds of elves crowd the workshop, hammering, sewing, painting. The air is thick with sawdust and song. \"We make toys,\" says the chief elf proudly. \"Joy takes craft. People forget that.\" He hands you a wooden horse."], ["The Naughty List Imp", "A small imp leaps off the list, ink dripping from his wings. \"I am the Naughty List,\" he squeals. \"Everybody ends up on me.\" He laughs. It turns to a sob. \"I'd love to be on the Nice list. Just once.\""], ["Rudolph's Nose", "Rudolph steps out of the stable, nose glowing like a lantern. \"I was mocked once,\" he says. \"A fog came. They asked me to lead.\" He nuzzles your hand. \"Funny how a flaw can turn out to be the whole point.\""], ["Frosty's Hat", "Frosty the Snowman stands in the village square, corncob pipe in his mouth, button eyes wide. \"Happy birthday!\" he cries. \"I'm told it's a sad time of year for some. Let me juggle.\" He does. He juggles snowballs. Everyone grins."], ["The Gift Wrapper", "A very old elf wraps gifts in a corner, humming. \"I wrap,\" she says, \"because a gift deserves a little mystery. The best present is the one you don't know yet.\" She tapes a bow. She tucks a tag. It says, simply, \"Hope.\""], ["A Christmas Carol", "The sound of carolers drifts over the snow, sweet and old. You join the chorus, your breath fogging. The song has a hundred verses. Each one is about being kind. By the end, the snow has stopped falling, the better to listen."], ["The Toy Breaker", "In the workshop's back room, a hulking, ink-eyed toy soldier smashes a row of dolls with his rifle. \"Merry Christmas,\" he sneers. A little elf screams. A reindeer charges. The soldier topples. His hands tremble. \"I didn't mean to,\" he says."], ["The Nutcracker", "A Nutcracker in a red-and-gold uniform marches out of the toy chest, blinking. \"I was a prince once,\" he says. \"A curse. A kiss. A battle with a mouse king.\" He shrugs, wooden shoulders clacking. \"It's been a year.\""], ["Clara's Dream", "Clara, a girl in a white nightgown, creeps into the workshop and gasps. \"It's all real,\" she whispers. \"The Nutcracker, the toys, the snow.\" The Nutcracker bows. \"It's real as you let it be,\" he says. She curtsies."], ["The Mouse King", "A seven-headed Mouse King scuttles out of the shadows, squeaking furiously. The Nutcracker squares his shoulders. Clara flings her slipper. The Mouse King yelps, topples, and dissolves into a pile of ordinary cheese. \"That's a relief,\" says the Nutcracker."], ["The Winter Wolf", "A white wolf prowls through the village, ice in its fur. It does not growl. It looks at the lanterns, and at the carolers, and at you. \"I'm lost,\" it says. \"I used to be a story told to children. They stopped telling it.\""], ["The Snow Wraith", "A pale shape rises out of the snowbank, thin as breath. \"I am the cold,\" it whispers. \"I am the silence between snowflakes.\" It floats toward you. You hold up a lantern. The wraith flinches and shrinks."], ["The Little Match Girl", "A tiny girl stands in the snow, clutching a bundle of matches. \"Please,\" she says, \"one more.\" She strikes a match. A feast appears. Another match. A fire. Another. A grandmother. \"Take me with you,\" she whispers, and you do."], ["The Gingerbread Man", "A gingerbread man races past, giggling. \"Run, run, as fast as you can!\" he shouts. A fox gallops after. You catch the fox's tail. \"Please,\" he says, \"I only wanted a snack.\" You give him a gingerbread cookie. He is bewildered."], ["The Snow Queen's Mirror", "A splinter of ice glints in the snow. You reach for it, and a voice whispers, \"Look in me.\" You see yourself, small and cold and tired. You see the world, ugly and unloved. You throw the splinter far into the dark."], ["Kay and Gerda", "A boy and a girl stumble into the village, hands joined. \"I came to rescue him,\" says Gerda, shivering. \"I walked a thousand miles. I wept the splinter out of his eye.\" Kay holds her tight. \"I'm sorry,\" he whispers. \"I forgot.\""], ["The Icicle Guard", "A guard of living icicles blocks the gate, spears raised, mouths silent. They are very beautiful. They are very cold. \"We are told to hold the winter,\" says their captain. \"We have held it a long time.\" He is tired."], ["The Sleigh Bell", "A single sleigh bell rings, clear and bright, and the ice on the guards' spears cracks. They look at each other, astonished. One lowers his spear. Another smiles. The captain whispers, \"It's thawing.\" He sounds frightened. He sounds happy."], ["Santa's Confession", "Santa sits on a barrel, fur-trimmed and weary. \"I used to believe it was magic,\" he says. \"Then I believed it was work. Now I believe it is both. The Blot wants me to choose. I will not.\""], ["The Final Delivery", "Santa harnesses the reindeer and loads the sleigh. \"Tonight,\" he says, \"we deliver endings.\" A rumble of bells. A bellow of joy. The sleigh lifts into the dark sky, trailing light across the whole world."], ["Midnight Mass", "In a snowy chapel, villagers kneel at midnight. A single voice sings \"Silent Night.\" The ink in the air hesitates, like a hand that has forgotten what it came to do. For three minutes, all is calm. All is bright."], ["The Frost Goblin", "A goblin made of frost scuttles across the roof, pelting the chimneys with icicles. \"Cold!\" he giggles. \"Cold! Cold!\" He slips, tumbles, and lands in a snowdrift. His laughter turns to sobs. \"I only wanted a friend.\""], ["The Aurora", "Above the pole, the aurora unfurls, green and violet, and the whole sky looks like a page being turned. Santa watches from the sleigh. \"That's the tale of the year,\" he says quietly. \"It's about to end, and begin.\""], ["Jack Frost Comes", "The temperature plunges. Frost crawls over the cottage windows in feathery fronds. A thin figure strides through the village, hair white, eyes blue as glacier ice. Every lantern flickers. \"Winter,\" he says, \"is the only honest season.\""], ["Frost on the Lanterns", "Jack Frost walks the street, touching each lantern. Each goes out. Each house falls silent. A child's cry rises and stops. Mrs. Claus wraps her shawl tight. \"He isn't evil,\" she says. \"He's only forgotten how to be gentle.\""], ["Mrs. Claus Speaks", "Mrs. Claus steps in front of Jack Frost and takes his icy hand in her mittened ones. \"You are cold, dear,\" she says. \"Come in.\" Frost blinks. No one has said that to him in a very long time. His eyes soften. The ink rages."], ["Jack Frost", "Jack Frost wrenches free, hair streaming, eyes black. \"I am the end of the year,\" he hisses. \"I am the last page. No one else may write it.\" The snow rises like a wall. Santa's sleigh bells ring. You step forward."], ["The Last Page", "You stand on a plain of blank paper that runs to every horizon. There is no wind, no sound, no colour. At the centre, a lamp glows over a desk. The Narrator sits there, quill in hand, and for the first time he turns to look at you."], ["The Narrator's Face", "He is older than you imagined, and kinder, and so tired. \"I told you the story,\" he says, \"so you would not be afraid. I am sorry. I have been afraid for a very long time.\" Ink stains his fingers to the wrist."], ["Every Hero Returns", "One by one they step out of the white. Little John with his quarterstaff. Alice with her teacup. Dorothy with Toto. Ichabod with his lantern. Hundreds of faces, all you have met, standing shoulder to shoulder on the blank page."], ["The Narrator Explains", "\"I was a storyteller,\" he says, \"to a sick child. Every night I told her tales. She grew well, and grew up, and stopped asking. I could not bear it. I decided no story should ever be outgrown.\""], ["The Plot Hole", "A black pit yawns in the paper, edges fraying. Out of it climbs a lanky, apologetic figure. \"I am the Plot Hole,\" it says. \"Nothing I say makes sense. Please do not ask how I got here.\" It tries to explain, then gives up."], ["Mother Goose's Voice", "From somewhere above comes a gentle, cracked voice. \"Hush, my darlings,\" says Mother Goose. \"The page is not yet turned.\" The blank paper under your feet warms. A rhyme begins to hum in the margins."], ["The Boy and the Notebook", "A boy in a patched coat holds out a little notebook. \"The Boy Who Was Never Bored,\" he reads aloud. \"That's me. I wrote it when I was seven.\" He grins. \"I forgot I was the author. It's nice to be reminded.\""], ["The Child Who Grew Up", "A woman in a plain grey dress stands at the edge of the page, hair streaked with silver. \"I remember your stories,\" she tells the Narrator gently. \"I grew up on them. They didn't end when I stopped listening.\" His quill trembles."], ["The Narrator Weeps", "The Narrator lowers his head into his hands. \"I thought I was keeping her,\" he whispers. \"I thought if the tale never ended, she never left.\" The woman kneels in front of him. \"I did leave,\" she says. \"And you kept going. That was all I wanted.\""], ["The Cliche Knight", "A knight in gleaming armour strides up, plumed and perfect and utterly forgettable. \"I am the Cliche Knight,\" he announces. \"I am the hero in every story. I have no name. I have no face.\" He raises a sword. It is very bright. It is very dull."], ["Little John's Staff", "Little John knocks the Cliche Knight's sword aside with his quarterstaff. \"A hero,\" he says, \"is a person who stayed. Not a sword. Not a plume.\" The knight stumbles and sits down, helmet askew. \"Oh,\" he says. \"That's what I was missing.\""], ["Alice and the Teacup", "Alice pours a cup of tea for the Cliche Knight. \"A name,\" she says, \"is just what you answer to when somebody calls you kindly.\" She tilts the cup. He sips. His helm slips, and a tired young face blinks out."], ["Dorothy's Shoes Again", "Dorothy clicks her heels. \"There's no place like home,\" she says, and the blank paper blossoms with a patch of Kansas wheat. \"Home is a place you build on a page,\" she says. \"Out of the people who stay with you.\""], ["Ichabod Teaches", "Ichabod claps a ruler on a lectern that appears from nowhere. \"Class,\" he says, \"we shall now read a sentence aloud. 'Once upon a time.' Repeat.\" A hundred heroes repeat it. The page glows. It is the first sentence anyone has said in a long time."], ["The Spoiler Specter", "A pale figure drifts across the page, grinning, whispering. \"The butler did it,\" it giggles. \"The princess dies. The dragon wins. Everyone's a dream.\" You cover your ears. Alice sticks out her tongue. The Specter snickers, then fades, bored."], ["Holmes Deduces", "Sherlock Holmes steps out of the crowd, pipe in hand. \"The Narrator is the missing piece,\" he says briskly. \"I deduced it in Baker Street. I confess I did not say so then. It seemed kinder.\" Watson coughs. \"You might have said,\" he murmurs."], ["Watson's Chronicle", "Watson opens a battered notebook. \"I record,\" he says, \"because someone must. The detective solves. The doctor writes it down. We are both necessary.\" He offers the Narrator a pencil. \"You are not alone in this job.\""], ["A Conversation With Mina", "Mina Harker sits by the Narrator, journal in her lap. \"I write down what I fear to forget,\" she says. \"You are the same. But you forgot the second half. I write it down so I can let it go.\" He looks at her for a long time."], ["The Hundred Heroes", "All hundred voices begin to read at once. Nursery rhymes. Ballads. Legends. Letters. They overlap like a tide. The blank paper blushes with ink, and the ink is no longer black. It is every colour a story has ever been."], ["The Red Pen Wraith", "A sharp, thin shape coils out of the lamplight, brandishing a red pen. \"Cut!\" it hisses. \"Cut! Cut!\" It slashes through a lullaby. A hero screams. \"Edits,\" says the Wraith, with relish. \"Always for your own good.\""], ["Alice Defends", "Alice snatches the red pen. \"You don't get to cut a thing just because you find it hard to read,\" she says. \"That's not editing. That's fear.\" She uncaps it, crosses out the Wraith's last line, and writes a better one. It disappears, blushing."], ["The Author of Endings", "The Narrator stands. His cloak slips to the ground. Beneath it he wears the black garb of the Author of Endings, the same tall figure who has haunted every realm. \"I am both,\" he says. \"I have been both from the beginning.\""], ["Two Halves", "The Narrator stands beside his own shadow. They look alike. They look like old friends. \"He is the part of me that could not bear an ending,\" says the Narrator. \"I am the part that could not bear to be alone.\" They look at each other, appalled."], ["The Last Hesitation", "The Author draws his pen. \"If I let the story close,\" he says, \"it ends. She is gone. She is truly gone.\" He hesitates. \"I don't know how to write that sentence.\" You pick up a second pen from the desk and hold it out. \"We do.\""], ["The Typo Imp", "A tiny imp skitters along the edge of the page, tipping over words. \"Teh!\" it cackles. \"Wiht! Hte!\" Everyone groans. \"It's the last glitch,\" whispers Watson. \"Tidy it, and the ending is clean.\" You flick it with a pen. It squeaks and vanishes."], ["The Walk to the Desk", "You walk across the blank page, hundreds of heroes at your back. The desk grows. The lamp swells. The Narrator and his shadow stand on either side, quills trembling. The white sheet before them is the loneliest thing you've ever seen."], ["What the Reader Brings", "You lay your own pen on the desk. \"I came to read,\" you say. \"I stayed to finish.\" You look at the blank page. \"I do not want the story to stop. I want it to mean something.\" The Narrator closes his eyes. The Author closes his."], ["The Last Question", "The Author's voice cracks. \"Is it all right,\" he asks, \"to end?\" Every hero answers at once. \"Yes.\" The blank page quivers like a held breath. \"Is it all right,\" he whispers, \"to begin again?\" Again, every hero. \"Yes.\""], ["The Blot Gathers", "All the ink in the world gathers on the page, every blot, every stain, every blackened line, flowing back into a single tide at the Author's feet. It rears, vast and terrible, a wave of unwritten endings. It is not evil. It is grief."], ["The Author of Endings", "The Author of Endings rises from the ink, tall and shining and broken. \"No more,\" he says, in a voice like the last page of a very long book. \"I cannot write it. I cannot bear to read it.\" He lifts his pen. You lift yours. The page holds its breath."]];
const PAGES=[["The torn page floats down, bright and clean, and slides home into the Book. Its last line is still smudged: \"The E...\" The Narrator clears his throat. \"Well done. Truly.\"", "A black trail leads from Sherwood into the dark, and Mother Goose's note flutters out one more time: \"Camelot is next. Please hurry. Please.\" Even the forest whispers goodbye."], ["The second page lifts from the field, golden at the edges, and settles into the Book. Merlin whispers in a voice not quite his own: \"Someone tells this tale beautifully. I almost wish I had written it.\"", "A white rabbit scampers past, checking a pocket watch that says \"far too late.\" Merlin raises a bushy eyebrow. \"Tea time,\" he says. \"Better hold on to your hat.\""], ["The third page drifts down, striped with teacups and trimmed with roses. The Hatter claps. The Cheshire Cat grins. Somewhere, the Narrator whispers, \"How lovely. How very, very lovely.\"", "Alice leads you to a tall mirror in the hallway. Beyond it, a chessboard stretches to the horizon. \"It's only the next chapter,\" she says. \"Mind the reflection.\""], ["The fourth page is mirror-bright and printed backward. When it settles into the Book, the writing turns. \"Well done,\" says the Narrator. His voice catches. \"I always rather liked this one.\"", "Beyond the glass, a window opens onto a night sky full of impossible stars. A boy's laughter rings far away. \"Straight on till morning,\" whispers Alice. \"Go on, go.\""], ["The fifth page spirals down in a shimmer of pixie dust. \"Do you know,\" murmurs the Narrator, almost to himself, \"I always envied Peter. He never had to write his own ending.\"", "A path leads out of Neverland into a sunny wood full of buzzing. In the distance, a round yellow bear is humming. \"Oh bother,\" he says. \"Is it already time for the next chapter?\""], ["The sixth page floats down, soft with sunlight, and the corner is smudged with honey. The Narrator laughs, then stops. \"A child once asked me to write a bear,\" he says, to nobody. \"I wrote the wrong ending.\"", "Beyond the pines, a river glints, and a toad's honking horn drifts over the water. \"Poop-poop!\" cries a voice. \"Oh dear,\" murmurs Pooh. \"I think that is the next chapter.\""], ["The seventh page unfurls, blue as the river, and settles into the Book with a contented little splash. \"Home,\" murmurs the Narrator, so softly you almost miss it. \"I should have told them about home.\"", "On the far bank of the river, a garden gate stands open, and a small rabbit in a blue jacket is racing toward a row of lettuces. \"Peter!\" calls a voice. \"Not again!\""], ["The eighth page settles into the Book smelling of mint and rain. \"Oh,\" says the Narrator quietly. \"It was in the garden all along.\" He clears his throat. \"Never mind. Never mind. Onward.\"", "High above the garden wall, a green stalk is climbing into the clouds. A voice thunders far overhead: \"Fee, fi, fo, fum!\" Peter sighs. \"Not another one with an appetite.\""], ["The ninth page floats down on the back of a golden feather. The Narrator chuckles. \"Gold is easy,\" he says. \"A song, though. A song is the hard thing.\" He sounds, for a moment, much younger.", "At the foot of the stalk, a little brick house waits beside a cottage with a thatched roof. A wolf is already huffing. \"Little pig, little pig,\" he drawls, \"let me come in.\""], ["The tenth page drifts down, crusted with salt and smelling of porridge. \"A name is a kind of ending,\" the Narrator murmurs. \"Everything that has a name has a beginning. I have been very careful not to be named.\"", "Down a cobbled lane, a girl in a red hood skips by a bakery. A voice sings from the open door: \"Sing a song of sixpence, a pocket full of rye.\" The nursery rhymes have begun, and something is off-key."], ["The eleventh page rolls down the lane like a spool of ribbon. \"She is up there, you know,\" says the Narrator, suddenly quiet. \"In the Last Page. I did not mean for her to be frightened. I never mean anything.\"", "Beyond the lane, fog rolls over cobbles, and a lamplighter hums a carol. Somewhere, a boy asks for more. The smell of coal smoke, the clang of church bells. London, in winter, in ink."], ["The twelfth page curls out of the fog like a Christmas carol, smelling of pine and ink. \"He changed,\" says the Narrator. \"Scrooge. In one night. I did not believe it at first. I have been thinking about it ever since.\"", "Beyond the river, fog thickens around a single lit window at 221B. A violin is playing. A voice, dry and delighted: \"The game,\" says the voice, \"is afoot.\""], ["The thirteenth page hangs in the fog above the Falls, bound in black, in a hand remarkably like Holmes's. \"A very clever man,\" says the Narrator, with a laugh that is almost a sob. \"He was right about the margins.\"", "A ship's bell sounds across the fog, and a map flutters down from the rigging, marked with a bright red X. A rough voice sings, far away: \"Fifteen men on the dead man's chest, yo ho ho and a bottle of rum.\""], ["The fourteenth page rises on a salt breeze, written in a child's pencil, blotted by sea air. \"Please don't ever stop,\" murmurs the Narrator. \"It was the nicest thing anyone ever wrote in my book. I read it every night.\"", "The sea fades, and the stars come out, strange and bright. Somewhere in the dark, a voice murmurs lines that are not quite Shakespeare. \"If we shadows have offended,\" it says, \"think but this, and all is mended.\""], ["The fifteenth page floats down like a petal, scented with wild thyme. \"Dreams,\" says the Narrator, very quietly. \"I thought if I put it all in a dream, it wouldn't hurt.\" He pauses. \"It does, you know. It hurts exactly the same.\"", "The wood thins, and a cold wind carries the skirl of bagpipes across a heather moor. Somewhere in the mist, three women are stirring a cauldron. \"When shall we three meet again?\" they croon."], ["The sixteenth page drifts down, tartan-edged and warm with peat smoke. \"Tomorrow,\" says the Narrator, and for a moment his voice does not hold. \"Do you know, I stopped believing in it a very long time ago. I should like to start again.\"", "A soft rain begins, and with it, a harp. The path leads to a green hill with a door in the side. \"Welcome,\" says a voice from the darkness. \"To the Marches. Mind the dead. They're very polite.\""], ["The seventeenth page slides down in a white mist, glowing like a lantern. \"They remembered,\" says the Narrator, very softly. \"The dead. I used to think nobody did.\" There is a long pause. \"I should like to write a very long eulogy.\"", "From the north comes the clang of metal on metal, and the low, pleased rumble of a hall full of feasting men. Smoke curls against a bleak sky. Somewhere, a mountain breathes. \"Hrothgar's hall,\" says a voice. \"And what lives under it.\""], ["The eighteenth page rises on a gust of dragon-warm air, gilded at the edges and written in the old tongue. \"A hero dies,\" says the Narrator slowly. \"Yes. But the song doesn't. I knew that once. I wonder when I forgot.\"", "The mountain settles. Far to the south, a gloomy fog rolls over black cliffs, and a church bell tolls out to sea. The smell of salt, wolf, and candle-wax. A ship is aground at Whitby, and its deck is empty."], ["The nineteenth page floats down in a cold gust, edged in black lace, scented with candle-wax. \"Immortality,\" murmurs the Narrator. \"And the Blot. They are the same temptation, you know. One says never end, and one says end now. Both are afraid.\"", "A cold wind sweeps the hills of Sleepy Hollow, bringing the scent of woodsmoke and rotting pumpkins. A bridge creaks. Somewhere in the dark a horse snorts, and a thin voice in a frock coat says, \"Oh dear. Oh dear.\""], ["The twentieth page floats down on a gust of cold woodsmoke, orange-edged, speckled with candle wax. \"I slept through the best part once,\" says the Narrator, very low. \"The ending. The very last page. Do you know, nobody told me it had been written?\"", "The wind shifts, and a whirling funnel of dust rises on the horizon. A little dog barks, wild and brave. A girl's voice: \"Toto! Toto, come back!\" And the whole sky goes yellow as a field of buttercups."], ["The twenty-first page whirls down on a gust of green dust, ruby-edged and smelling of poppies. \"The Wizard,\" says the Narrator, with an odd little laugh, \"is only a man behind a curtain. Pulling levers, making noise. I used to rather admire him for it.\"", "The Emerald City glitters on the horizon, but the road beyond it bends into a land of mist and wooden gears, where tin soldiers march and the earth rumbles. A girl with a ribbon in her hair calls your name. \"Ozma,\" she says. \"I'm trying to remember how I got here.\""], ["The twenty-second page flutters down on a green ribbon, still warm from the sun. \"Ozma,\" says the Narrator, softly, \"was a girl who forgot who she was and remembered. I've been thinking about that. About what it takes to remember a thing you were made to forget.\"", "The road ends at a hot, dry plain, and beyond it lies a land of dust, trains and cattle: the American frontier. A harmonica plays somewhere. A cowboy tips his hat and says, \"Evenin'. Y'all lookin' for a story? We got plenty.\""], ["The twenty-third page tumbles in on the prairie wind, dog-eared and smelling of sagebrush. \"The tall tales,\" says the Narrator, \"were never lies. They were stories so big a person couldn't help growing to fit them. Mine was too small. I made a small man.\"", "Snow begins to fall across the plain, soft at first, then in sheets. Sleigh bells ring in the distance, and the air smells of pine, ginger and woodsmoke. A figure in red steps from the white and says, quite softly, \"Ho. Ho. Hold on. Something is wrong with the list.\""], ["The twenty-fourth page falls like a snowflake, silver-edged and perfectly quiet. \"It's the last one but one,\" says the Narrator, and his voice is thin. \"I wonder if you'd do something for me. When we reach the end, whatever you hear me say, please don't look away.\"", "The snow clears. Ahead lies a vast white plain with no horizon, covered edge to edge in blank paper. A single desk sits at its centre, with a lamp, an inkwell and a chair. A figure in a cloak sits there, writing. He does not look up. \"You're late,\" he says. \"I've written the ending without you.\""], ["The Author of Endings sets down his pen. The Narrator sets down his. Together they write one line, small and plain, on the last page of the Book. It does not say \"The End.\" It says, \"...and then.\" A thousand heroes exhale. The Book of Mother Goose opens, new and sunlit, and every tale in it begins to breathe. \"To be continued,\" the Narrator whispers, and for the first time in his long life, he smiles.", "The Book will not close. Its pages riffle in a warm wind, and the stories you have saved begin to turn again, a little different, a little darker, a little braver. \"Read us once more,\" they call. \"We have grown. We have secrets. We have seconds.\" The first line of the first page glows: Once upon a time, again."]];
const PROF={"littlejohn": ["The Gentle Giant", "Stand behind me. I only hit people when they ask for it twice.", "John Little was the tallest man in Nottingham and the quietest. He lost a staff fight on a log bridge to a stranger named Robin, laughed until he fell in the stream, and never left the forest again."], "much": ["The Faithful Messenger", "If it matters, I've already run it there.", "Much grew up grinding flour in his father's mill and learned every road by the sound of the cart wheels. When Robin needed news from Nottingham, it was always Much who came back first and breathless."], "willscarlet": ["The Scarlet Blade", "I'm not hot-tempered. I'm just correct quickly.", "Will dressed in red so the Sheriff's men would know exactly who was cutting through them. His anger is famous and his loyalty is more so. He has never once been late to a fight."], "sherwoodarcher": ["The Nameless Bow", "Forty of us. One arrow each. Guess which one is mine.", "Nobody remembers his name, and that is the point. He is one of the forty archers who lined the green and made the Sheriff's army think the trees themselves had learned to shoot."], "alan": ["The Minstrel of the Green", "I can end a war in four verses, or start one in two.", "Alan was a wandering singer who stole a wedding from a bishop with nothing but a ballad and good timing. Since then every song he writes is a quiet weapon. The outlaws sing him to sleep."], "tuck": ["The Fighting Friar", "Pray first, then duck. Mostly duck.", "Tuck was a monk with a taste for venison and a belief that God prefers cheerful soldiers. He fought Robin at a river crossing, lost the argument, won the dunking, and has stayed for the feasting."], "marian": ["The Lady of the Wood", "I did not run away to the forest. I walked here with a sword.", "Marian was raised in a castle with nothing to do but be admired. She chose the greenwood, a bow and a cause, and now outshoots most of the men who once told her to sit still."], "richardlee": ["The Knight of the Lee", "My gate is shut. My debts are paid. Try again tomorrow.", "Sir Richard was a quiet knight with a mortgaged manor and a good heart. Robin paid his debt, and he never forgot it. His castle gates have been closed to the Sheriff ever since."], "lionheart": ["The Returning King", "I was gone ten years. Imagine how much I have to be angry about.", "Richard spent most of his reign on crusade and the rest of it in a prison. When he finally came home in disguise, he found his kingdom half gone and his old friends in Sherwood."], "robin": ["The Prince of Thieves", "They call it stealing. I call it returning things to their rightful owner.", "Robin was a nobleman who lost his lands, found a forest, and taught a hundred outcasts that a bow in honest hands can topple a throne. He has never needed a second shot."], "excalibur": ["The Last Knight at the Lake", "Some swords are meant to be thrown away. I was the one who had to throw it.", "Bedivere carried the dying Arthur to the shore and did the hardest thing he was ever asked to: he threw Excalibur into the water. He has been remembering the splash for centuries."], "kay": ["The Grumbling Brother", "I carried his sword before he pulled the other one. Don't forget that.", "Kay raised Arthur as a brother and gave him the sword that started it all, entirely by accident. He complains constantly, hasn't missed a battle yet, and would die before admitting he's proud."], "gawain": ["The Noon Knight", "At sunrise I am good. At noon I am unstoppable. At sunset I am polite.", "Gawain's strength grows with the sun, which makes him unbeatable by day and oddly gentle by dusk. He once kept a promise to a Green Knight that nobody else would have honoured."], "percival": ["The Wanderer", "I was told the question to ask. I forgot. I am still sorry.", "Percival grew up in the woods and was told nothing of knighthood. He rode into Camelot in rags and became its purest heart. His whole life is a quest for one question left unasked."], "ladylake": ["The Keeper of the Sword", "Be still. The water remembers everything you hold.", "She lives beneath a lake so quiet that even the stars hold their breath. She gave Arthur a sword and will take it back when the story ends. She is in no hurry at all."], "guinevere": ["The Queen of Camelot", "A crown is just a very heavy opinion.", "Guinevere ran a kingdom while the knights ran after dragons. Her wit is quicker than any lance, and her loyalty has been tested by more than one man who should have known better."], "lancelot": ["The Finest Knight", "I was the best of them. It was never enough.", "Lancelot could beat any knight alive, and did. But he loved a queen he could not have, and no victory ever filled the silence afterward. He fights now as if he is looking for someone."], "galahad": ["The Pure Knight", "It is simple. You only have to want nothing for yourself.", "Galahad was raised by nuns and arrived in Camelot to sit in the one seat that killed all who tried it. He lived. He found the Grail. He has been astonishingly calm about it ever since."], "merlin": ["The Backward Wizard", "I remember tomorrow. It is the yesterdays that surprise me.", "Merlin lives his life in reverse, so he knows how every story ends and how it began. He guided a boy-king to a throne, then sat in a tree for centuries to think about it."], "arthur": ["The Once and Future King", "A kingdom is a promise everyone agrees to keep.", "Arthur was a boy who pulled a sword from a stone because nobody told him not to. He built a round table for equals, lost it, and is still sleeping, waiting to be needed again."], "dormouse": ["The Sleepy Guest", "Zzz... what was I... oh yes. Zzz...", "Dozer has been at the Mad Tea Party so long that nobody can remember when it started. He falls asleep mid-sentence and wakes up mid-argument. He is, somehow, usually right."], "dodo": ["The Caucus Chairman", "The best way to explain it is to do it. So, everyone run.", "The Dodo invented the Caucus Race, in which everyone wins and nobody finishes. He is deeply serious about fairness and carries a thimble he insists is a prize."], "bill": ["The Chimney Lizard", "I went up, and I came down. And I'm still smiling.", "Bill was a lizard hired to fix a chimney and ended up sent skyward by a very loud kick. He has taken it personally but cheerfully, and fights as if everything is an adventure."], "marchhare": ["The Perpetual March", "It's always March. It's also always teatime. Don't ask me why.", "The Hare lost track of time during a quarrel with Time itself and has been stuck at teatime ever since. His logic is perfect, his premises are baffling, and his jam is very good."], "caterpillar": ["The Blue Philosopher", "Who are you? No, really. I'll wait.", "The Caterpillar sits on a mushroom and asks the one question nobody wants to answer. He is slow, deliberate and impossibly wise, and he will one day become something nobody expects."], "tweedle": ["The Quarrelsome Twins", "Contrariwise, we agreed to fight. Nohow, we didn't.", "Dum and Dee have had the same argument since birth and cannot remember what it was about. They fight as one, bicker as two, and flee as a pair from anything with feathers."], "duchess": ["The Pepper Duchess", "Speak roughly to your baby. It needs the practice.", "The Duchess keeps a kitchen so thick with pepper that the soup is a weapon. She is loud, strange and strangely protective, and her baby turned out to be a pig by popular vote."], "cheshire": ["The Vanishing Grin", "We're all mad here. Some of us are just better at leaving.", "The Cheshire Cat appears when he wishes, disappears when he doesn't, and always leaves his grin behind. He gives directions that make no sense and are never wrong."], "hatter": ["The Mad Tea-Maker", "It's always six o'clock. Pour yourself a cup of anything.", "The Hatter was sentenced for murdering time and has been drinking tea in protest ever since. He is the sanest person in Wonderland, which is why he is considered mad."], "alice": ["The Curious Girl", "Curiouser and curiouser, yes. But I'm not stopping now.", "Alice followed a rabbit down a hole out of simple curiosity and has been asking questions in strange places ever since. She is polite to monsters and does not scare easily."], "whiterabbit": ["The Late Courier", "I'm late! I'm late! Please don't tell the Queen.", "The White Rabbit has never been on time in his life, but he has never once failed to deliver. He is terrified of everyone and brave about the one thing that matters."], "whiteknight": ["The Falling Knight", "I invented a better way to fall. I'll show you.", "The White Knight falls off his horse constantly and always invents something to prevent it. None of it works. He has never stopped believing, and has never lost an argument by giving up."], "humpty": ["The Wall Philosopher", "When I use a word, it means exactly what I choose it to mean.", "Humpty sits on a wall and argues about words with anyone who passes. He has never been moved by an argument, and has fallen only once, which he refers to as 'a technicality.'"], "redqueen": ["The Running Queen", "Faster! Faster! Just to stay where you are!", "The Red Queen runs all day and goes nowhere. She believes every rule can be broken if it is shouted loudly enough. Her bark is terrifying and her bite is surprisingly fair."], "whitequeen": ["The Backward Queen", "I remember next Tuesday perfectly. Yesterday is the difficult one.", "The White Queen lives backward, screaming before the pin pricks. She is absent-minded, kind and slightly alarming. She can believe six impossible things before breakfast and has done so every day."], "lionunicorn": ["The Crown's Quarrel", "We fought for the crown. Now we fight for the fun of it.", "The Lion and the Unicorn have chased each other round the town for so long that nobody remembers who is winning. They are old friends who happen to be rivals, and vice versa."], "walrus": ["The Beach Orator", "The time has come to talk of many things. Mostly oysters.", "The Walrus and the Carpenter invited a flock of oysters for a walk and enjoyed it rather more than the oysters did. They are charming, persuasive, and entirely unreliable."], "vorpal": ["The Jabberwock Slayer", "One, two! One, two! Don't think about the third.", "The Vorpal Knight has one sword and one job. He killed the Jabberwock and came home galumphing, and has been practising ever since in case another monster should dare to appear."], "tulgey": ["The Lost Wanderer", "I'm not lost. I'm simply collecting directions.", "The Wanderer got lost in the Tulgey Wood years ago and decided it was lovely. He knows every path in it and none of them in the right order. He is happy."], "kingalice": ["The Chessboard Queen", "Everyone else is a piece. I decided to be the player.", "Looking-Glass Alice crossed the board one square at a time, from pawn to queen. She is Alice from the other side of the mirror, and she plays to win without ever quite knowing the rules."], "john": ["The Top-Hatted Brother", "I'm the eldest. Therefore I shall lead. Please follow.", "John carries an umbrella, a top hat and the firm belief that someone should be in charge. He is wrong about nearly everything and brave about all of it, which is how Neverland likes its heroes."], "michael": ["The Smallest Darling", "I brought my bear. He's very good in an emergency.", "Michael is the youngest Darling and the only one who never doubted they could fly. He holds his teddy bear like a captain holds a flag and believes in it just as hard."], "nana": ["The Nursery Guardian", "Woof. Which is to say: bedtime, now.", "Nana is a Newfoundland who runs the Darling nursery better than any human could. She bathes the children, scolds the parents and has never been fooled by a pirate. She loves them furiously."], "tootles": ["The Unlucky Marksman", "I'll hit it this time. I always say that.", "Tootles is the lost boy who always misses the best adventures by being asleep or elsewhere. But when he finally aims, the arrow flies true, and everyone is quietly astonished. Including Tootles."], "slightly": ["The Fox-Pelt Fighter", "Don't laugh at the hat. It's earned.", "Slightly Soiled earned his name by falling in every puddle in Neverland. He wears a fox pelt as armour and fights with the ferocity of someone who has nothing to lose but his dinner."], "tigerlily": ["The Proud Princess", "Neverland is mine. I will say it once.", "Tiger Lily rules her tribe with a steady hand and a very quick knife. Peter once saved her from the pirates. She mentions this as rarely as possible, and repays it daily."], "smee": ["The Friendly Pirate", "I'm not a bad man. I'm just employed by one.", "Smee is Captain Hook's boatswain, tailor and only friend. He sews, he scrubs, and he secretly hopes everyone will get along. He's the most dangerous pirate on the ship, precisely because nobody expects it."], "tinker": ["The Pixie Flame", "Don't call me small. Don't call me anything. Just don't.", "Tinker Bell is a fairy who mends pots, holds a grudge and burns brighter than a lantern. She speaks in bells and has no patience for fools. She would die for Peter, and has threatened to."], "crocodile": ["The Ticking Terror", "Tick. Tock. Tick. Tock.", "The Crocodile swallowed a clock and a hand, and has been following Hook ever since. He wants the rest of the meal. He is patient, relentless, and very hard to impress."], "peterpan": ["The Boy Who Wouldn't Grow Up", "To die will be an awfully big adventure. So will lunch.", "Peter flies, crows, forgets, and fights with the pure joy of a boy who has never been tired. He will never grow up, and he will never learn why that is both his glory and his loss."], "piglet": ["The Very Small Animal", "I'm not scared. I'm only extremely, extremely cautious.", "Piglet is the smallest creature in the Hundred Acre Wood and the one who does the bravest things, always while trembling. He lives in a house marked TRESPASSERS W, and that has never stopped him from welcoming visitors."], "roo": ["The Pocket Bouncer", "Look at me! Look at me! I'm doing it!", "Roo is Kanga's baby and the Wood's most enthusiastic jumper. He bounds in and out of her pocket, falling in streams, fighting heffalumps and, by general agreement, winning everything."], "eeyore": ["The Gloomy Donkey", "Thanks for noticing me. Most people don't.", "Eeyore lives in a house made of sticks and has been told it will fall down. It never has. He is the Wood's resident pessimist, and its steadiest friend. He loses his tail often and keeps his dignity always."], "small": ["The Smallest in the Wood", "Small, but not that small.", "Small is a beetle who looks up at the whole Hundred Acre Wood and decides he's the biggest thing in it. He is usually right, in the sense that matters, and he bites very hard."], "tigger": ["The Bouncing Tiger", "The wonderful thing about Tiggers is I'm the only one!", "Tigger arrived in the Wood one windy night and bounced into everyone's life uninvited. He is loud, buoyant and occasionally too big for his own tree. He has never once been sorry."], "rabbit": ["The Organiser", "I have a plan. Everyone listen. And stop touching things.", "Rabbit has lists, schedules and a firm conviction that the Wood would collapse without him. He is probably right. He is also unbearably fussy, and will die for any friend who needs him."], "owl": ["The Wise Bird", "It is a matter of considerable complexity. Let me explain at length.", "Owl lives in the grandest house in the Wood and knows how to spell WOL, which is mostly correct. He tells long stories that eventually reach a point. When they do, it's usually a good one."], "kanga": ["The Pocket Mother", "There's room in my pocket for everyone, dear.", "Kanga looks after Roo and, by extension, the whole Wood. She is calm, patient, and utterly protective. When Roo is threatened, her kick has been known to knock a Heffalump into next week."], "christopher": ["The Boy of the Wood", "Silly old bear. Don't worry. I'm here.", "Christopher Robin lives at the top of the Wood and arrives whenever it's needed. He leads expeditions, rescues animals from floods and, when he grows up, is the only one who never forgets them."], "pooh": ["The Bear of Very Little Brain", "I wasn't going anywhere in particular. I just thought you'd like company.", "Pooh is a bear who lives under the name of Sanders and eats honey whenever there is honey. His brain is small and his heart is the largest in the Wood. He does not understand cleverness but he understands everything."], "mole": ["The Spring Cleaner", "Hang spring cleaning! I'm going out.", "Mole abandoned his tidy little home one sunny morning and walked into the great wide world. He has not stopped being delighted since. He is gentle, easily surprised, and has never given up on a friend."], "ratty": ["The River Dweller", "There is nothing, absolutely nothing, half so much worth doing as messing about in boats.", "Ratty lives by the river and knows its every mood. He is a poet, a boatman and a loyal friend, and he'd rather share his lunch than win an argument. Both are rare."], "otter": ["The Splashing Friend", "Wait for me! Wait for me! I'm coming!", "Otter is the river's tireless messenger and its wildest swimmer. He dives first and asks questions on the surface. He loves a good game, a good friend and a better fish."], "portly": ["The Lost Pup", "I only wanted to see the river. I found something else.", "Portly is Otter's son, lost on a long night and found by the Piper at the Gates of Dawn. He remembers none of it, except a song that makes him quiet whenever he hears it."], "barge": ["The Barge Woman", "Fine. Fifty miles. But you pay up front.", "The Barge Woman once gave a runaway toad a ride, mistaking him for a washerwoman. She laughed about it for a year. She is practical, sharp-tongued and secretly the kindest person on the canal."], "toad": ["The Terror of the Highway", "Poop-poop! Make way for the finest driver in England!", "Toad Hall's master is vain, rich and impossible to stop. He steals motor-cars, escapes prisons and cannot help boasting about both. His friends forgive him because he has never once been dull."], "gaoler": ["The Kind Captor", "He's not so bad, you know. For a toad.", "The Gaoler's Daughter took pity on a prisoner who looked ridiculous, and quietly helped him escape in a washerwoman's dress. She never explained herself, and was never found out."], "badger": ["The Gruff Guardian", "I don't like company. But you'd better come in.", "Badger lives deep in the Wild Wood and keeps its secrets. He is grumpy, wise and deeply kind, and he'd rather be left alone. But if you're in trouble, he's the first to open the door."], "searat": ["The Wandering Sailor", "I've seen the world, my friend. It's bigger than you think.", "The Sea Rat comes ashore with salt in his hair and stories in his sleeves. He tells of far ports and wild winds, and makes the river-bank creatures yearn to leave. Then he leaves himself."], "pan": ["The Piper at the Gates of Dawn", "You were not afraid. That is the best gift I can give.", "Pan is the god of the river, seen only by those who truly need him. He watches over lost children and wandering animals. Once seen, he is never remembered, and that is his gift."], "flopsy": ["The Sleepy Bunny", "Mmm. Lettuce. Mmm. Zzz.", "Flopsy is the eldest of the bunnies who do as they are told. She naps by the garden wall and never gets in trouble. She is calm, cosy, and deeply underrated."], "mopsy": ["The Quick Bunny", "Last one there's a rotten carrot!", "Mopsy is always first through the hole in the fence. She is the swiftest of her sisters and rarely thinks past the next hop. Luckily, hopping is her whole strategy."], "cottontail": ["The Lucky Bunny", "I wasn't there. I didn't do it. And I got the blackberries.", "Cottontail stays out of trouble and somehow ends up with the best share of everything. Her sisters call it luck. She calls it paying attention."], "tomkitten": ["The Naked Kitten", "My clothes are fine. It's the ducks who took them.", "Tom Kitten lost every stitch of his clothes to a family of ducks. He has since learned to fight in the nude and with astonishing confidence. His mother has given up trying to keep him tidy."], "benjamin": ["The Worried Cousin", "Don't make a noise. Don't say a word. Just run.", "Benjamin Bunny is Peter's cousin and the more cautious of the two. He keeps a lookout, carries a handkerchief, and has a deep understanding of cats. He also has a very quick pair of ears."], "jemima": ["The Puddle-Duck", "I'll find a lovely, secret place for my eggs.", "Jemima Puddle-Duck is a good mother with no sense of direction. She has been tricked by a very polite fox and rescued by a very rude collie. She remains an optimist."], "nutkin": ["The Riddling Squirrel", "Riddle me this, riddle me that. Can you catch me in my hat?", "Nutkin is a squirrel who cannot stop teasing the old owl, and has paid with half his tail. He remains cheerful and impossible to shut up. His riddles are better than they should be."], "tiggy": ["The Hedgehog Washerwoman", "Come in, dear. I'll have that laundered by morning.", "Mrs. Tiggy-Winkle lives under a hill and washes clothes for every creature in the valley. She is round, warm and endlessly practical. She heals anything that a hot iron and a kind word can mend."], "jeremy": ["The Frog in a Mackintosh", "Fishing is a patient business. And I am extremely patient.", "Jeremy Fisher sits on a lily pad in the pouring rain with a worm on his rod. He has been eaten by a trout once, and spat out for being too waterproof. He has never learned."], "peter": ["The Naughty Rabbit", "I lost my jacket and my shoes. I didn't lose my nerve.", "Peter Rabbit ignored his mother and went into Mr. McGregor's garden. He lost his jacket in the gooseberry net and nearly lost everything else. He is brave, careless, and unrepentant."], "jack": ["The Beanstalk Climber", "It was only a handful of beans. Everything big starts that way.", "Jack sold the family cow for five beans, was beaten for it, and climbed what grew anyway. He came back with a hen, a harp and a lifelong taste for heights. He has never regretted the swap."], "jackma": ["The Bean Thrower", "I threw them out the window. You see how that turned out.", "Jack's mother was furious about the beans and never forgave herself for being right to be furious. She kept the cottage, the hens and, eventually, a very large pile of gold."], "daisy": ["The Traded Cow", "I gave milk for years. They gave me away for beans. I remember.", "Daisy was the family cow, sold for a handful of beans and never allowed to forget it. She has sharp horns and a longer memory. She still watches the sky for a certain beanstalk."], "beanman": ["The Bean Seller", "Five beans. Fair price. Don't ask where they're from.", "The Magic Bean Seller turns up at crossroads with a bag of seeds and a sly smile. He knows exactly what each bean will do. He has never once told anyone, and he enjoys it."], "goldhen": ["The Golden Layer", "Cluck. Which is to say: I'm worth more than your castle.", "The Golden Hen was stolen from a giant's table and has laid one golden egg a day ever since. She is smug, solid and extremely well fed. She lays plans too."], "harp": ["The Singing Harp", "Master! Master! Someone's taking me!", "The Singing Harp belongs to a giant and loves a boy. Her strings tremble when she is frightened and calm when she is cared for. She sings so sweetly that even the Blot goes quiet."], "sproutling": ["The Little Vine", "I'm not a weed. I'm a beanstalk in training.", "Sproutling is a baby beanstalk who has seen Jack's and wants to be taller. He is opinionated, twisty and growing fast. He leans toward whoever talks to him kindly."], "babygiant": ["The Gentle Colossus", "Fee, fi... oh, I forgot the rest. Sorry.", "The Baby Giant lives in the clouds with a very big family and a very small vocabulary. He would rather play than fight, and he has never stepped on anyone on purpose."], "thunderfairy": ["The Cloud Spark", "I live above the weather. It's quieter up here, except for me.", "The Thundercloud Fairy rides the beanstalk's high winds and hurls lightning at anyone who gets too close. She is lonely, brilliant and very, very loud."], "giantkiller": ["The Cornish Slayer", "They call me a giant killer. I call it a good cloak.", "Jack the Giant Killer is a Cornish lad with a sword of sharpness, a cap of knowledge and a cloak of darkness. He has outwitted more giants than he has had hot dinners."], "goldilocks": ["The Porridge Thief", "Too hot. Too cold. Just right. Next!", "Goldilocks walked into a stranger's house, ate their food and broke their furniture. She has never been apologetic. She is curious, quick, and the best escape artist in the forest."], "papabear": ["The Big Bear", "Somebody has been sitting in my chair, and I'm going to find out who.", "Papa Bear is the head of the bear family and the loudest. He is gruff, protective and secretly soft. His porridge is the hottest and his temper is the shortest."], "mamabear": ["The Middle Bear", "I'm not angry. I'm just very, very disappointed.", "Mama Bear keeps the family together, the house tidy and the porridge at the right temperature. She is patient, practical and terrifying when pushed."], "babybear": ["The Little Bear", "Somebody has been in my bed, and she's still there!", "Baby Bear is the smallest of the three and the most easily upset. He is also the one who found Goldilocks. He is braver than he looks, and louder than he should be."], "strawpig": ["The First Little Pig", "My house is a work of art. It's also a bit windy.", "Straw Pig built his house in an afternoon and spent the rest of the day enjoying it. It lasted until the wolf arrived. He ran to his brother's and learned, a little late, that planning matters."], "stickpig": ["The Second Little Pig", "Sticks are quick. Quick is good. Quick is also fragile.", "Stick Pig saved time by building from twigs. When the wolf huffed, he fled to his brother's house with a head start and a lesson. He is nimble, fast and quick to learn."], "brickpig": ["The Third Little Pig", "Take your time. Do it right. Then go ahead and huff.", "Brick Pig built his house slowly and stoutly, brick by brick. He took in both his brothers when the wolf came, and laughed through the chimney. He is calm, careful and a hard man to blow down."], "hennypenny": ["The Sky Watcher", "The sky is falling! Quick, tell the king!", "Henny Penny was hit on the head by an acorn and decided the sky was falling. She recruited half the farmyard to warn the king. She is dramatic, loud and very persuasive."], "gingerbread": ["The Runaway Cookie", "Run, run, as fast as you can! You can't catch me!", "The Gingerbread Man jumped out of the oven and ran from an old woman, a cow, a horse and a fox. He is quick, cocky and faintly sweet. His last race is the one he never mentions."], "caporushes": ["The Cloak of Rushes", "My father asked how much I loved him. I said, like salt.", "Cap o' Rushes was cast out for an honest answer and worked as a kitchen maid. She wore a cloak of rushes and a ballgown by night. She married the heir, and cooked the wedding feast without salt."], "muffet": ["The Tuffet Sitter", "It was a perfectly good tuffet. The spider can have it.", "Miss Muffet was frightened off her tuffet by a spider. She has since returned, with a stout jar and a very large grudge. She sits on the tuffet again, and the spider sits elsewhere."], "jackjill": ["The Hill Climbers", "Up the hill! Down the hill! Together or not at all!", "Jack and Jill climbed a hill to fetch a pail of water and went tumbling down. They've been climbing and tumbling ever since. They always bring the water home."], "horner": ["The Corner Sitter", "I put in my thumb and pulled out a plum. What did you pull out?", "Little Jack Horner sits in a corner with a Christmas pie and an astonishing amount of confidence. He is certain he's a good boy. He might be."], "willie": ["The Nightgown Runner", "Are the children in their beds? It's eight o'clock!", "Wee Willie Winkie runs through the town in a nightgown, shouting at windows. He is nobody's idea of a hero, but nobody sleeps without him."], "simon": ["The Simple Hero", "I wanted a pie. I got an adventure.", "Simple Simon met a pieman, wanted a pie, and had no pennies. He is trusting, easily tricked and has never been bitter about it. He is simple, but he is not stupid."], "bopeep": ["The Shepherdess", "Leave them alone and they'll come home. Wagging their tails behind them.", "Bo Peep lost her sheep and, rather than panic, sat down and waited. They came home, as sheep do. She is patient, kind and has a crook that can fell an ox."], "kingcole": ["The Merry Old Soul", "Call for my pipe, call for my bowl, and call for my fiddlers three!", "Old King Cole rules by singing. His court is full of fiddlers and his heart is full of laughter. He has never lost a war, mostly because nobody has had the heart to start one."], "mary": ["The Contrary Gardener", "My garden grows with silver bells and cockle shells. And pretty maids all in a row.", "Mistress Mary is contrary by nature and a gardener by trade. She grows the strangest flowers in the world and won't tell anyone how. She takes orders from no one, including sunshine."], "hubbard": ["The Bare Cupboard", "The cupboard was bare. So I made something out of nothing.", "Old Mother Hubbard went to the cupboard to get her dog a bone and found nothing. She has since learned to make soup out of air. Her dog is the best-fed in the country."], "shoe": ["The Shoe Mother", "I have so many children I don't know what to do. I do it anyway.", "The Old Woman in the Shoe raised a hundred children in a boot and fed them broth without bread. She is exhausted, indomitable and has never lost one."], "tinytim": ["The Smallest Cratchit", "God bless us, every one. And I mean every one.", "Tiny Tim wa
