<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Storybook Brawl</title>
<style>
:root{--bg:#120a24;--panel:#1d1238;--panel2:#2a1a50;--cy:#22e3ff;--mg:#ff3df2;--tx:#f3eaff;--dim:#9a8bbd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;background:linear-gradient(90deg,#2a1050,#0f2a50)}
header h1{font-size:18px;margin:0;background:linear-gradient(90deg,var(--cy),var(--mg));-webkit-background-clip:text;color:transparent}
.cur{display:flex;gap:10px;font-weight:700;font-size:14px}
.cur span{background:#0006;padding:4px 9px;border-radius:99px}
main{flex:1;overflow-y:auto;padding:12px 14px 16px}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;padding:10px 4px;border-radius:12px;border:2px solid #ffffff22;background:var(--panel2);color:var(--tx);font-weight:800;font-size:13px}.seg button.on{background:#22e3ff33;border-color:var(--cy)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tile{position:relative;background:var(--panel2);border:1px solid #ffffff18;border-radius:14px;padding:12px 10px;text-align:left;color:var(--tx);font-family:inherit}.tile b{display:block;font-size:15px}.tile .small{display:block;margin-top:3px;line-height:1.3}.tile.lk{opacity:.55}.tile .bd{position:absolute;top:6px;right:8px;background:#ff3df2;color:#12081f;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:800}
.sbar{height:9px;background:#ffffff18;border-radius:5px;overflow:hidden;margin:3px 0 8px}.sbar i{display:block;height:100%;background:linear-gradient(90deg,#22e3ff,#ff3df2)}
.beat{background:#fbbf2418;border:1px solid #fbbf2455;border-radius:12px;padding:10px;margin:8px 0}
.hubhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.hubhead .btn{width:auto;margin:0;padding:8px 14px;font-size:14px}.hubhead b{font-size:17px}
.info{position:absolute;top:2px;left:4px;font-size:15px;background:#0d0719cc;border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;color:var(--cy)}
.quote{font-style:italic;border-left:3px solid var(--mg);padding:4px 10px;margin:8px 0;font-size:14px}
nav{display:flex;background:#0d0719;border-top:1px solid #ffffff18;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:10px 0 8px;font-size:12px;font-weight:600}
nav button b{display:block;font-size:20px}
nav button.on{color:var(--cy)}
.card{background:var(--panel);border-radius:14px;padding:12px;margin-bottom:12px;border:1px solid #ffffff12}
h2{margin:0 0 8px;font-size:16px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;color:#12081f;background:linear-gradient(90deg,var(--cy),var(--mg));margin-top:8px}
.btn:disabled{opacity:.4}
.btn.sec{background:var(--panel2);color:var(--tx)}
.small{font-size:12px;color:var(--dim)}
.center{text-align:center}
.stagebar{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:800}
.stagebar button{background:var(--panel2);color:var(--tx);border:0;border-radius:10px;width:44px;height:44px;font-size:20px}
.stagebar button:disabled{opacity:.25}
.prev{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{background:var(--panel2);border-radius:12px;padding:8px;text-align:center;min-width:64px;border:2px solid #ffffff14}
.chip .e{font-size:30px}.chip .n{font-size:10px;color:var(--dim);max-width:76px}
.slot{border:2px dashed #ffffff30;border-radius:12px;min-width:64px;min-height:78px;display:flex;align-items:center;justify-content:center;color:#ffffff40;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hc{background:var(--panel);border-radius:12px;padding:8px 4px;text-align:center;border:2px solid #ffffff14;position:relative}
.hc .e{font-size:34px}.hc .n{font-size:11px;font-weight:700}.hc .l{font-size:10px;color:var(--dim)}
.hc.locked{opacity:.35}
.hc.insq::after{content:"✓";position:absolute;top:2px;right:6px;color:var(--cy);font-weight:900}
.gold{box-shadow:0 0 10px #fbbf24aa}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal{background:var(--panel);border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto;border:2px solid var(--cy)}
.hide{display:none!important}
.big{font-size:80px;text-align:center}
.rev{display:flex;justify-content:center}
.revc{width:200px;height:270px;border-radius:18px;border:4px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel2);animation:flip .9s ease both}
@keyframes flip{0%{transform:rotateY(90deg) scale(.6)}60%{transform:rotateY(-10deg) scale(1.1)}100%{transform:rotateY(0) scale(1)}}
.shake{animation:sh .5s infinite}@keyframes sh{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.mvl{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:12px}
.mvl b{font-size:13px}
.row2{display:flex;gap:8px}.row2 .btn{margin-top:0}
.fcw{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.fc{background:var(--panel2);color:var(--tx);border:2px solid #ffffff22;border-radius:10px;padding:4px 8px;font-size:11px;font-weight:700;text-align:center}
.fc.on{background:#22e3ff33;border-color:var(--cy)}
.rm{background:var(--panel2);border-radius:12px;padding:8px 10px;margin-bottom:6px;border:1px solid #ffffff18}
.rm.lk{opacity:.4}
.rmt{display:flex;justify-content:space-between}
.xpb{height:8px;background:#0008;border-radius:4px;overflow:hidden;margin:4px 0}.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg))}

/* ===== ARENA (2.5D) ===== */
#arena{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#tb{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 6px;font-weight:800;font-size:14px;background:#0d0719}
#tb .bt{display:flex;gap:4px}
#tb button{background:var(--panel2);color:var(--tx);border:0;border-radius:8px;padding:7px 9px;font-weight:700;font-size:12px}
#tb button.on{background:var(--cy);color:#000}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(var(--sk1),var(--sk2) 46%)}
.par{position:absolute;left:0;white-space:nowrap;pointer-events:none;width:max-content;letter-spacing:34px}
#far{top:14%;font-size:42px;opacity:.5;animation:drift 90s linear infinite}
#near{top:27%;font-size:66px;opacity:.75;letter-spacing:70px;animation:drift 45s linear infinite}
@keyframes drift{to{transform:translateX(-50%)}}
#floor{position:absolute;left:0;top:44%;width:100%;height:56%}
#units{position:absolute;inset:0}
.u{position:absolute;width:96px;margin-left:-48px;transform:translateY(-100%) scale(var(--sc));transform-origin:50% 100%;text-align:center}
.u .in{position:relative;display:flex;flex-direction:column;align-items:center}
.u .body{line-height:1;animation:bob 1.7s ease-in-out infinite;filter:drop-shadow(0 4px 3px #0008)}
.u.e .body{animation-delay:-.6s}
@keyframes bob{50%{transform:translateY(-4px)}}
.u .sh{position:absolute;left:50%;bottom:-8px;width:64px;height:16px;margin-left:-32px;background:#0009;border-radius:50%}
.u .ub{width:70px;margin-bottom:2px}
.bar{height:7px;background:#000a;border-radius:4px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;width:100%;transition:width .1s}
.hp i{background:linear-gradient(90deg,#22c55e,#86efac)}.u.e .hp i{background:linear-gradient(90deg,#ff3df2,#f87171)}
.atb{height:4px}.atb i{background:var(--cy);width:0}
.rg{height:4px}.rg i{background:#fbbf24;width:0}
.u .st{font-size:13px;height:16px;line-height:16px}
.u .wind{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;background:#ff2d55;color:#fff;font-size:12px;font-weight:900;padding:3px 8px;border-radius:8px;white-space:nowrap;overflow:hidden;animation:pulse .5s infinite alternate;z-index:5}
.u .wind i{position:absolute;left:0;bottom:0;height:3px;background:#fff}
@keyframes pulse{to{transform:translateX(-50%) scale(1.1)}}
.u.dead{opacity:.0;transition:opacity .6s;pointer-events:none}
.u.act .sh{background:#ff2d55cc;box-shadow:0 0 14px 4px #ff2d55}
.u.rdy .sh{background:#22e3ffcc;box-shadow:0 0 14px 4px #22e3ff}
.u.focus .sh{background:#ff3df2cc;box-shadow:0 0 14px 5px #ff3df2}
.u.focus::before{content:"🎯";position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:18px;z-index:4}
#fx{position:absolute;inset:0;pointer-events:none;z-index:900}
.pp{position:absolute;font-weight:900;font-size:17px;text-shadow:0 2px 3px #000,0 0 6px #000;transform:translate(-50%,-50%);animation:ppf 1s forwards;white-space:nowrap}
@keyframes ppf{to{transform:translate(-50%,-90px);opacity:0}}
.pj{position:absolute;font-size:26px;transform:translate(-50%,-50%)}
#order{position:absolute;left:6px;top:6px;display:flex;align-items:center;gap:4px;z-index:960;flex-wrap:nowrap;max-width:96%;overflow:hidden}
#order .rl{font-size:11px;font-weight:800;color:#fff;background:#000a;border-radius:8px;padding:3px 6px;margin-right:2px}
#order .oc{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:#000a;border:2px solid #ffffff44;flex:none}
#order .oc.p{border-color:#22e3ff}#order .oc.e{border-color:#ff3df2}
#order .oc.now{transform:scale(1.25);box-shadow:0 0 10px #fff;background:#fff3}
#bn{position:absolute;left:8px;right:8px;top:42px;text-align:center;font-weight:800;font-size:14px;background:#000b;border:1px solid var(--cy);border-radius:10px;padding:8px;z-index:950;opacity:0;transition:opacity .3s;pointer-events:none}
#bn.on{opacity:1}
.amap{position:relative;height:290px;border-radius:14px;overflow:hidden;margin-top:8px;border:1px solid #ffffff25}
.amap svg{position:absolute;inset:0;width:100%;height:100%}
.amap .dc{position:absolute;font-size:26px;opacity:.28;pointer-events:none}
.nd{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:2px solid #fff6;background:#1b1230;color:#fff;font-weight:800;font-size:14px;padding:0;cursor:pointer}
.nd .nl{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap}
.nd.done{background:#14532d;border-color:#4ade80}
.nd.cur{border-color:#22e3ff;animation:ndp 1.2s infinite}
.nd.lk{opacity:.4}
.nd.sel{box-shadow:0 0 0 3px #fff}
.nd.mini{width:46px;height:46px;margin:-23px 0 0 -23px;border-color:#fbbf24;font-size:20px}
.nd.bossn{width:54px;height:54px;margin:-27px 0 0 -27px;border-color:#ff2d55;font-size:24px}
@keyframes ndp{50%{box-shadow:0 0 0 6px #22e3ff55}}
nav button.rdy b::after{content:'❗';font-size:11px;position:absolute;margin:-4px 0 0 -2px}
/* command panel */

#cmd{padding:6px 8px calc(7px + env(safe-area-inset-bottom));background:#1b1620;border-top:1px solid #d2a56a65}
.command-party{display:flex;gap:4px}
.hcol{display:flex;align-items:center;gap:4px;flex:1;min-width:0;padding:3px 4px;background:#27202b;border:1px solid #dec08e33;border-radius:6px}
.hcol.rdy{border-color:#edc883;background:#4b342a}
.hcol.dead{opacity:.32}
.he{font-size:18px;flex:none}
.hbars{flex:1;min-width:0}
.hbars .bar{height:4px;margin:2px 0}
.command-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 4px}
.command-header strong{font:700 15px/1.1 Georgia;color:#ffe4b6;min-width:0}
.command-header span{flex:none;color:#d2bfab;font-size:10px;font-weight:700}
.move-deck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.move-deck[hidden]{display:none}
.mb{display:grid;grid-template-columns:23px minmax(0,1fr);align-items:center;gap:5px;min-width:0;min-height:48px;padding:4px 6px;text-align:left;border:1px solid #beaa824a;border-radius:8px;background:#302638;color:#fff1dc;font:inherit;touch-action:manipulation}
.mb .ic{display:grid;place-items:center;min-height:23px;border-radius:5px;background:#130e18a0;font-size:15px}
.mb .ic svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.65;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mb .mn{display:block;font-weight:750;font-size:12px;line-height:1.12;overflow-wrap:anywhere}
.mb .cdv{display:block;margin-top:2px;color:#cfbead;font-size:9px;font-weight:700;line-height:1.15}
.mb.ult{border-color:#e5b15d;background:#3b2b2c}
.mb.go{background:linear-gradient(145deg,#694b3f,#35283a);border-color:#e6bb7c}
.mb.go .cdv{color:#ffe3a2}
.mb.go.ult{background:linear-gradient(145deg,#825735,#4a3037);border-color:#ffda86}
.mb:disabled{color:#cdbcae}
.mb:disabled .ic{opacity:.62}
.mb.go:active{background:#87614b}
:root{--bg:#100e16;--panel:#201b26;--panel2:#322838;--cy:#f3cc83;--mg:#d98972;--tx:#fff3df;--dim:#d2bfab}
html,body{background:radial-gradient(ellipse at 50% 0,#352737,#100e16 70%)}
#app{background:linear-gradient(150deg,#201923,#100e16 70%);border-inline:1px solid #eac78924}
header{min-height:64px;background:linear-gradient(110deg,#392532,#181622);border-bottom:1px solid #ba925666;gap:8px}
header h1{font: bold clamp(16px,5vw,28px)/1 Georgia,serif;letter-spacing:-.03em;color:#ffe0a6;background:none;text-shadow:0 2px 2px #000}
.wordmark small{display:block;color:#d7ae77;font:700 8px/1.8 system-ui;letter-spacing:.23em;text-transform:uppercase}
.cur{gap:4px;font-size:12px}.cur span{border:1px solid #e0b77838;white-space:nowrap;padding:4px 6px}
.card,#modal{border-color:#c49a594d;background:linear-gradient(145deg,#2c2230,#1a1721 75%);box-shadow:inset 0 1px #ffffff0b,0 5px 13px #0003}
h2,.stagebar{font-family:Georgia,serif;color:#ffe0a6}
nav{background:#19141e;border-top-color:#bb925966}
nav button{min-width:0;border-top:2px solid transparent}
nav button.on{border-top-color:#f3cc83;background:linear-gradient(#e7b46928,transparent)}
nav svg{display:block;width:23px;height:23px;margin:0 auto 4px;fill:none;stroke:currentColor;stroke-width:1.5}
.btn{background:linear-gradient(#ffe2a0,#cb8f51);border:1px solid #ffe6af80;box-shadow:inset 0 1px #fff6,0 3px 0 #0005;color:#261624;letter-spacing:.025em}
.btn.sec{border-color:#c19a615c}
button:focus-visible{outline:2px solid #fff0be;outline-offset:2px}
.amap{background-size:cover;background-position:center;border-color:#e2b47775;box-shadow:inset 0 0 24px #0007}
.nd{box-shadow:0 3px 8px #000b;border-color:#e6bc7d;background:#211b28;color:#ffe4b0}
.nd.cur,.nd.sel{background:#f2c782;color:#271a24}
.nd.lk{background:#1a1624;color:#f5ddbd}
#stage{background-size:100% 100%;background-position:center}
#far,#near,#floor{display:none}
.portrait{display:inline-block;width:1.13em;height:1.13em;vertical-align:middle;overflow:visible}
.u .portrait{width:1.35em;height:1.48em}
.u .body{filter:drop-shadow(0 3px 2px #0009)}
@media(prefers-reduced-motion:reduce){.u .body,.nd.cur{animation:none}}

#titleScreen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#0e1417}
#titleScreen[hidden]{display:none}
.title-frame{width:min(100%,560px);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:calc(8vh + env(safe-area-inset-top)) 22px calc(7vh + env(safe-area-inset-bottom));background:linear-gradient(#10121be8,transparent 39%,transparent 60%,#10121bf5),url(assets/title.webp) center/cover}
.title-frame h2{font:700 clamp(44px,11vw,84px)/.85 Georgia,serif;margin:.14em 0 .25em;letter-spacing:-.055em;color:#ffe2a8;text-shadow:0 3px 0 #6d3a20,0 7px 20px #000}
.title-frame small{color:#f5d6a0;font-size:10px;letter-spacing:.3em;text-transform:uppercase}
.title-frame .btn{width:min(100%,280px);min-height:52px;text-transform:uppercase}
.atlas-sprite{display:inline-block;width:1.5em;height:1.5em;vertical-align:middle;background-size:400% 200%;background-repeat:no-repeat}
.u .atlas-sprite{display:block;height:auto;width:clamp(76px,23vw,136px);aspect-ratio:1;image-rendering:auto;background-size:400% 200%;background-repeat:no-repeat}
.u .body:has(.atlas-sprite){animation:none}
.e .atlas-sprite{transform:none}
.combat-burst{position:absolute;width:64px;height:64px;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(.25);color:var(--burst);border:2px solid currentColor;box-shadow:0 0 13px currentColor,inset 0 0 15px currentColor;animation:burst var(--duration) ease-out forwards}
.combat-burst.slash{height:20px;border-width:0 0 4px;transform:translate(-50%,-50%) rotate(-27deg) scale(.25)}
@keyframes burst{from{scale:.65;opacity:1}to{scale:5;opacity:0}}
@media(prefers-reduced-motion:reduce){.combat-burst{animation:none;opacity:.4}}

.adventure-map{padding:10px}
.adventure-map .stagebar{gap:8px}
.map-kicker,.brief-kicker,.lineup h3{font:750 10px/1.4 system-ui;letter-spacing:.14em;text-transform:uppercase;color:#e7bd83}
.map-area{font-size:clamp(17px,5vw,25px);line-height:1.15;margin-top:2px}
.adventure-map .amap{height:clamp(300px,94vw,445px);margin-top:10px;background-position:center;background-size:cover}
.adventure-map .amap>svg{pointer-events:none}
.adventure-map .nd .nl{background:#19141e;color:#fff0ca;padding:1px 4px;border-radius:3px}
.map-key{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 14px;margin-top:9px}
.stage-brief .beat{background:#17141c;border:1px solid #d2a76845;border-left:3px solid #d2a768}
.stage-brief .beat .small{color:#e5bf88!important}
.brief-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brief-head h2{font-size:24px;margin:2px 0 0}
.stage-status{font-size:10px;font-weight:750;padding:5px 8px;background:#ad85552b;border:1px solid #c8a36955;border-radius:6px;color:#ffe1ad;text-align:center}
.matchup{display:grid;grid-template-columns:minmax(0,1fr) 27px minmax(0,1fr);align-items:start;gap:5px;margin:14px 0}
.lineup{min-width:0;text-align:center}
.lineup h3{margin:0 0 6px;color:#e6cd9f}
.lineup.enemy h3{color:#ffc3a7}
.versus{align-self:start;justify-self:center;margin-top:56px;font:italic bold 16px Georgia;color:#e6bc81}
.fighter{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;margin-bottom:5px;padding:5px 4px 8px;background:radial-gradient(ellipse at 50% 30%,#4a493a,#211d29 76%);border:1px solid #cdb88152;border-radius:9px}
.enemy .fighter{background:radial-gradient(ellipse at 50% 30%,#593931,#211a25 76%);border-color:#d68e695c}
.fighter-art{display:grid;place-items:center;width:100%;height:clamp(78px,27vw,128px);font-size:clamp(52px,18vw,85px)}
.fighter-art .atlas-sprite{width:min(100%,1.5em);height:100%;aspect-ratio:1;width:auto}
.fighter strong{font:700 clamp(12px,3.6vw,17px)/1.15 Georgia;overflow-wrap:anywhere}
.fighter .small{font-size:10px;line-height:1.3;margin-top:3px}
.scout-notes{padding:8px 9px;border:1px solid #d6af7538;border-radius:8px;line-height:1.45}

.draw-hall{text-align:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#59423f,#221a2a 55%,#16131d)}
.draw-hall h2{font-size:27px}
.card-back{display:grid;place-items:center;width:95px;aspect-ratio:2/3;margin:6px auto 16px;border:2px solid #d9aa68;border-radius:10px;background:repeating-linear-gradient(45deg,#d9aa6812 0 1px,transparent 1px 10px),linear-gradient(140deg,#51304b,#1c1830);box-shadow:inset 0 0 0 5px #221729,inset 0 0 0 6px #aa7f52,0 8px 20px #0009}
.card-back svg{width:55%;fill:none;stroke:#ffdc96;stroke-width:1.2}
.draw-filters{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:10px 0}

function spriteFor(name) {
 const atlas=spriteAtlases[name.replace(/^(MINI|AREA|REALM) BOSS /, "")];
 return atlas ? `<span class="atlas-sprite" aria-hidden="true" data-sprite="${atlas}" style="background-image:var(--sprite-${atlas})"></span>` : '';
}
function playSprite(u, move) {
 const sprite=u.inEl.querySelector('.atlas-sprite:not(.single)');
 if(!sprite||!sprite.animate||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const charged=move!==0&&move!=='basic';
 const alternate=(move===2||move===3) ? specialAtlases[u.hid] : null;
 const row=alternate ? (move===3?'100%':'0%') : (charged?'100%':'0%');
 const idleImage=`var(--sprite-${sprite.dataset.sprite})`;
 sprite.getAnimations().forEach(animation=>animation.cancel());
 if(alternate)sprite.style.backgroundImage=`var(--sprite-${alternate})`;
 const motion=sprite.animate([0,1,2,3,0].map((column,index)=>({
  backgroundPosition:`${column*100/3}% ${index===4?'0%':row}`
 })),{duration:(charged?540:360)/B.speed,easing:'steps(4,end)'});
 if(alternate)motion.onfinish=()=>{sprite.style.backgroundImage=idleImage};
}
function combatBurst(target, color, shape='') {
 const [x,y]=ctr(target);
 const burst=document.createElement('span');
 burst.className='combat-burst '+shape;
 burst.style.cssText=`left:${x}px;top:${y}px;--burst:${color};--duration:${440/B.speed}ms`;
 $('#fx').append(burst);
 setTimeout(()=>burst.remove(),480/B.speed);
}

const illustratedPortraits = new Map();
function portrait(name, enemy=false, preferPortrait=false) {
 const sprite=spriteFor(name);
 const portraitKey=characterPortraits[name];
 if(sprite&&(!preferPortrait||!portraitKey))return sprite;
 if(portraitKey)return `<span class="atlas-sprite single" aria-hidden="true" style="background-image:var(--portrait-${portraitKey})"></span>`;
 const key = (enemy?'enemy:':'hero:')+name;
 if (illustratedPortraits.has(key)) return illustratedPortraits.get(key);

   ? '<path d="M19 32 10 7 33 19 40 10 48 19 70 7 61 35 65 52 50 66 31 66 15 52Z" fill="'+light+'"/><path d="M21 36 32 40 31 47 23 44ZM59 36 48 40 49 47 57 44Z" fill="#ffe9a4"/><path d="M27 52 53 52 47 61 34 61Z" fill="#231927"/><path d="m29 52 7 1-3 6m18-7-7 1 3 6" fill="#fff0cb"/>'

const paintedRealms = new Map();
function landscape(realm, map) {
 const asset=realmArt[realm.n]?.[map?'map':'arena'];
 if(asset)return `var(--realm-${asset})`;
 const key=realm.n+map;
 if(paintedRealms.has(key)) return paintedRealms.get(key);
 const seed=hs(realm.n), rnd=mulberry(seed);
 const ridges=(base,height,color)=> {
  let d=`M0 ${base}`;
  for(let x=0;x<=800;x+=32)d+=` L${x} ${Math.round(base-rnd()*height)}`;
  return `<path d="${d} V480H0Z" fill="${color}"/>`;
 };
 let landmarks='';
 for(let i=0;i<34;i++){
  const x=Math.round(rnd()*800), y=215+Math.round(rnd()*58), h=25+Math.round(rnd()*85);
  const shape=seed%3===0 ? `M-17 0-5 ${-h+15} 0 ${-h} 6 ${-h+13} 17 0Z` :
    seed%3===1 ? `M-13 0V${-h+20}L0 ${-h} 13 ${-h+20}V0Z` :
    `M-17 0-8 ${-h*.42}-13 ${-h*.38} 0 ${-h} 13 ${-h*.38} 8 ${-h*.42} 17 0Z`;
  landmarks+=`<path transform="translate(${x} ${y})" d="${shape}" fill="${i%2?realm.fl:realm.sk[0]}" opacity=".78"/>`;
 }
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" preserveAspectRatio="none"><defs><linearGradient id="s" x2="0" y2="1"><stop stop-color="${realm.sk[0]}"/><stop offset=".52" stop-color="${realm.sk[1]}"/><stop offset="1" stop-color="${realm.fl}"/></linearGradient><radialGradient id="g"><stop stop-color="#ffe4a5" stop-opacity=".7"/><stop offset="1" stop-color="#ffe4a5" stop-opacity="0"/></radialGradient><linearGradient id="f" x2="0" y2="1"><stop stop-color="${realm.fl}"/><stop offset="1" stop-color="#15131e"/></linearGradient></defs><path d="M0 0H800V480H0Z" fill="url(#s)"/><circle cx="${140+seed%520}" cy="115" r="118" fill="url(#g)"/><circle cx="${140+seed%520}" cy="115" r="26" fill="#ffe8b6" opacity=".87"/>${ridges(225,95,realm.sk[1])}${ridges(270,110,realm.fl)}${landmarks}<path d="M0 272Q255 225 400 249T800 251V480H0Z" fill="url(#f)"/><path d="M380 252Q550 275 459 318T581 480H173Q134 408 341 339T380 252Z" fill="#f9d399" opacity=".13"/>${ridges(517,91,'#15131e')}</svg>`;
 const image=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
 paintedRealms.set(key,image);
 return image;
}

 {n:'Ore',ic:'⛏️',t:[['Iron Scrap','🔩'],['Iron Ingot','⛓️'],['Silver Bar','🪙'],['Starsteel','💠'],['Dragon Alloy','🐲']],use:'Weapons'},
 {n:'Thread',ic:'🧵',t:[['Wool Tuft','🧶'],['Linen Spool','🪡'],['Silk Skein','🕸️'],['Moonweave','🌙'],['Dreamweave','💤']],use:'Armor'},
 {n:'Dust',ic:'✨',t:[['Pixie Dust','✨'],['Glitter Pinch','💫'],['Moondust','🌕'],['Star Shard','🌠'],['Wish Essence','🔮']],use:'Charms & skills'}
];
const CT=[0,0,30,120,600,1800];          // seconds to craft ONE material of tier 1..5 (tier 1 is found, not crafted)
const FT=[30,120,600,1800,7200];          // seconds to forge a piece of gear of rarity 0..4
const CR=2, FC=3;                         // 2 lower-tier materials -> 1 higher tier; forging uses 3 of the matching tier
const SLOTCOST=[0,0,0,3000,10000];        // gold to unlock crafting slot #3, #4
function matN(f,t){return FAM[f].t[t-1]}
function mat(f,t){return S.mats[f][t-1]}
function fmtT(s){s=Math.max(0,Math.ceil(s));if(s>=3600)return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';if(s>=60)return Math.floor(s/60)+'m '+(s%60)+'s';return s+'s'}
function startMat(f,t,q){if(S.jobs.length>=S.slots||t<2)return false;const need=CR*q;if(mat(f,t-1)<need)return false;
 S.mats[f][t-2]-=need;bump('craft');const now=Date.now();S.jobs.push({k:'m',f,t,q,s:now,e:now+CT[t]*q*1000});save();return true}
function startForge(sl,r){if(S.jobs.length>=S.slots)return false;if(mat(sl,r+1)<FC)return false;
 S.mats[sl][r]-=FC;bump('forge');const now=Date.now();S.jobs.push({k:'g',sl,r,s:now,e:now+FT[r]*1000});save();return true}
function collectDone(){const now=Date.now(),got=[];
 S.jobs=S.jobs.filter(j=>{if(j.e>now)return true;
  if(j.k==='m'){S.mats[j.f][j.t-1]+=j.q;got.push(`${matN(j.f,j.t)[1]} ${j.q}× ${matN(j.f,j.t)[0]}`)}
  else{const g=mkGear(j.sl,j.r);const ok=addGear(g);got.push(`${g.ic} ${g.n}${ok?'':' (bag full, salvaged)'}`)}
  return false});
 if(got.length)save();return got}
function rushJob(i){const j=S.jobs[i];if(!j)return;const c=Math.ceil((j.e-Date.now())/6000);if(S.gold<c)return;S.gold-=c;j.e=Date.now();save()}
function rushCost(j){return Math.max(0,Math.ceil((j.e-Date.now())/6000))}
function buySlot(){const c=SLOTCOST[S.slots+1];if(S.slots>=4||S.gold<c)return;S.gold-=c;S.slots++;save()}
function matTier(n){const w=[70,22,6,1.6,.4].map((x,i)=>x*(1+i*eff(n)/40));const t=w.reduce((a,b)=>a+b,0);let x=Math.random()*t;for(let i=0;i<5;i++){x-=w[i];if(x<0)return i+1}return 1}
function dropMats(n){const s=stIn(n),mult=isRealmEnd(n)?4:s===AREA_STAGES?3:s===5?2:1,out={};
 for(let f=0;f<3;f++)for(let k=0;k<mult;k++){const t=matTier(n),q=t===1?1+Math.floor(Math.random()*3):1;S.mats[f][t-1]+=q;const key=f+'-'+t;out[key]=(out[key]||0)+q}
 return Object.keys(out).map(k=>{const [f,t]=k.split('-').map(Number);return `${matN(f,t)[1]} ${out[k]}× ${matN(f,t)[0]}`})}
const upMat=g=>({f:g.s,t:Math.min(5,Math.floor(g.lv/2)+1)});
const skMat=rk=>({f:2,t:Math.min(5,rk+1)});

/* ---------- stages ---------- */
function eff(n){return n<=30?n:30*Math.pow(n/30,.64)}
function eScale(n){n=eff(n);return (1+.2*Math.pow(n-1,.79))*Math.min(1,.55+.07*(n-1))}
function spUnlocked(n,boss){return boss?2:(n<4?0:n<12?1:2)}
function enemyCount(n){return n<=10?1:n<=25?2:n<=50?3:4}
function stageEnemies(n){
 const r=mulberry(n*7919+13);
 const s=stIn(n),aIn=areaIdx(n)%AREAS_PER_REALM;
 const count=Math.max(1,enemyCount(n)-((s===5||s===AREA_STAGES)&&!isRealmEnd(n)?1:0));
 const realm=realmOf(n);
 const mini=s===5,aBoss=s===AREA_STAGES,rBoss=isRealmEnd(n),boss=mini||aBoss;
 const sc=eScale(n),cf=[0,1,.8,.7,.65][count];
 const regular=realm.v.slice(0,-1);
 const pool=regular.length?regular:realm.v;
 const out=[];
 for(let i=0;i<count;i++){
  const isB=boss&&i===0;
  let d=pool[Math.floor(r()*pool.length)];
  if(isB){d=rBoss?realm.v[realm.v.length-1]:mini?pool[(aIn*2+1)%pool.length]:pool[(aIn*2+2)%pool.length]}
  const hpM=isB?(rBoss?2.8:aBoss?2.2:1.7):1;
  const ne=eff(n),ez=Math.min(1,(ne-1)/24);let hp=1.75*d.hp*sc*cf*(1+Math.min(3.2,(ne-1)*.32*ez))*hpM,atk=1.25*d.atk*sc*(.55+.45*cf)*(1+Math.min(.7,(ne-1)*.06*ez))*(isB?(rBoss?1.2:1.15):1);
  out.push({name:(isB?(rBoss?'REALM BOSS ':aBoss?'AREA BOSS ':'MINI BOSS '):'')+d.name,emoji:d.emoji,hp:Math.round(hp),atk:Math.round(atk),spd:d.spd,sp:d.sp.slice(0,spUnlocked(n,isB)),boss:isB,weak:traits(d.name).weak,res:traits(d.name).res});
 }
 return out;
}

   <progress max="${REALM_STAGES}" value="${done}" aria-label="Stages cleared"></progress></span></button>`;

function moveList(h,o){

/* ================= HUB: quests, streak, expeditions, collection, presets, farm, save tools ================= */
function dayNum(){const d=new Date();return Math.floor((Date.now()-d.getTimezoneOffset()*60000)/86400000)}
function bump(k,n){S.cnt[k]=(S.cnt[k]||0)+(n||1)}
function giveR(r){const out=[];
 if(r.g){S.gold+=r.g;out.push(r.g+'🪙')}
 if(r.t){S.tickets+=r.t;out.push(r.t+'🎟️')}
 if(r.m){const o={};for(let f=0;f<3;f++)for(let k=0;k<r.m;k++){const t=matTier(Math.max(5,S.cleared)),q=t===1?1+Math.floor(Math.random()*3):1;S.mats[f][t-1]+=q;o[f+'-'+t]=(o[f+'-'+t]||0)+q}
  Object.keys(o).forEach(k=>{const [f,t]=k.split('-').map(Number);out.push(`${o[k]}× ${matN(f,t)[0]}`)})}
 if(r.gear){for(let i=0;i<r.gear;i++){const g=mkGear(Math.floor(Math.random()*3),gearRarity(Math.max(10,S.cleared),r.gmin||1));addGear(g);out.push(g.ic+' '+g.n)}}
 save();updHud();return out.join(', ')}
/* ---- quests ---- */
const QPOOL=[
 {k:'win',goal:4,txt:'Win 4 battles'},{k:'win',goal:8,txt:'Win 8 battles'},{k:'boss',goal:1,txt:'Defeat a boss'},
 {k:'craft',goal:2,txt:'Start 2 material crafts'},{k:'forge',goal:1,txt:'Forge a piece of gear'},
 {k:'upG',goal:2,txt:'Upgrade gear twice'},{k:'upS',goal:1,txt:'Rank up a skill'},{k:'exp',goal:1,txt:'Complete an expedition'}];
const WPOOL=[{k:'win',goal:40,txt:'Win 40 battles'},{k:'boss',goal:8,txt:'Defeat 8 bosses'},{k:'craft',goal:12,txt:'Start 12 material crafts'},
 {k:'forge',goal:5,txt:'Forge 5 pieces of gear'},{k:'upG',goal:10,txt:'Upgrade gear 10 times'},{k:'exp',goal:6,txt:'Complete 6 expeditions'}];
function ensureDaily(){
 const d=dayNum(),w=Math.floor((d+3)/7);
 if(!S.daily||S.daily.day!==d){const r=mulberry(d*131+7),pool=QPOOL.slice(),q=[];
  const first=pool.splice(Math.floor(r()*2),1)[0];q.push(first);
  while(q.length<4){const i=Math.floor(r()*pool.length),p=pool.splice(i,1)[0];if(!q.some(x=>x.k===p.k))q.push(p)}
  S.daily={day:d,q:q.map(x=>({k:x.k,goal:x.goal,txt:x.txt,base:S.cnt[x.k]||0,done:0})),chest:0}}
 if(!S.wk||S.wk.week!==w){const r=mulberry(w*977+3),pool=WPOOL.slice(),q=[];

/* ================= story: realm chapters, villain intros, hero tales ================= */
/* ---- story + profile data ---- */
const BEATS=[["The Torn Page", "Mother Goose's Book bleeds black ink, and one page has already vanished. Her note reads: \"Find the Reader.\" That is you. Little John, quarterstaff in hand, is waiting at the oak."], ["Green Beginnings", "Little John leads you down a deer path. \"The Sheriff has always taxed us thin,\" he mutters, \"but lately he does it smiling. Sheriffs should not smile that much.\""], ["Ink on the Ledger", "A tax ledger lies in the ferns, and its ink is wrong: thick, wet, and writing itself. Every line ends with the same three words. \"Forever, and ever, and ever.\""], ["The Archers' Toll", "The Sheriff's archers hold the road with polished smiles and sharpened shafts. They do not want your gold. They want you to stop walking, which is worse."], ["Tax Collector at the Bridge", "The Tax Collector has made himself a toll-booth and a throne. \"Pay what you owe,\" he purrs. His ink-black ledger says you owe everything, and he has the receipts."], ["A Stranger Called Much", "A miller's son tumbles out of a sack of flour, grinning through the dust. \"I have been following you since the oak,\" Much says. \"You looked like someone who needed snacks.\""], ["Whispers in the Hollow", "Deep in Sherwood the trees lean in to listen. Something inked is whispering to the Sheriff's men: \"I will write you the ending where you win.\""], ["Will's Red Coat", "A flash of scarlet cuts down a ridge. Will Scarlet drops from a branch, sword bright. \"Late as usual,\" he tells the dawn. \"You look useful. Follow me, quietly.\""], ["Hungry Mile", "The villages along the south road have been squeezed empty. Pots hang cold, and children watch you pass with serious eyes. Little John leaves half his bread on a doorstep."], ["The Hound of Nottingham", "The Sheriff's hound is the size of a pony and the temperament of a toothache. Black ink drips from its jaws. It has been told this is the last chase it will ever have."], ["Outlaw's Rest", "Hidden beneath the great oak, the camp wakes up around a small fire. Alan-a-Dale tunes a lute and hums your name into a rhyme. You have friends. It is a start."], ["Songs Against the Crown", "Alan sings of the Sheriff in verses so rude the squirrels blush. Far away, a ledger bursts into black flame, and the Sheriff's smile slips for one tiny moment."], ["The Friar's Larder", "Friar Tuck guards a larder like a fortress, though he happily shares it with the hungry. \"Charity first,\" he says, then adds, \"and second helpings, for morale.\""], ["A Trap in the Greenwood", "Rope snares and pit traps ring the old road. Someone is hunting outlaws with a tidy plan, and it follows Little John's own habits a little too closely."], ["The Sergeant's Wall", "The Sergeant-at-Arms has bricked up the road with shields and stubbornness. He believes the ending is already written: wall stands, outlaws fall. He has not met you yet."], ["Marian's Warning", "Maid Marian slips out of Nottingham in a pilgrim's cloak. \"The Sheriff has stopped counting coins,\" she warns. \"He is counting pages. Somebody gave him a book.\""], ["Under the Great Oak", "The camp gathers in the roots of the oak to hear what Marian has learned. The Sheriff's Book is not a ledger at all. It is a page torn from Mother Goose."], ["Arrows Like Rain", "At noon, a hundred arrows darken the sky. Little John raises his staff, Will raises his sword, and you raise your voice. Somewhere, Robin Hood's laughter answers from the trees."], ["The Sheriff's Messenger", "A captured courier carries a letter sealed in black wax. It promises the Sheriff a story where no outlaw ever wins again. The signature is only a spreading blot."], ["Gisborne Rides", "Guy of Gisborne rides out at dusk with ink-dark spurs, hunting anyone who has ever cheered for Robin. His horse is nervous. His smile is not. Both are new."], ["Sir Richard's Gate", "Sir Richard at the Lee opens his castle gates in defiance, hides forty outlaws in the cellars, and serves them his best wine. \"Debts,\" he says, \"are for repaying kindly.\""], ["King of the Forest", "A hooded figure stands at the forest's heart with a bow in one hand and an apple in the other. Little John kneels. \"Told you he was real,\" whispers Much."], ["The Prince of Thieves", "Robin Hood grins like a man who has been waiting for the right company. \"Reader,\" he says, \"I read your arrival in the leaves. Shall we rob a Sheriff?\""], ["Nottingham at Night", "You slip through the sleeping town beneath a cloudless moon. Every shutter is closed, but every window glows. The Sheriff's tower beats like a black, patient heart."], ["Last Warning", "The Archer-Captain takes his stand where the forest ends and Nottingham begins. \"Turn back,\" he says. His voice shakes, and the ink on his bowstring ripples."], ["The Black Tower", "The Sheriff's tower rises from the ink like a quill from a well. The doors yawn open. Robin tips his hat. \"After you,\" he says, entirely sincere."], ["Ledgers Burn", "In the Sheriff's tower the ledgers smoke and twitch like trapped insects. Every page you tear loose screams once in a very small voice. Robin pockets a page. \"Evidence,\" he says."], ["The Gambit", "Robin lays out a plan on a barrel: a feast, a feint, a rope, an apple. It is the most ridiculous plan in Sherwood. Little John pronounces it perfect, which is not reassuring."], ["A Quiet Moment", "Before the last stair, the outlaws share a flask. Little John tells a bad joke, Much laughs too hard, and Will pretends not to. You realize you are afraid, and glad of company."], ["The Throne of Ledgers", "The great doors open. The Sheriff sits upon a throne of stacked ledgers, smiling at a page that reads \"The End\". \"I was promised a better ending,\" he says. \"Allow me to demonstrate.\""], ["A Round Table, Cracked", "Camelot's towers rise in gold and mist, and the Round Table, the pride of the realm, has a black crack running through it. Merlin traces it with a trembling finger."], ["The Horn at Dawn", "Every dawn the horn sounds, and every dawn it sounds a little flatter. Sir Kay greets you at the gate with a grumble. \"Somebody has to be grumpy about it.\""], ["What Bedivere Remembers", "Sir Bedivere sits by the lake, still holding the scabbard he never gave back. \"There was a voice,\" he says, \"offering the king a shorter ending. Arthur said no.\""], ["Saxon Smoke", "Raiders burn the border farms, but the fire is oddly neat, as if drawn with a ruler. Their chieftain keeps a page tucked in his belt and mutters from it."], ["The Black Knight at the Ford", "The Black Knight stands at the ford and will not yield. His armor is dented, hacked, and still standing. \"'Tis but a scratch,\" he says. It is not a scratch."], ["Gawain's Challenge", "Sir Gawain rides to greet you at noon, strong as the sun. \"Someone is cutting the realm into chapters,\" he warns. \"He leaves the endings off. Let us find him.\""], ["Percival's Question", "Young Percival wanders in, wide-eyed. \"The Grail castle is blank,\" he says. \"No hall, no king, no wound. Only white paper and one enormous question.\""], ["Merlin Reads Ahead", "Merlin lives backward through time, and tonight he is quiet. \"I have read this part,\" he says. \"I do not like how it ends. Let us change it.\""], ["The Lady in the Lake", "From the still water a white arm rises, and a voice asks a gentle question: \"What do you want to be when the story is over?\" Nobody has answered it in years."], ["The Hound of Morgause", "Morgause's hound breaks from the mist, as white as parchment and twice as sharp. It snaps at your map. It does not want you to find the way. That is how you know."], ["Guinevere Holds Court", "Queen Guinevere holds court with unflinching grace. \"We are not lost,\" she tells you. \"A table with a crack can still hold supper, so long as we hold it together.\""], ["Lancelot's Shadow", "Sir Lancelot has not slept in three nights. A dark twin follows him through every hall, wearing his armor and his regrets. \"Do not help me,\" he says. \"Help Arthur.\""], ["Fog Over the Marshes", "Fog hides the marsh road, and something walks in it. Each step you take is a sentence that someone has already crossed out. Keep walking, says Percival, and write your own."], ["A Squire's Sword", "A squire presses a plain sword into your hands. \"Arthur said,\" the boy whispers, \"that the best sword is the one held with a steady heart.\" It fits, which is unsettling."], ["The Bog Hag's Stew", "A bog hag brews a stew of lost lines and borrowed ink. \"Take a ladle,\" she cackles. \"Every bite makes your ending shorter and your belly fuller.\" You decline. Politely. Firmly."], ["Galahad's Light", "A knight in white rides through the dark, and ink slides off his armor like rain. \"I did not find the Grail,\" Galahad says softly. \"It found me. Be gentle with it.\""], ["Mordred's Quiet Court", "Mordred holds a second court in the north tower, polite and silent. His lords wear identical silver and speak identical lines. \"A tidy kingdom,\" he smiles, \"is a short one.\""], ["Morgan's Mirror", "Morgan le Fay keeps a mirror that shows the ending you want. It is warm, golden and entirely hollow. She turns it toward you slowly. \"Tell me it isn't tempting.\""], ["The Cracked Mirror", "You look away, and the mirror splinters, every shard showing a different world. Morgan hisses. Merlin smiles, slow and sad. \"They never forgive being refused.\""], ["The Silver Guard", "Mordred's guard bars the north stair in matched silver, ink in their veins. The captain salutes without blinking. \"Orders are orders,\" he says, and his eyes plead otherwise."], ["Knights of the Round Table", "One by one the knights find their chairs: Gawain, Percival, Galahad, Kay, Bedivere. Even Lancelot comes in from the cold. Twelve seats are filled. One is waiting."], ["The Sword in the Stone", "The sword waits in its stone, humming faintly. Arthur does not pull it. He asks you. \"I think,\" says the king, \"this one was always meant for the Reader.\""], ["Arthur's Choice", "King Arthur kneels beside you and speaks softly. \"A voice has promised me peace if I stop. I have thought on it a long time, and the answer is still no.\""], ["The Last Cavalcade", "At twilight the knights ride out together, banners bright, hooves like thunder. Behind them, the crack in the Round Table closes by a hair's width. Just enough to hope."], ["The Raiders' Last Fire", "The last Saxon raiders make camp on the ridge, huddled around a fire that burns blue. \"He promised us the ending where we win,\" their chieftain mutters. He does not sound sure."], ["Camlann, Early", "The final battle arrives early and by the wrong author. Two armies meet in a field of blank pages. Arthur raises Excalibur. Across the field, a lady in green raises a quill."], ["The Fairy Queen", "Morgan le Fay steps into the open, dressed as a sunrise. \"I only want to end the pain,\" she says. \"Is that so terrible? Look at all this sorrow. Wouldn't you rather read nothing?\""], ["Merlin's Reply", "Merlin plants his staff. \"Pain is the price of a story worth reading,\" he says. \"I would know. I have read them all, backward.\" The ground trembles. The ink recoils."], ["Avalon's Edge", "The mist parts on a still lake, and the Lady waits with a scabbard in her palm. \"Whatever you do,\" she says, \"do not let her tell you that you are alone.\""], ["Morgan le Fay", "Morgan rises in black silk and quicksilver, a thousand mirrors turning behind her. \"One last choice, Reader,\" she says. \"The ending you deserve, or the one I wrote.\" She draws."], ["Late for Everything", "The White Rabbit is late. He is always late, and today he is later than ever. \"The Queen is writing us all out,\" he gasps. \"Quickly, quickly, down the hole!\""], ["Falling Slowly", "You fall for an hour or an afternoon, past clocks and cupboards and a jar labelled \"MARMALADE (EMPTY)\". Alice is somewhere below, tying her shoes, utterly unbothered."], ["Alice, Curiouser", "Alice meets you at the bottom with a polite nod. \"Wonderland isn't what it was,\" she says. \"Everything makes sense now, and that is dreadfully wrong. Please help me unmake it.\""], ["Playing Card Patrol", "Card soldiers march in perfect lines, painting roses red with brisk, unhappy strokes. \"Orders,\" they say. \"Always orders.\" One pauses, looks at you, and quietly drops his brush."], ["The Knave and the Tarts", "The Knave of Hearts keeps a tray of tarts and a very bad alibi. \"I did not steal them,\" he insists. His pockets are full of jam. His heart is full of ink."], ["The Dormouse Wakes", "The Dormouse yawns inside a teapot. \"Somebody wrote,\" he mumbles, \"that nobody sleeps until the story ends. Is it over yet?\" It is not. He goes back to sleep."], ["Mad Tea Party", "The Hatter and the March Hare have been having tea since six o'clock. It is always six o'clock. \"A stopped clock has no ending,\" says the Hatter. \"I recommend it.\""], ["The March Hare's Diary", "The March Hare keeps a sock full of buttons and a diary full of nonsense. Between the lines, in tidy black ink, someone has been rewriting his jokes into tidy sorrow."], ["Cheshire Smiles", "The Cheshire Cat's grin floats above a bough, and the rest of him follows when he is ready. \"I know who is writing this,\" he purrs. \"He is lonely, and very good.\""], ["The Duchess's Kitchen", "The Duchess's kitchen is all pepper and pigs. She tosses a baby your way, which turns out to be a pig, which is at least an improvement. She sneezes. The kitchen sneezes back."], ["Caterpillar's Question", "The Blue Caterpillar blows a smoke ring and asks: \"Who are you?\" It is a harder question than it sounds, especially while the ink is trying to answer for you."], ["Who Are You?", "You answer honestly: \"The Reader.\" The smoke ring becomes a butterfly. \"Then you are the one thing,\" says the Caterpillar, \"that can't be edited.\" He yawns. He means it kindly."], ["The Royal Garden", "The Queen's roses are painted red, and some of the paint is not paint. Alice kneels beside a bush. \"It's only a garden,\" she says. \"Let us give it back.\""], ["The Gryphon Dances", "The Gryphon takes your hand, rocks back on his heels and teaches you a lobster quadrille. It is the first dance in the realm that nobody has written for him."], ["The Executioner's Dilemma", "The Executioner stands with an axe and a problem. \"How do you cut off a head with no body?\" he asks. The Cheshire Cat has made him think very hard about it."], ["A Game of Croquet", "Hedgehogs for balls, flamingos for mallets, and the Queen's temper for referee. Winning is impossible. Losing is worse. Alice, calmly, plays the game her own way."], ["The Mock Turtle's Tale", "The Mock Turtle weeps over a tale nobody told right. \"It had an ending,\" he sobs. \"A long one. They took it and gave me soup instead.\" Soup, it turns out, is not enough."], ["Trial Without Evidence", "The Queen's court is in session. The jury is twelve confused animals and a lizard, and the evidence is a sealed black letter signed only with a blot. Alice rises to object."], ["Verdict First", "\"Sentence first,\" shrieks the Queen, \"verdict afterward!\" Alice calls it nonsense. The court gasps. Nonsense is the Queen's own language, and this is the first time she has heard it flattered."], ["The Bandersnatch", "A frumious Bandersnatch crashes through the hedges, jaws snapping, fur a patchwork of torn Wonderland pages. \"He has been unmade,\" Alice whispers, \"and badly. Please, be gentle.\""], ["Tweedle Interlude", "Tweedledum and Tweedledee emerge from the hedges arguing about a rattle. The rattle turns out to be a very small crow. The crow turns out to be a very large problem."], ["The Duchess Rages", "The Duchess storms into court and sneezes pepper across the gallery. \"Everybody out!\" she bellows. Everybody stays. For the first time in Wonderland, nobody listens to her."], ["The Last Teacup", "The Hatter hands you a single cup. \"The last pour,\" he says. \"When the pot is empty, the party ends, and I do not know what happens to hatters then.\" You drink. It tastes like courage."], ["Alice Stands", "Alice stands in the center of the court and looks the Queen in the eye. \"You are nothing but a pack of cards,\" she says quietly, and every card in the deck shivers."], ["The Painters' Revolt", "The card soldiers throw down their brushes. One by one, they stand and salute you with trembling hands. The last of them winks. \"Always wanted to hold the white paint,\" he whispers."], ["The Queen's Temper", "The Queen swells until the chandeliers ring. \"OFF WITH THEIR HEADS!\" Black ink pours from her crown and puddles across the floor. The court flees. Alice stays, shoulders square."], ["Nonsense Armor", "The Cheshire Cat rolls his grin into the air. \"Nonsense is armor,\" he purrs, \"and you have never been better dressed.\" The Hatter, the Hare and the Dormouse form up beside you in teacup helmets."], ["The Rose Maze", "The rose maze twists. Every turn reads a different line of the Blot's script. Alice, laughing, walks straight through the hedge. \"It is only a maze if you obey the walls.\""], ["A Queen Alone", "The Queen waits at the center of the maze, shrunk to the size of a child. \"I only wanted,\" she whispers, \"the story to finish nicely.\" Alice offers her a handkerchief. \"So did we all.\""], ["The Queen of Hearts", "The Queen swells again, red and furious, a thousand cards roaring behind her. \"OFF WITH THEIR HEADS!\" she screams. Alice tucks her chin. \"Not today, Your Majesty.\""], ["The Other Side", "The mirror lets you through with a sigh. Everything is backward: the clocks, the trees, the quiet fear in the White Knight's eyes when he finds you."], ["Chessboard Country", "The land is a great chessboard, hedgerows for lines, brooks for ranks. The pieces move on a script nobody can read. One pawn weeps. Another pretends not to."], ["Humpty's Wall", "Humpty Dumpty perches on his wall, thinking very hard about the word \"ending.\" \"It means,\" he decides, \"whatever I say it means. And I say it means nothing at all.\""], ["The Garden of Live Flowers", "Tiger-lilies bow and gossip as you pass. \"Another walker,\" says a rose. \"They never stay. Only the ones who are written in stay.\" You stay anyway, quite deliberately."], ["The Jubjub Bird", "The Jubjub Bird shrieks from the branches, wings ink-black. It has been told its song is the last the world will hear, and it is singing it very, very badly."], ["A Mirror Reads Back", "You peer into the glass and see yourself reading. You wave. Your reflection does not. It looks up from the page, and for a long moment you cannot tell who is who."], ["The White Knight's Horse", "The White Knight falls off his horse for the fifth time and cheerfully climbs back on. \"Every ending is a falling,\" he says. \"Every beginning is getting up again.\""], ["Tulgey Wood", "The Tulgey Wood is dark and the path is crooked. The trees whisper a nonsense poem. You find, to your surprise, that the nonsense makes it easier to walk."], ["Reading Backward", "The signs in the glass read backward, and so does the Blot's writing. Run a finger along the wall and the ink says: \"THE END IS THE ONLY KIND THING.\""], ["The Walrus Thief", "The Walrus weeps and munches oysters, talking of cabbages and kings. He has also stolen every shoe in the realm. \"The time has come,\" he sniffles, \"to talk of boots.\""], ["The Carpenter's Bread", "The Carpenter butters bread thick and thin while the Walrus sobs. They are the kindest villains in the realm, and the saddest. They want to be told how the story ends."], ["White Queen's Memory", "The White Queen remembers tomorrow and forgets today. \"I scream before I'm pricked,\" she says. \"It saves time.\" She presses a ticking jam jar into your hand. \"Jam tomorrow.\""], ["The Lion and the Unicorn", "The Lion and the Unicorn fight for the crown all around the town. Neither has a crown. Neither remembers who wanted it. The fight, grimly, goes on."], ["The Red Pawn Patrol", "The Red Pawns march in rows, one square at a time, singing a song with no chorus. They don't know what they are marching toward. Neither, honestly, does the chess game."], ["The Red Bishop's Sermon", "The Red Bishop delivers a sermon so long that nobody remembers the beginning. \"And thus,\" he concludes, \"everything must end in checkmate.\" His congregation, politely, disagrees."], ["A Knight Without a Horse", "The Red Knight charges, and the White Knight charges, and the board shakes with their determination. Neither wins. \"It's called a stalemate,\" Alice whispers. \"It is the only kind ending.\""], ["Alice, Again", "Alice appears across a brook, a queen's crown slightly crooked on her head. \"In this place,\" she says, \"I'm a pawn trying to be a queen. I hope you'll cheer for me.\""], ["The Glass Library", "Beyond the chessboard a library of mirrors stretches into forever. Each mirror holds a page. Each page holds a reader. And at the end, one empty chair waits, facing you."], ["A Different Reflection", "The reflection in the last glass wears your face, but its eyes are inky. \"I'm what comes after,\" it says. \"I'm only the tail of the story.\" It smiles. It is almost kind."], ["The Red Knight's Charge", "The Red Knight breaks his lance on your shield and laughs, wild with relief. \"At last,\" he cries, \"a move I didn't see coming!\" He does not seem to mind losing."], ["The Voice in the Ink", "A voice speaks from every mirror at once, mild and amused. \"You've come a long way,\" says the Blot. \"I was only trying to help. Endings are a mercy, you know.\""], ["You Are Not Written", "\"I am not on your page,\" you say, and the glass cracks. The Blot's voice thins. \"Nobody is unwritten,\" it whispers, \"who has not been read. Think about that, Reader.\""], ["Queening a Pawn", "A small pawn finally reaches the far side of the board and is crowned a queen. She looks at you, stunned. Nobody told her it would work. Nobody told her it could."], ["The Red Queen's Race", "The Red Queen runs and runs and stays in the same place. \"Faster!\" she cries. \"It takes all the running you can do to stay where you are!\" She looks at you, exhausted. \"Stay.\""], ["The Last Pawn", "One pawn guards the bridge to the Jabberwock's wood, arms trembling. \"I was told to stop you,\" he says, and drops his spear. \"I'd rather not. Is that allowed?\" It is."], ["Jabberwocky", "You walk into the wood where the Jabberwock waits. Alice recites the poem from memory. Behind you the trees twist into verses, each rhyme a little stronger than a sword."], ["The Vorpal Blade", "The vorpal blade rests in a stump, waiting. You lift it, and it sings. It does not want to kill. It wants to cut through the one thing the Blot cannot bear: a clean line."], ["Checkmate in Zero", "The final move is written in the air: \"White to win in zero moves.\" The Red Queen faces you across the board, and the pieces freeze. She is, in her way, pleading."], ["The Lair", "Beyond the Tulgey Wood a cave yawns, and from its depths comes a burbling that is half laugh and half roar. The Jabberwock has been waiting, with eyes of flame."], ["The Jabberwock", "The Jabberwock bursts out, jaws and claws and eyes of flame. \"One, two!\" whispers Alice. \"One, two! And through and through!\" The vorpal blade hums in your hand."], ["Window to Neverland", "You tumble out of a nursery window into a sky full of stars. Wendy's brothers wait on the sill, shoes untied, hearts racing. The island below glows like a lantern."], ["Peter's Promise", "Peter Pan lands on the windowsill in a puff of pixie dust. \"You came!\" he says. \"Good. Hook's been trying to end things. I don't like endings. Do you like endings?\""], ["The Lagoon at Midnight", "The Mermaid Lagoon shimmers under the moon. Mermaids sing from the rocks, but the song is wrong. It rises and falls and then, abruptly, stops, as if it were being edited."], ["Tootles Takes Aim", "Tootles steps out of the brush with a slingshot and a grin. \"I never hit anything,\" he says, \"except when it matters.\" A pirate deckhand falls out of a tree, groaning."], ["The Pirate Cook", "The Pirate Cook has wrapped a feast in a net and left it for the Lost Boys. It is entirely poisoned. It is also, unfortunately, delicious. Wendy rescues the pie with her best scolding."], ["Lost Boys' Hideout", "The Lost Boys live in a hideout under a tree, packed in like marbles in a pouch. They share their last biscuit with you. Slightly offers his foxskin, solemnly. You have never been so honored."], ["Tiger Lily's Trail", "Tiger Lily crouches in the grass, silent as a heartbeat. \"I will show you the quickest way to the ship,\" she says, \"if you promise Hook will not like the surprise.\""], ["Smee Reads the Map", "Mr. Smee stitches the Captain's coat and sighs. \"He's been writing something,\" he whispers. \"I think he wants to stay forever. I don't think that's a nice ending.\""], ["Wendy's Story", "Wendy tells the Lost Boys a story, soft as a blanket. For a moment, the ink on the walls stops moving. \"A story only needs one listener,\" she says. \"Isn't that wonderful?\""], ["The Crocodile Ticks", "Somewhere in the lagoon, a clock is ticking. It is a very large clock, and it has teeth. The Crocodile glides closer, mouth open, ticking in time with your heartbeat."], ["The Shadow Thief", "Peter's shadow slips loose and wanders off to chat with the pirates. \"It does that,\" Peter sighs. Wendy sews it back, stitch by careful stitch. \"Hold still,\" she says. It does."], ["Pirate Deckhands", "Hook's deckhands swarm up the beach, cutlasses gleaming, shouting orders from a book. Their shirts are inked with the same three words: \"The End Nigh.\" They look slightly embarrassed."], ["A Fairy Falls Ill", "Tinker Bell flickers, dimming like a candle in a draught. \"She's losing her light,\" says Peter. \"It's the ink. It makes everything feel like the end.\" He claps. \"Do you believe in fairies?\""], ["Clap Your Hands", "You clap. Peter claps. Every Lost Boy claps, and every pirate, suddenly embarrassed, claps too. Tinker Bell flares to life. The ink retreats from her light like a startled cat."], ["Starkey's Ambush", "Starkey leaps from the rocks with a knife in his teeth and a promise in his eyes. You dodge. The knife thuds into a coconut. Starkey stares. \"That was a good coconut,\" he mutters."], ["Hook's Letter", "A letter drifts down from the Jolly Roger's mast. \"Dear Peter,\" it reads, \"I've found the ending. It is long and dull and I'm so tired. Come aboard and end me.\" It is unsettlingly sincere."], ["Smee's Sewing Kit", "Smee stitches your torn cloak and mutters, \"I really don't like this plan.\" He slips you a map under the thread, and a pocket knife folded inside a handkerchief."], ["The Jolly Roger Looms", "The pirate ship rises out of the fog, its sails inked with a page torn out of the Book. Hook's laugh rolls across the water. \"Come aboard,\" he calls. \"I've saved you the best seat.\""], ["Never Grow Up", "\"I don't want to grow up,\" Peter whispers on the cliff's edge. \"Not because it's scary. Because if I do, who will be me?\" You sit beside him. \"Reader,\" he says, \"that is the whole point of stories.\""], ["The Lagoon Siren", "A siren's voice floats across the lagoon, and the world slows. She sings of the last chapter, of the quiet at the end of the page. It is very beautiful. You hold your ears."], ["Board the Jolly Roger", "The gangplank creaks. The ship is quiet. Your reflection in the deck's black ink looks back at you with something like longing. Hook waits in the cabin with a cup of tea."], ["Hook's Cabin", "Captain Hook's cabin is lined with clocks, hundreds of them, all ticking to different times. \"A man,\" he says, \"should know exactly how long he has left. Mine is almost out.\""], ["Tiger Lily Strikes", "Tiger Lily drops from the rigging, knife flashing, and the pirates scatter. \"Tell Peter I'm not sorry,\" she says calmly. She winks at you. \"Also tell him I'm very sorry.\""], ["Tick-Tock", "The Crocodile drags itself aboard, ticking, hungry, loyal. \"I have followed him for years,\" Hook says tenderly. \"I think I'd miss it if it stopped. Foolish, isn't it?\""], ["The Deckhand's Confession", "The last deckhand lowers his cutlass. \"I only joined for the singing,\" he admits. \"Nobody sings anymore. They only read out the ending.\" He hums a sea shanty. Nobody stops him."], ["Peter's Gamble", "Peter stands at the bow, lit by every star. \"I won't make you fight him,\" he says, \"but I would like it if you stood next to me.\" You do. Wendy sews his shadow on one last time."], ["A Toast in the Cabin", "Hook pours three cups of tea, one for himself, one for you, one for the empty chair. \"To the ones who got away,\" he says. His voice is very small. His hook trembles."], ["Hook Rises", "Hook's hook gleams like a comma, and he draws his sword. \"A story,\" he says, \"needs a villain. I would rather it be a good one.\" He takes his stance. \"En garde, Reader.\""], ["Smee Chooses", "Smee stands between Hook and the crew. \"Captain,\" he says, \"I would like to stop now.\" Hook looks at him for a very long time. Then, very quietly, he says: \"No. But thank you for asking.\""], ["Captain Hook", "The Captain Hook of Neverland raises his blade against the setting stars. \"Come, Pan!\" he cries. \"Come, Reader! Let us write the last duel properly, and with enough flourishes to be remembered.\""], ["The Wood Goes Quiet", "The Hundred Acre Wood is hushed, and honey pots stand empty on every shelf. Pooh sits on a log with a rumbling tummy and a crooked smile. \"Something,\" he says, \"has gone missing. Mostly pages.\""], ["Bear of Very Little Brain", "Pooh puts a paw on his chin. \"If the Blot wants the story to end,\" he thinks aloud, \"then I shall simply refuse to finish my honey.\" Piglet wonders if that counts as a plan. Pooh thinks it might."], ["Piglet's Courage", "Piglet hides behind a very small tree and then, with great effort, steps out from behind it. \"I'm not afraid,\" he squeaks. He is terrified. He keeps walking. It is the bravest thing in the Wood."], ["Eeyore's Missing Tail", "Eeyore's tail has gone again, nailed to a doorbell in the one place it has never been. \"Not that anyone noticed,\" he sighs. You notice. You find it. He pretends not to be moved."], ["The Woozle's Tracks", "Round and round the pine tree go the footprints, each pair of paws a little more ink-black than the last. The Woozle slinks out, grinning. \"Are you following me?\" it asks. \"How very flattering.\""], ["Tigger Bounces In", "Tigger arrives mid-bounce and lands in a gorse bush. \"TTFN!\" he cries, and then, \"Ta ta for now, ouch.\" He is the only creature in the Wood the Blot cannot slow down."], ["Rabbit's Organisation", "Rabbit pins a timetable to a tree: Friends and Relations, 9:00. Blot-Spotting, 9:30. Elevenses, 11:00. \"Nothing falls apart,\" he says, \"if you schedule it carefully.\" His whiskers disagree."], ["Owl Explains Everything", "Owl explains the Blot in nineteen minutes and nine syllables per word. Nobody follows. But somewhere in the lecture is a very good idea, and Pooh has found it."], ["Kanga's Pocket", "Kanga pulls a bottle of malt extract from her pouch with a look that brooks no argument. Roo peeks out and giggles. \"Everything's better with a family close by,\" she says, \"and a spoon.\""], ["The Gloomy Cloud", "A small black rain cloud follows Eeyore everywhere, and today it has grown into a storm. The ink in the rain tastes of \"perhaps this is all there is\". Eeyore stands in it, steady as a stone."], ["Poohsticks", "At Poohsticks Bridge, Pooh drops a stick upstream and watches the river carry it away. \"Some things,\" he says, \"are only finished when they are let go.\" It is the wisest thing anyone has said this week."], ["Roo's Big Jump", "Roo takes a deep breath and jumps across the stream, wobbling, falling, laughing. Kanga catches him. \"Again!\" he cries. The Blot cannot touch a child who is still saying \"again.\""], ["Small and Mighty", "A very Small Animal, indeed, marches out of the leaves, shouting at a beetle. \"I may be tiny,\" he says, \"but I am the biggest thing in my own story.\" He is right."], ["Hunny Hunt", "The trail of honey leads deep into the Wood, past empty pots and ink-stained paws. At the end, a single pot sits on a tree stump, sealed with a note: \"Please share.\""], ["The Heffalump Trap", "Christopher Robin and Pooh have dug a Heffalump trap. The Heffalump has already fallen in and is eating the honey. \"He's very polite,\" Pooh says, \"for something that's meant to be terrifying.\""], ["Christopher Robin's Secret", "Christopher Robin sits very still on a log. \"I'm going away soon,\" he says. \"To school. There are rules about that.\" Pooh listens. \"I am staying,\" says Pooh. It is not an answer. It is a promise."], ["Bees in the Pot", "A swarm of bees, inked black and humming a funeral tune, drifts across the clearing. Pooh holds up a balloon. \"I am only a little black rain cloud,\" he says, and the bees lose interest."], ["Thistles for Tea", "Eeyore's thistle patch has grown into a bouncy, prickly wall that blocks the path. \"Hm,\" says Eeyore. \"I wondered what that was for.\" It is for protecting him, as it turns out."], ["The Wood Remembers", "The Hundred Acre Wood sighs, and in the sigh are all the afternoons it has ever held. A crooked sign reads: \"Back soon.\" The Blot cannot erase an afternoon that was truly enjoyed."], ["The Bouncing Thistle", "The great Thistle uncoils with a wild boing and chases you in a bouncy circle. Tigger, delighted, offers to teach it. \"The trick,\" he says, \"is the bounce, not the stop.\""], ["A Pooh-Shaped Hole", "Pooh's name begins to smear on every sign. His own shape fades at the edges. \"Oh bother,\" he says, calmly, and eats a smackerel of something to feel solid. You catch him. He is warm."], ["The Gloomy Place", "Behind the thickest thorns lies the Gloomy Place, where nothing ever happens, and the ink would like it to stay that way. Piglet takes your hand. \"I'll go if you go.\""], ["Pooh Thinks", "Pooh sits on a rock and thinks. And thinks. And thinks. \"I think,\" he says at last, \"that being sad is how you know it mattered.\" The Blot, hearing this, blinks twice and goes quiet."], ["The Last Expotition", "Christopher Robin gathers everyone for an Expotition to the very top of the Wood. \"To the North Pole!\" he shouts, and everyone, including Eeyore, follows, in a line, with sticks."], ["A Hum of Bees", "The bees hover over the Expotition, humming a tune nobody wrote. It rises, falls, rises again. Little by little, the black fades from their wings, and gold comes seeping back."], ["Goodbye, Christopher Robin", "Christopher Robin kneels beside Pooh. \"I have to go,\" he says. \"Will you remember me?\" Pooh thinks very hard. \"I'll remember what we did. And you will remember what we were.\""], ["A Very Small Brain", "The ink swirls around Pooh like a cold wind. \"Forget him,\" it whispers, \"and you will never be sad.\" Pooh hugs a honey pot. \"I would rather be sad,\" he says, \"than be a bear who forgot.\""], ["Piglet Stands Up", "Piglet raises a hoof against the swirling dark, trembling from ears to tail. \"I'm Piglet,\" he shouts, \"and I live here!\" The whole Wood echoes with applause. The ink retreats a step."], ["The Great Backson", "From the shadow of the pines a huge figure rises, footprints turned backward, claws of ink. \"He is the Great Backson,\" Rabbit whispers, \"and he is mostly a rumor.\" It is a very large rumor."], ["The Great Backson Returns", "The Great Backson roars, made of every worry a child has ever had about growing up. Pooh offers it a honey pot. \"Is it nice here?\" he asks gently. \"Or are you just afraid of being left?\""], ["Poop-Poop", "A motorcar bursts through the hedge, scattering ducks. Mr. Toad leaps out in goggles and a flapping coat. \"Toad Hall has been invaded!\" he cries. \"Weasels! Stoats! Ferrets! Everything with a tail and a grievance!\""], ["The River Bank", "Ratty rows you down the glittering river, humming. \"Nothing,\" he says, \"is half so much worth doing as simply messing about in boats.\" The river keeps its own counsel, and its own ink."], ["Mole Above the Ground", "Mole squints in the sunshine, wearing a hat he found in a hedge. \"I left my spring cleaning,\" he says, \"for this. Is it always so... enormous out here?\" Ratty pats him. \"You get used to it.\""], ["Otter's Splash", "Otter surfaces with a fish and a grin. \"The Wild Wood is full of stoats,\" he reports cheerfully. \"They've been practicing the same menacing laugh for days. It's terrible. I love it.\""], ["The Weasel Sentry", "A Weasel Sentry guards the lane to Toad Hall with a pointed spear and a pointed sneer. \"Nobody gets in,\" he says, \"until the story's finished.\" He doesn't seem to know which story."], ["Badger's Door", "Deep in the Wild Wood, Badger's door is a round, solid thing with a bell. \"I do not like visitors,\" he rumbles, and then, \"Come in. There's soup.\" The Wild Wood, for once, is silent."], ["A Warm Kitchen", "Badger's kitchen is all firelight and flagstones and worn armchairs. Over bowls of stew, he tells you of the Wild Wood's ancient trouble. \"We were here before the ink,\" he says. \"We will be here after.\""], ["Mole Remembers", "Mole stops, nose twitching. Somewhere nearby, a cherished little home is calling. \"Mole End,\" he whispers. \"Oh, I could smell it from here.\" The ink creeps up the path behind him. He bolts."], ["The Gaoler's Daughter", "The Gaoler's Daughter leaves a basket outside the cell, with soup, a file, and a note that says only, \"Don't be a toad about it.\" Toad is, naturally, a toad about it. But he escapes."], ["The Ferret Bruiser", "A huge ferret blocks the bridge, cracking his knuckles. \"You'll never cross,\" he says. \"I was promised the ending where the bridge stays closed.\" Ratty smacks him with an oar. The bridge, subtly, opens."], ["Toad's Disguise", "Toad turns up in a washerwoman's bonnet, utterly convinced no one will recognize him. Everybody does. Nobody says so. \"I do admire a good costume,\" says Ratty, and winks at you."], ["The Barge Woman", "A barge woman gives you a lift on a slow canal, and a good deal of tea. \"I met a toad on this very water,\" she says. \"I don't recall how it ended. Nobody ever does, for toads.\""], ["The Open Road", "Toad drives you, giddy, down the open road. \"Poop-poop!\" he shouts. \"The world is a fine place, and I'd like to see it all before I am written out.\" His horn echoes, brave and silly."], ["The Wild Wood Trembles", "Something prowls the Wild Wood's edge. Eyes in the dark. Whispers in the leaves. \"Don't go in alone,\" says Ratty. Mole, trembling, takes your hand. \"I'll be less alone,\" he says, \"if you hold on.\""], ["The Gaol Warden", "The Gaol Warden has a ring of keys and a face like an unopened letter. \"I don't make the rules,\" he says. His keys are black with ink. They jingle, as if unsure. \"I only keep the endings.\""], ["The Piper's Song", "From the island in the river comes a pipe, softly, like the first light of morning. The Wild Wood hushes. Otter weeps. For a moment, the Blot is nothing but a grey, embarrassed stain."], ["Sea Rat's Offer", "A weathered Sea Rat sits on a pier, spinning tales of faraway ports. \"Come with me,\" he says to Ratty, \"and see the great beyond.\" The ink in his words tastes like the end of every home."], ["Ratty Almost Goes", "Ratty stands at the edge of the river, pack on his shoulder, eyes distant. \"The south calls,\" he whispers. Mole steps beside him. \"So does home,\" he says. They stand there a long time."], ["A Poem for Ratty", "You recite a verse about the river and its patient, ordinary joys. Ratty blinks and sets down his pack. \"Dash it,\" he says, wiping his eyes. \"That's the best poem I've ever heard.\""], ["The Fox in the Wild Wood", "A red fox pads out of the undergrowth, thoughtful, tidy, deadly. \"I've been told you are a threat,\" he says. \"You look more like a confused picnic.\" His smile is worse than his teeth."], ["Toad Hall in Shadow", "Toad Hall looms ahead, windows black, banner torn, chimneys smoking. The weasels have been eating the pantry for weeks. Toad stands at the gate, small and silent for the first time in his life."], ["The Secret Tunnel", "Badger leads you through a secret tunnel beneath Toad Hall. \"I have kept this passage for a century,\" he whispers, \"for a day I hoped would never come.\" He pulls a lantern from the dark. \"Quietly.\""], ["Banquet Hall", "The tunnel opens beneath the weasels' banquet. Candles, crystal, ink in the soup. Nobody sees you creep in. Toad, bursting with pride, quietly puts a flowerpot on the wrong head."], ["Mole's Courage", "Mole raises a tiny cudgel and charges, squeaking. The stoats stare. A very small mole, in a very large hat, is the most frightening thing they have ever seen. The hall erupts."], ["Stoat Guard Falls", "The Stoat Guard drops his spear and sits down. \"I only wanted a home,\" he sighs. \"The Blot said Toad Hall was empty.\" Ratty hands him a biscuit. \"It never is,\" he says. \"Come in.\""], ["Toad's Confession", "Toad climbs onto a table and, for the first time in anyone's memory, speaks sincerely. \"I'm vain,\" he says, \"and silly, and I'd like to apologize. And now, I'd like a better ending.\""], ["The Weasel Parliament", "The weasels hold council, and the Chief Weasel stands at the head of the table. He is old, tired and furious. \"We were told,\" he says, \"there'd be nothing left to lose. Who told you that?\""], ["The Chief's Grievance", "The Chief Weasel lays out a long list of every slight the Wild Wood ever did him. You listen to all of it. It takes an hour. When it is over, you say, \"That sounds awful.\" He sobs."], ["Dawn at the Gates", "A pale dawn lights the Hall's high windows. The air smells of bread and wet grass. For a moment, even the weasels look hopeful. Then the Chief steps forward, ink pouring from his sleeves."], ["The Chief Weasel", "The Chief Weasel draws himself up, a hundred years of grievance behind him. \"I will not be written out,\" he snarls. \"Not again.\" You understand him entirely. You raise your hands anyway."], ["Mr. McGregor's Gate", "A small blue jacket flashes under a garden gate. Peter Rabbit looks back, whiskers twitching. \"Mr. McGregor's after me,\" he pants. \"And something else, too. Something that writes in ink.\""], ["The Cabbage Patch", "Rows of cabbages stretch away in perfect green order. A single pencilled arrow points under the lettuces. Someone has been here, leaving instructions in a hand you almost recognize."], ["Flopsy and Mopsy", "Flopsy and Mopsy are picking blackberries and frowning at the ink. \"It tastes of nothing,\" says Mopsy. \"That's the worst part,\" says Flopsy. \"Everything the Blot touches is perfectly bland.\""], ["A Letter in the Lettuce", "A small folded note hides among the lettuces. It reads: \"Dear Reader, this is the garden I wrote for a child who was ill. I thought the gardens would keep him company.\" There is no signature."], ["The Garden Slug", "A garden slug the size of a loaf of bread glistens across the path, trailing black. \"I only wanted to nibble,\" he sighs. \"The Blot made me bigger. Nobody asked me.\" He looks genuinely sorry."], ["Benjamin Bunny's Plan", "Benjamin Bunny appears with a pocket handkerchief and a diagram. \"Cousin Peter's plans are all pluck and no planning,\" he says. \"Mine are all planning and no pluck. Together...\""], ["Tom Kitten in Trouble", "Tom Kitten has lost his clothes to a passing family of ducks again. \"It really wasn't my fault,\" he mews. The ducks wear his buttons proudly. Nobody in the garden is surprised."], ["Jemima's Foxglove Bonnet", "Jemima Puddle-Duck waddles by in a foxglove bonnet and a hurry. \"I'm looking for a safe place for my eggs,\" she says. \"A kind gentleman with a bushy tail has offered a hand.\""], ["Mrs. Tiggy-Winkle's Washday", "Mrs. Tiggy-Winkle presses a tiny iron to a blotted pinafore. \"Every stain comes out,\" she says, \"if you're patient and kind.\" The ink drips off like water. She hums, unbothered."], ["The Foraging Rat", "A rat named Samuel Whiskers has been foraging the garden for weeks, rolling up whatever he can find, including the cat. He emerges now, whiskers black with ink. \"I've been very busy,\" he says."], ["Squirrel Nutkin's Riddle", "Squirrel Nutkin perches on a branch, chattering riddles at a sleeping owl. \"Riddle me, riddle me, ree,\" he sings. \"What goes on and on, and never ends?\" The answer is a story."], ["Jeremy Fisher's Lily Pad", "Jeremy Fisher sits in his mackintosh on a lily-pad, rod in hand, in perfect peace. \"Every day,\" he says, \"I fish for something small and splendid.\" A trout swims past. He lets it go."], ["The Pond Edge", "The pond reflects the garden perfectly, apart from one bruise of black at the edge. Ducks glide through it, unbothered. \"The thing about ink,\" says Jeremy, \"is that it is only water, in a hurry.\""], ["Peter's Blue Jacket", "Peter's jacket has gone missing again, caught on a gooseberry net. He wriggles free in only his shirt, ears flat. \"It's only a coat,\" he says, shaking. \"I have lost worse.\""], ["Old Brown the Owl", "Old Brown the Owl sits on a stump and does not blink. \"I shall eat you,\" he says, \"if the story calls for it.\" His eyes are dull with ink. \"It does not feel like my own voice, though.\""], ["The Herb Garden", "The herb garden is a calm, fragrant corner under the wall. Lavender, thyme, sage. Mrs. Tiggy-Winkle gives you a handful. \"For nerves,\" she says. \"And a good cup of tea afterward.\""], ["A Second Letter", "Another note, folded in a watering can. \"Dear Reader, he asked for a story about a rabbit who gets into trouble and survives. I wrote one a day. When he got better, he stopped asking.\" The ink has run."], ["A Quiet Morning", "The sun comes up over the garden wall, golden on the dew. For ten minutes, nothing happens. The rabbits eat lettuce. The ducks preen. It is the most quietly victorious moment of your journey."], ["Cottontail's Escape", "Cottontail wriggles under the fence just ahead of the gardener, tail flashing. \"I'm very good at not getting caught,\" he whispers, \"because I'm very good at not being noticed.\""], ["Tod the Fox", "Tod the Fox sits in a hollow tree and sharpens a smile. \"I am not a villain,\" he says. \"I am merely the plot.\" He is not wrong. He is wearing the ink like a dinner jacket."], ["Samuel Whiskers' Roly-Poly", "Samuel Whiskers has rolled Tom Kitten into a pudding. \"I only meant to cook him,\" he says apologetically. Anna Maria, his wife, brandishes a rolling pin. \"Now dear,\" she says, in a terrible voice."], ["The Greenhouse", "A cucumber frame glows in the sunlit greenhouse, and a long line of ink runs along the glass, spelling out three words that you stop reading halfway: \"No one reads this.\""], ["The Gardener's Boots", "The garden shed holds a pair of enormous boots and a rake. Peter eyes them thoughtfully. \"A good disguise,\" he says, \"for a rabbit who intends to be taller.\" He puts one boot on."], ["The Midnight Rabbits", "The rabbits gather at midnight under a full moon to eat the last row of lettuces. Nobody says it out loud, but every one of them knows it is the finest supper they've ever had."], ["A Crow in the Cabbages", "A hungry crow, ink-slick and tired, drops onto the scarecrow's shoulder. \"I only wanted to be told I was clever,\" he says. \"The Blot told me. It was only a trick.\" He flaps off, ashamed."], ["The Gardener's Return", "Mr. McGregor stomps up the path in a flat cap, rake in hand, shouting. His shouting, you notice, has a tune. It is the same tune as the Blot's lullaby. He has been listening too long."], ["Tiggy's Warning", "Mrs. Tigg
